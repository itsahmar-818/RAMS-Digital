    This customer has an outstanding balance of <b>${PKR(Math.abs(b))}</b>. It will no longer show in your totals.
  </div>`:
  `<div style="background:var(--jamabg);border-radius:12px;padding:10px 14px;margin-top:12px;font-size:12.5px;color:var(--jama)">
    <i class="fa-solid fa-check-circle" style="margin-right:6px"></i>Account is clear — safe to delete.
  </div>`;

  showConfirm(`
    <div style="text-align:center;margin-bottom:6px">
      <div style="width:56px;height:56px;border-radius:50%;background:var(--udhaarbg);display:grid;place-items:center;margin:0 auto 14px">
        <i class="fa-solid fa-trash-can" style="font-size:22px;color:var(--udhaar)"></i>
      </div>
      <h3 class="display" style="font-size:21px;font-weight:600;color:var(--ink)">Delete customer?</h3>
      <p style="color:var(--sub);font-size:13px;margin-top:7px"><b style="color:var(--ink)">${esc(c.name)}</b> will be removed from the list and from all totals.</p>
      ${warn}
      <p style="color:var(--sub);font-size:12.5px;margin-top:11px"><i class="fa-solid fa-circle-info" style="margin-right:5px"></i>Their ledger is kept — you can restore them from the deleted list.</p>
    </div>
    <div style="display:flex;gap:10px;margin-top:20px">
      <button class="btn btn-neutral grow" onclick="closeConfirm()">Cancel</button>
      <button class="btn btn-danger grow" onclick="deleteCust('${id}')"><i class="fa-solid fa-trash-can" style="margin-right:7px"></i>Delete</button>
    </div>`);
}

function deleteCust(id){
  const c=custBy(id); if(!c) return;
  c.deleted=true;
  persist(); closeConfirm();
  if(!document.getElementById('sheetRoot').hidden) closeSheet();
  toast('Customer deleted','err');
  if(cur==='profile') nav('customers'); else render(cur);
}

/* ────────────────────────────────────────
   7. PROFILE / LEDGER SCREEN
──────────────────────────────────────── */
function renderProfile(){
  clearFab();
  const el=S('profile');
  const c=custBy(profId); if(!c){ nav('customers'); return; }
  const b=balanceOf(c.id); const t=balTag(b);
  const mine=allTxOf(c.id);
  const rows=mine.filter(isLive).sort(byNewest);
  const dead=mine.filter(x=>x.voided).sort(byNewest);
  /* Running balance is built oldest-first over live entries only, so the
     "Bal" beside the newest row is always the same number as the banner. */
  let r=0; const rMap={};
  [...rows].sort(byOldest).forEach(x=>{ r=money(r+num(x.delta)); rMap[x.id]=r; });
  /* This month at a glance, and the last six months as bars. */
  const mk=mkKey(), mRows=rows.filter(x=>mkKey(x.date)===mk);
  const mMilk=money(mRows.filter(x=>isSale(x)&&pidOf(x)==='milk').reduce((s,x)=>s+num(x.qty),0));
  const mBill=money(mRows.filter(isSale).reduce((s,x)=>s+num(x.amount),0));
  const mPaid=money(mRows.filter(x=>x.type==='pay').reduce((s,x)=>s+num(x.amount),0));
  const lastPay=lastPayOf(c.id);
  const hist=seriesMonths(6,c.id);

  el.innerHTML=`
  <div style="padding-bottom:24px">
    <!-- Balance banner -->
    <div class="pad" style="padding-top:2px">
      <div class="card hero ${b>0?'r':b<0?'b':''}">
        <div class="hrw">
          <div class="av s58" style="${avClr(c.name)}"><span class="ini" style="color:inherit">${esc(inits(c.name))}</span></div>
          <div class="who">
            <div class="g">${b>0?'Outstanding udhaar':b<0?'Advance (jama)':'Account clear'}</div>
            <div class="nm2">${esc(c.name)}</div>
            <div class="meta">${esc(c.phone||'No mobile')} · ${PKR(c.rate)}/L${c.address?' · '+esc(c.address):''}</div>
          </div>
          <button class="gear flat" onclick="openCustSheet('${c.id}')" aria-label="Edit customer">
            <i class="fa-solid fa-pen" style="font-size:13px"></i>
          </button>
        </div>
        <div class="big" style="color:${b>0?'var(--c-alert)':b<0?'var(--b-700)':'var(--ink)'}"><span data-count="${Math.abs(b)}">${t.txt}</span></div>
        <div class="big-l">${lastPay?`Last payment ${fmtShort(lastPay)}`:'No payment recorded yet'}</div>
        <div class="strip">
          <div><div class="k">Month milk</div><div class="v">${Qty(mMilk,'L')}</div></div>
          <div><div class="k">Month billed</div><div class="v">${PKR(mBill)}</div></div>
          <div><div class="k">Month paid</div><div class="v pos">${PKR(mPaid)}</div></div>
        </div>
      </div>
    </div>

    <!-- Action buttons -->
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px 16px 0">
      <button class="btn btn-filled btn-lg" onclick="openEntrySheet('sale','${c.id}',null,'milk')">
        <i class="fa-solid fa-mug-hot"></i> Milk delivered
      </button>
      <button class="btn btn-success btn-lg" onclick="openEntrySheet('pay','${c.id}')">
        <i class="fa-solid fa-hand-holding-dollar"></i> Payment
      </button>
    </div>

    <!-- Everything that isn't milk: dahi, ghee, cream, khoya … -->
    <div style="padding:16px 16px 0">
      <span class="label" style="margin-bottom:8px;padding-left:8px">Other items, tap to bill</span>
      <div class="hscroll" style="display:flex;gap:8px;overflow-x:auto;margin:0 -16px;padding:0 16px 2px">
        ${liveProds().filter(p=>p.id!=='milk').map(p=>`
          <button class="chip chip-2l" onclick="openEntrySheet('sale','${c.id}',null,'${p.id}')">
            <i class="fa-solid ${p.icon}" style="color:${tone(p.color)};font-size:14px"></i>
            <span>${esc(p.name)}<span style="display:block;font-size:11.5px;color:var(--sub);font-weight:500;margin-top:1px">${PKR(rateFor(c,p.id))}/${p.unit}</span></span>
          </button>`).join('')||`<button class="btn btn-ghost btn-sm grow" onclick="nav('items')">
            <i class="fa-solid fa-plus" style="margin-right:6px"></i>Switch items on from the Items tab</button>`}
      </div>
    </div>

    <!-- Secondary actions -->
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;padding:12px 16px 0">
      <button class="tile" onclick="openReceiptModal('${c.id}')">
        <i class="fa-solid fa-receipt" style="color:var(--a-700);font-size:15px"></i> Receipt
      </button>
      <button class="tile" onclick="waSend('${esc(c.phone||'')}',waBillText(custBy('${c.id}')))">
        <i class="fa-brands fa-whatsapp" style="color:#1FA855;font-size:18px"></i> WhatsApp
      </button>
      <button class="tile" onclick="openCustSheet('${c.id}')">
        <i class="fa-solid fa-pen" style="color:var(--n-700);font-size:14px"></i> Edit info
      </button>
    </div>
    ${onLeave(c,today())?`<div style="margin:12px 16px 0;background:var(--goldbg);border-radius:16px;padding:12px 15px;font-size:12.5px;color:var(--gold);font-weight:500">
      <i class="fa-solid fa-plane-departure" style="margin-right:7px"></i>On leave${c.leaveTo?` until ${fmtShort(c.leaveTo)}`:' (no return date set)'} — the Daily Round skips them
    </div>`:''}

    ${rows.length?`<div class="pad">
      <div class="eyebrow">6 mahine ka hisaab <span>billed aur paid</span></div>
      <div class="card chart">${barsHTML(hist)}${BAR_LEGEND}</div>
    </div>`:''}

    <!-- Ledger header -->
    <div class="sec-head">
      <h3>Ledger</h3>
      <span style="font-size:13px;color:var(--sub)">${rows.length} ${rows.length===1?'entry':'entries'}</span>
    </div>

    <!-- Ledger rows -->
    <div class="seglist" style="margin:0 16px">
      ${rows.length?rows.map((x,i)=>ledgerRow(x,rMap[x.id],i)).join('')
        :`<div class="row" style="justify-content:center;text-align:center;color:var(--sub);font-size:14.5px;padding:30px 20px">No entries yet. Use the buttons above to add the first one.</div>`}
    </div>

    <!-- Deleted entries (kept so a mistake is always recoverable) -->
    ${dead.length?`
      <div style="padding:16px 16px 0">
        <button class="btn btn-ghost btn-sm block" onclick="_showVoid=!_showVoid;render('profile')">
          <i class="fa-solid fa-trash-can" style="font-size:12px"></i>
          ${_showVoid?'Hide':'Show'} ${dead.length} deleted ${dead.length===1?'entry':'entries'}
          <i class="fa-solid fa-chevron-${_showVoid?'up':'down'}" style="font-size:11px"></i>
        </button>
      </div>
      ${_showVoid?`<div class="seglist" style="margin:8px 16px 0">
        ${dead.map((x,i)=>ledgerRow(x,null,i)).join('')}
      </div>`:''}
    `:''}
  </div>`;
  kick(el);
}

function ledgerRow(x,running,i){
  const off=!!x.voided;
  const isPay=x.type==='pay';
  const sale=isSale(x)?prodOf(x):null;
  const clr=off?'var(--sub)':isPay?'var(--jama)':'var(--udhaar)';
  const bg=off?'var(--surface2)':isPay?'var(--jamabg)':sale?'var(--c-bg)':'var(--udhaarbg)';
  const ic=isPay?'fa-hand-holding-dollar':sale?sale.icon:'fa-scale-balanced';
  const title=sale?esc(sale.name):x.type==='pay'?'Payment':x.type==='opening'?'Opening balance':'Adjustment';
  const meta=sale?`${Qty(x.qty,unitOf(x))} × ${PKR(x.rate)}/${unitOf(x)}`
    :x.type==='pay'?(x.method||'Cash')+(x.note?` · ${esc(x.note)}`:'')
    :esc(x.note||'');
  const rb=off?null:balTag(running);
  const editable=isSale(x)||x.type==='pay';

  const btn=(fn,icon,label,tone)=>`<button class="icon-btn" onclick="${fn}" title="${label}" aria-label="${label}"
    style="color:${tone.fg}">
    <i class="fa-solid ${icon}" style="font-size:14px"></i></button>`;
  const T={
    del :{fg:'var(--sub)'},
    undo:{fg:'var(--jama)'}
  };
  const editFn=(!off&&editable)?`openEntrySheet('${isSale(x)?'sale':x.type}','${x.cid}','${x.id}')`:'';
  const actions=off
    ? btn(`restoreEntry('${x.id}')`,'fa-rotate-left','Restore entry',T.undo)
    : btn(`event.stopPropagation();confirmDeleteEntry('${x.id}')`,'fa-trash-can','Delete entry',T.del);

  return `<div class="row${editFn?' tap':''}" ${editFn?`onclick="${editFn}" role="button" tabindex="0"`:''} style="gap:11px;padding-right:4px;${off?'opacity:.62':''}">
    <span style="width:40px;height:40px;border-radius:50%;background:${bg};color:${off||!sale?clr:tone(sale.color)};display:grid;place-items:center;flex-shrink:0">
      <i class="fa-solid ${ic}" style="font-size:15px"></i>
    </span>
    <span style="flex:1;min-width:0">
      <span style="display:block;font-weight:700;font-size:14px;line-height:1.3;color:var(--ink);${off?'text-decoration:line-through':''}">${title}</span>
      <span style="display:block;font-size:13px;color:var(--sub);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${meta}</span>
      <span style="display:block;font-size:12.5px;color:var(--sub);margin-top:1px">
        ${fmtMini(x.date)}${off?', <span style="color:var(--udhaar);font-weight:600">deleted</span>':x.editedAt?', <span style="color:var(--gold)">edited</span>':''}
      </span>
    </span>
    <span style="text-align:right;flex-shrink:0">
      <span class="tnum" style="display:block;font-weight:600;font-size:15px;color:${clr};${off?'text-decoration:line-through':''}">${isPay?'−':'+'}${PKR(x.amount)}</span>
      ${rb?`<span class="tnum" style="display:block;font-size:12px;color:${rb.fg};margin-top:2px">${running<0?'Adv':'Bal'} ${rb.txt}</span>`:''}
    </span>
    <span style="display:flex;flex-shrink:0;margin-left:-8px">${actions}</span>
  </div>`;
}

/* ── Delete / restore a single ledger entry ──
   Voiding keeps the row on disk, so a wrong entry can be removed from the
   balance immediately and still be brought back if it was the wrong one. */
function confirmDeleteEntry(id){
  const t=transactions.find(x=>x.id===id); if(!t) return;
  const c=custBy(t.cid);
  const after=money(balanceOf(t.cid)-num(t.delta));
  const at=balTag(after);
  const what=isSale(t)?`${Qty(t.qty,unitOf(t))} ${esc(prodName(t).toLowerCase())} @ ${PKR(t.rate)}/${unitOf(t)}`
    :t.type==='pay'?`${t.method||'Cash'} payment`:'this entry';
  showConfirm(`
    <div style="text-align:center">
      <div style="width:56px;height:56px;border-radius:50%;background:var(--udhaarbg);display:grid;place-items:center;margin:0 auto 14px">
        <i class="fa-solid fa-trash-can" style="font-size:21px;color:var(--udhaar)"></i>
      </div>
      <h3 class="display" style="font-size:21px;font-weight:600;color:var(--ink)">Delete this entry?</h3>
      <p style="color:var(--sub);font-size:13px;margin-top:7px">${esc(c?.name||'Customer')} · ${what}<br>
        <b style="color:var(--ink)">${PKR(t.amount)}</b> on ${fmtShort(t.date)}</p>
      <div style="background:var(--surface2);border-radius:16px;padding:12px 14px;margin-top:14px;display:flex;justify-content:space-between;align-items:center;font-size:13px">
        <span style="color:var(--sub)">Balance after delete</span>
        <b style="color:${at.fg}">${at.txt} ${at.lbl}</b>
      </div>
      <p style="color:var(--sub);font-size:12.5px;margin-top:10px">You can restore it later from the deleted list.</p>
      <div style="display:flex;gap:10px;margin-top:18px">
        <button class="btn btn-neutral grow" onclick="closeConfirm()">Cancel</button>
        <button class="btn btn-danger grow" onclick="deleteEntry('${id}')">Delete</button>
      </div>
    </div>`);
}

function deleteEntry(id){
  const t=transactions.find(x=>x.id===id); if(!t) return;
  t.voided=true; t.voidedAt=new Date().toISOString();
  persist(); closeConfirm();
  toast('Entry deleted','err',{label:'Undo',fn:()=>restoreEntry(id)});
  render(cur);
}

function restoreEntry(id){
  const t=transactions.find(x=>x.id===id); if(!t) return;
  delete t.voided; delete t.voidedAt;
  persist(); toast('Entry restored ✓','ok'); render(cur);
}

/* Older builds wired this to the Reverse button; keep the name working so a
   cached page never calls into nothing. */
function reverseTx(id){ confirmDeleteEntry(id); }

/* ────────────────────────────────────────
   8. ENTRY SHEETS (Milk / Payment)
──────────────────────────────────────── */
/* Live state for the open entry sheet — lets the running preview stay correct
   without threading the balance through every inline oninput handler. */
let _entry=null;

function openEntrySheet(type,cid,editId,pid){
  const c=custBy(cid); if(!c){ toast('Customer not found','err'); return; }
  const ed=editId?transactions.find(t=>t.id===editId):null;
  if(editId&&!ed){ toast('Entry no longer exists','err'); return; }

  /* 'milk' was the only sale type before the catalogue existed; anything that
     still calls with it lands on the milk item. */
  if(type==='milk'){ type='sale'; pid=pid||'milk'; }
  const isMilk=type==='sale';

  /* An explicit item wins (the picker passes one); otherwise an entry being
     edited keeps whatever item it was saved as. */
  const wanted=pid||(ed&&isSale(ed)?pidOf(ed):'milk');
  const P=prodBy(wanted)||liveProds()[0]||prodBy('milk')||DEFAULT_PRODUCTS[0];

  /* When editing, the balance the previews build on must exclude the entry
     being edited — otherwise its old amount is counted twice. */
  const bal=money(balanceOf(cid)-(ed?num(ed.delta):0));
  const accent=isMilk?tone(P.color):'var(--jama-fill)';
  /* The saved rate is only kept while the entry is still the same item —
     switching to ghee must not carry the milk rate across. */
  const rate=(ed&&isSale(ed)&&pidOf(ed)===P.id)?money(num(ed.rate)):rateFor(c,P.id);
  const bt=balTag(bal);
  _entry={type,cid,editId:editId||null,bal,rate,pid:P.id,unit:P.unit};

  /* Quick amounts follow the unit — litres go up in halves, kilos in quarters,
     pieces one at a time. */
  const chips=P.unit==='pcs'||P.unit==='dozen'?[1,2,3,5,10]
    :P.unit==='g'?[100,250,500,750,1000]
    :P.unit==='kg'?[0.25,0.5,1,2,5]
    :[0.5,1,1.5,2,3];
  const qtyChip=v=>`<button class="chip chip-fill" type="button" onclick="setQty(${v})">${Qnum(v)} ${P.unit}</button>`;

  /* Switching item mid-entry re-opens the sheet on the new item so the rate,
     unit and quick amounts all move together. */
  const picker=liveProds().map(p=>{
    const on=p.id===P.id;
    const pc=tone(p.color);
    return `<button class="chip" type="button" data-chip="${p.id}" onclick="openEntrySheet('sale','${cid}',${editId?`'${editId}'`:'null'},'${p.id}')"
      style="border-color:${on?pc:'var(--border2)'};background:${on?pc:'transparent'};color:${on?'#fbf3e4':'var(--ink2)'}">
      <i class="fa-solid ${p.icon}" style="font-size:13px;color:${on?'#fbf3e4':pc}"></i>${esc(p.name)}
    </button>`;
  }).join('');

  openSheet(`
    <div style="padding:16px 20px 12px;flex-shrink:0;border-bottom:1px solid var(--border)">
      <div style="width:32px;height:4px;border-radius:99px;background:var(--border2);margin:0 auto 16px"></div>
      <div style="display:flex;align-items:center;gap:11px">
        <span style="width:44px;height:44px;border-radius:50%;background:${accent};display:grid;place-items:center;flex-shrink:0">
          <i class="fa-solid ${isMilk?P.icon:'fa-hand-holding-dollar'}" style="color:#fbf3e4;font-size:16px"></i>
        </span>
        <div>
          <h3 class="display" style="font-size:21px;font-weight:600;color:var(--ink)">${ed?'Edit ':''}${isMilk?esc(P.name)+' delivered':'Payment received'}</h3>
          <p style="font-size:12.5px;color:var(--sub)">${esc(c.name)} · <span style="color:${bt.fg};font-weight:600">${bt.lbl} ${bt.txt}</span></p>
        </div>
      </div>
    </div>

    <div class="scroll" style="flex:1;min-height:0;padding:18px 20px;display:flex;flex-direction:column;gap:14px">
      ${isMilk?`
        <div>
          <label class="label">Item</label>
          <div class="hscroll" style="display:flex;gap:6px;overflow-x:auto;padding-bottom:3px">${picker}</div>
        </div>`:''}

      <div>
        <label class="label">Date</label>
        <input id="e_date" type="date" class="field mono" value="${ed?.date||today()}" max="${today()}">
      </div>

      ${isMilk?`
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
          <div>
            <label class="label">Quantity (${P.unit}) *</label>
            <input id="e_qty" type="number" inputmode="decimal" step="${P.unit==='pcs'||P.unit==='dozen'?'1':P.unit==='g'?'50':'0.25'}" min="0" class="field mono display" style="text-align:center;font-size:24px;min-height:58px" placeholder="0" value="${ed?ed.qty:(P.id==='milk'?(c.defaultQty||''):'')}" oninput="calcEntry()">
          </div>
          <div>
            <label class="label">Rate / ${P.unit}</label>
            <input id="e_rate" type="number" inputmode="decimal" min="0" class="field mono display" style="text-align:center;font-size:24px;min-height:58px" value="${rate||''}" oninput="calcEntry()">
          </div>
        </div>
        <div style="display:grid;grid-template-columns:repeat(5,1fr);gap:6px">
          ${chips.map(qtyChip).join('')}
        </div>
        ${rateFor(c,P.id)!==money(num(P.rate))?`<p style="font-size:12px;color:var(--gold);margin-top:-4px"><i class="fa-solid fa-tag" style="margin-right:5px"></i>Special rate for ${esc(c.name)} — shop rate is ${PKR(P.rate)}/${P.unit}</p>`:''}
        <div style="background:var(--a-100);border-radius:var(--radius-lg);padding:14px 18px;display:flex;align-items:center;justify-content:space-between">
          <span class="kk" style="color:var(--a-700);font-size:10.5px">Bill amount</span>
          <span class="tnum display" id="e_calc" style="font-size:28px;color:var(--a-700)">Rs 0</span>
        </div>
        <div id="e_balPreview" style="background:var(--surface2);border-radius:var(--radius-lg);padding:14px 18px"></div>
      `:`
        <div>
          <label class="label">Amount received (Rs) *</label>
          <input id="e_amt" type="number" inputmode="decimal" min="0" class="field mono display" style="text-align:center;font-size:28px;min-height:62px" placeholder="0" value="${ed?ed.amount:''}" oninput="calcEntry()">
        </div>
        ${bal>0?`<button class="btn btn-sm block" type="button" onclick="setAmt(${bal})"
          style="background:var(--jamabg);color:var(--jama)">
          <i class="fa-solid fa-check-double" style="margin-right:6px"></i>Full settlement — ${PKR(bal)}
        </button>`:''}
        <div>
          <label class="label">Payment method</label>
          <select id="e_method" class="field">
            ${['Cash','JazzCash','EasyPaisa','Bank Transfer','Other'].map(x=>`<option${ed&&ed.method===x?' selected':''}>${x}</option>`).join('')}
          </select>
        </div>
        <div id="e_balPreview" style="background:var(--surface2);border-radius:var(--radius-lg);padding:14px 18px"></div>
      `}

      <div>
        <label class="label">Note (optional)</label>
        <input id="e_note" class="field" placeholder="Add a note…" value="${esc(ed?.note||'')}">
      </div>
    </div>

    <div style="padding:14px 20px;padding-bottom:calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--border);display:flex;gap:10px;flex-shrink:0">
      <button class="btn btn-neutral grow" onclick="closeSheet()">Cancel</button>
      <button class="btn grow ${isMilk?'btn-filled':'btn-success'}" id="e_save" onclick="saveEntry()">${ed?'Update entry':'Save entry'}</button>
    </div>`);

  calcEntry();
  setTimeout(()=>document.getElementById(isMilk?'e_qty':'e_amt')?.focus(),130);
  /* With eight items the strip scrolls; bring the chosen one into view so the
     sheet never opens looking like nothing is selected. */
  setTimeout(()=>chipIntoView(`[data-chip="${P.id}"]`),170);
}

/* Centres a chip inside its own horizontal strip without moving the page. */
function chipIntoView(sel){
  const el=document.querySelector(sel); if(!el) return;
  const box=el.parentElement; if(!box) return;
  box.scrollLeft=Math.max(0, el.offsetLeft-(box.clientWidth-el.offsetWidth)/2);
}

function setQty(v){
  const el=document.getElementById('e_qty'); if(!el) return;
  el.value=v; calcEntry(); el.focus();
}
function setAmt(v){
  const el=document.getElementById('e_amt'); if(!el) return;
  el.value=money(v); calcEntry(); el.focus();
}

const balLine=v=>v>0?`<b style="color:var(--udhaar)">${PKR(v)} Udhaar</b>`
  :v<0?`<b style="color:var(--jama)">${PKR(-v)} Advance</b>`
  :`<b style="color:var(--jama)">Account clear</b>`;

/* One preview routine for both sheets: current balance → this entry → result.
   Whatever it shows is exactly what the ledger will read after saving. */
function calcEntry(){
  if(!_entry) return;
  const {type,bal,rate,pid}=_entry;
  const box=document.getElementById('e_balPreview');
  let after=bal, label='';

  if(type==='sale'){
    const q=num(document.getElementById('e_qty')?.value);
    const r=num(document.getElementById('e_rate')?.value)||rate;
    const amt=money(q*r);
    const el=document.getElementById('e_calc'); if(el) el.textContent=PKR(amt);
    after=money(bal+amt); label='After this '+(prodBy(pid)?.name||'item').toLowerCase();
  } else {
    const amt=money(num(document.getElementById('e_amt')?.value));
    after=money(bal-amt); label='After payment';
  }
  if(!box) return;
  box.innerHTML=`
    <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:8px">
      <span style="color:var(--sub)">Current balance</span>${balLine(bal)}
    </div>
    <div style="height:1px;background:var(--border);margin-bottom:8px"></div>
    <div style="display:flex;justify-content:space-between;font-size:13px">
      <span style="color:var(--sub)">${label}</span>${balLine(after)}
    </div>`;
}

/* Guards a double-tap on Save from writing the entry twice — a silent way for
   a day's milk to be billed at double. */
let _saving=false;

/* Shown when milk is already on the books for that customer and date. Two
   deliveries a day are legitimate, so this asks rather than blocks. */
function confirmDuplicate(c,date,already,patch){
  const P=prodBy(patch.pid)||{name:'Item',unit:patch.unit||'kg'};
  const lt=money(already.reduce((s,t)=>s+num(t.qty),0));
  const amt=money(already.reduce((s,t)=>s+num(t.amount),0));
  showConfirm(`
    <div style="text-align:center">
      <div style="width:56px;height:56px;border-radius:50%;background:var(--goldbg);display:grid;place-items:center;margin:0 auto 14px">
        <i class="fa-solid fa-triangle-exclamation" style="font-size:21px;color:var(--gold)"></i>
      </div>
      <h3 class="display" style="font-size:21px;font-weight:600;color:var(--ink)">${esc(P.name)} already recorded</h3>
      <p style="color:var(--sub);font-size:13px;margin-top:7px">${esc(c.name)} already has
        <b style="color:var(--ink)">${Qty(lt,P.unit)}</b> (${PKR(amt)}) on <b style="color:var(--ink)">${fmtShort(date)}</b>
        ${already.length>1?`<br>across ${already.length} entries`:''}.</p>
      <div style="background:var(--surface2);border-radius:16px;padding:12px 14px;margin-top:14px;text-align:left">
        ${already.map(t=>`<div style="display:flex;justify-content:space-between;font-size:12.5px;padding:3px 0">
          <span style="color:var(--sub)">${Qty(t.qty,unitOf(t))} × ${PKR(t.rate)}/${unitOf(t)}</span><b style="color:var(--ink)">${PKR(t.amount)}</b></div>`).join('')}
        <div style="height:1px;background:var(--border);margin:7px 0"></div>
        <div style="display:flex;justify-content:space-between;font-size:12.5px">
          <span style="color:var(--gold);font-weight:600">Adding now</span>
          <b style="color:var(--gold)">${Qty(patch.qty,P.unit)} · ${PKR(patch.amount)}</b>
        </div>
      </div>
      <p style="color:var(--sub);font-size:12.5px;margin-top:10px">Add it only if this is a second delivery. Otherwise cancel and edit the existing entry.</p>
      <div style="display:flex;gap:10px;margin-top:18px">
        <button class="btn btn-neutral grow" onclick="closeConfirm()">Cancel</button>
        <button class="btn btn-filled grow" onclick="closeConfirm();saveEntry(true)">Add anyway</button>
      </div>
    </div>`);
}

function saveEntry(confirmed){
  if(_saving||!_entry) return;
  const {type,cid,editId,pid}=_entry;
  const c=custBy(cid); if(!c){ toast('Customer not found','err'); return; }

  let date=(document.getElementById('e_date')?.value||'').trim()||today();
  if(date>today()){ date=today(); toast('Future date not allowed — set to today','warn'); }
  const note=(document.getElementById('e_note')?.value||'').trim();

  let patch;
  if(type==='sale'){
    const P=prodBy(pid)||prodBy('milk')||DEFAULT_PRODUCTS[0];
    const qty=money(num(document.getElementById('e_qty')?.value));
    const rate=money(num(document.getElementById('e_rate')?.value)||rateFor(c,P.id));
    if(qty<=0){ toast(`Enter ${P.name.toLowerCase()} quantity`,'err'); return; }
    if(rate<=0){ toast(`Enter a valid rate per ${P.unit}`,'err'); return; }
    if(qty>5000){ toast('Quantity looks too large — please check','err'); return; }
    const amount=money(qty*rate);
    patch={type:'sale',pid:P.id,date,qty,unit:P.unit,rate,amount,delta:amount,note};
  } else {
    const amount=money(num(document.getElementById('e_amt')?.value));
    if(amount<=0){ toast('Enter payment amount','err'); return; }
    patch={type:'pay',date,amount,delta:-amount,method:document.getElementById('e_method').value,note};
  }

  /* Billing the same item on the same day twice is the easiest mistake to make
     and the hardest to spot later, so a repeat has to be deliberate. Only the
     same item counts — milk in the morning and ghee in the evening is normal. */
  if(type==='sale'&&!editId&&!confirmed){
    const already=saleOn(cid,date,patch.pid);
    if(already.length){
      confirmDuplicate(c,date,already,patch);
      return;
    }
  }

  _saving=true;
  const btn=document.getElementById('e_save');
  if(btn){ btn.disabled=true; btn.style.opacity='.6'; btn.style.pointerEvents='none'; }
  try{
    if(editId){
      const t=transactions.find(x=>x.id===editId);
      if(!t){ toast('Entry no longer exists','err'); closeSheet(); return; }
      Object.assign(t,patch,{editedAt:new Date().toISOString()});
      toast(type==='sale'?`${prodBy(patch.pid)?.name||'Item'} entry updated ✓`:'Payment updated ✓','ok');
    } else {
      transactions.push({id:uid(),cid,createdAt:new Date().toISOString(),...patch});
      toast(type==='sale'?`${prodBy(patch.pid)?.name||'Item'} entry saved ✓`:'Payment recorded ✓','ok');
    }
    persist(); _entry=null; closeSheet(); render(cur);
  } finally {
    setTimeout(()=>{ _saving=false; },400);
  }
}

/* ────────────────────────────────────────
   9. BILL & STATEMENT ENGINE
   One layout answers what a customer asks at the door: how much, for what,
   on which days, and what has already been paid. There is no short/long
   switch any more — the bill always carries its own detail, and picks the
   form of that detail from the length of the period:
     up to two months → a day-by-day milk grid plus the other dated entries
     longer, few rows → every entry with its date and running balance
     longer, many rows→ one line per month
──────────────────────────────────────── */

const fmtDM =d=>{ const x=parseD(d); return x?x.toLocaleDateString('en-GB',{day:'2-digit',month:'short'}):d; };
const ymd   =x=>x.toLocaleDateString('en-CA');

/* The bill is laid out at one fixed width so the saved image and PDF are the
   same shape whatever phone made them. On screen it is scaled to fit the
   sheet; the export still renders the node at full size off-stage. */
function fitReceiptPreview(){
  const wrap=document.getElementById('receiptPreviewWrap'); if(!wrap) return;
  const node=wrap.querySelector('#receiptNode'); if(!node) return;
  node.style.transform='none';
  wrap.style.height='';
  const avail=wrap.clientWidth;
  if(!avail) return;              // still hidden — the open handler re-runs this
  const s=Math.min(1, avail/RC.W);
  node.style.transformOrigin='top left';
  node.style.transform=`scale(${s})`;
  wrap.style.height=Math.ceil(node.offsetHeight*s)+'px';
}

/* ── What the bill covers ── */
function receiptData(cid){
  const c=custBy(cid); if(!c) return null;
  const all=txOf(cid).sort(byOldest);
  let from,to,title,kind;
  if(_rscope==='range'){
    from=_rfrom||today(); to=_rto||today();
    if(from>to){ const x=from; from=to; to=x; }
    title=from===to?fmtDMY(from):`${fmtDM(from)} to ${fmtDMY(to)}`; kind='Statement';
  } else if(_rscope==='all'){
    from=all.length?all[0].date:today();
    to=all.length&&all[all.length-1].date>today()?all[all.length-1].date:today();
    title='Full statement'; kind='Statement';
  } else {
    const [y,m]=_rmonth.split('-').map(Number);
    from=_rmonth+'-01';
    to=_rmonth+'-'+String(new Date(y,m,0).getDate()).padStart(2,'0');
    title=monthLbl(_rmonth); kind='Bill';
  }
  const rows=all.filter(t=>t.date>=from&&t.date<=to);
  const opening=_rscope==='all'?0:money(all.filter(t=>t.date<from).reduce((s,t)=>s+num(t.delta),0));
  const items=itemBreakdown(rows);
  const goods=money(items.reduce((s,i)=>s+i.amount,0));
  const pays=rows.filter(t=>t.type==='pay');
  const paid=money(pays.reduce((s,t)=>s+num(t.amount),0));
  const closing=money(opening+rows.reduce((s,t)=>s+num(t.delta),0));
  /* Whatever is left after goods and payments — an opening figure typed in
     when the account was made, or an adjustment. Printing it is what makes
     the lines on the bill always add up to the total under them. */
  const other=money(closing-opening-goods+paid);
  const days=Math.round((parseD(to)-parseD(from))/864e5)+1;
  const mode=(_rscope!=='all'&&days<=62)?'daily':rows.length<=60?'ledger':'monthly';
  const serial=String(Math.max(1,customers.indexOf(c)+1)).padStart(3,'0');
  const no=kind==='Bill'?_rmonth.slice(2).replace('-','')+'-'+serial:'S'+to.slice(2).replace(/-/g,'')+'-'+serial;
  return {c,all,rows,from,to,title,kind,opening,items,goods,pays,paid,other,closing,days,mode,no};
}

/* ── Day-by-day milk ──
   The part a household actually checks: which days the milk came. */
function rcDailyGrid(d){
  const milk=d.rows.filter(t=>isSale(t)&&pidOf(t)==='milk');
  if(!milk.length) return '';
  const byDay={}; milk.forEach(t=>byDay[t.date]=money((byDay[t.date]||0)+num(t.qty)));
  const unit=unitOf(milk[0]);
  /* The grid runs only over days that could have had a delivery: not before
     the account's first entry, and not past today. */
  const first=d.all.length?d.all[0].date:d.from, td=today();
  const gs=d.from<first?first:d.from, ge=d.to>td?td:d.to;
  if(gs>ge) return '';
  const oneMonth=mkKey(gs)===mkKey(ge);
  let cells='', got=0, naga=0, total=0;
  for(const x=parseD(gs); ymd(x)<=ge; x.setDate(x.getDate()+1)){
    const ds=ymd(x), q=byDay[ds]||0;
    const lbl=oneMonth?x.toLocaleDateString('en-GB',{day:'numeric',weekday:'short'}).replace(',','')
                      :x.toLocaleDateString('en-GB',{day:'numeric',month:'short'});
    let val, vs, bg='#fff';
    if(q>0){ got++; total=money(total+q); val=Qnum(q); vs=`font-size:15px;font-weight:700;color:${RC.ink}`; }
    else if(onLeave(d.c,ds)){ val='Chhutti'; vs=`font-size:11px;font-weight:600;color:${RC.amber};padding-top:3px`; bg=RC.amberSoft; }
    else { naga++; val='Naga'; vs=`font-size:11.5px;font-weight:600;color:${RC.red};padding-top:3px`; bg=RC.redSoft; }
    cells+=`<div style="border:1px solid ${RC.line};border-radius:8px;background:${bg};text-align:center;padding:5px 0 5px;height:46px;box-sizing:border-box">
        <div style="font-size:10.5px;color:${RC.sub};line-height:1.15;white-space:nowrap">${lbl}</div>
        <div style="line-height:1.2;margin-top:2px;${vs}">${val}</div>
      </div>`;
  }
  const span=gs===ge?fmtDM(gs):oneMonth?`${parseD(gs).getDate()} to ${fmtDM(ge)}`:`${fmtDM(gs)} to ${fmtDM(ge)}`;
  return `${rcHead(`Daily milk (${unit==='L'?'litres':esc(unit)})`,span)}
    <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px">${cells}</div>
    <div style="display:flex;justify-content:space-between;gap:10px;margin-top:9px;font-size:12.5px;color:${RC.ink2}">
      <span>Milk came on <b style="font-weight:700;color:${RC.ink}">${got}</b> ${got===1?'day':'days'}${naga?`, naga on <b style="font-weight:700;color:${RC.red}">${naga}</b>`:''}</span>
      <span>Total <b style="font-weight:700;color:${RC.ink}">${Qty(total,unit)}</b></span>
    </div>`;
}

/* Dated lines for everything the grid does not show. */
function rcEntryList(rows,title){
  if(!rows.length) return '';
  return `${rcHead(title)}
    <table style="width:100%;border-collapse:collapse">
      <tbody>${rows.map(t=>`<tr>
        ${rcTd(fmtDM(t.date),'left',`white-space:nowrap;color:${RC.sub};width:58px;padding-left:0`)}
        ${rcTd(rcDetail(t))}
        ${rcTd(rcSigned(num(t.delta)),'right',`white-space:nowrap;font-weight:600;padding-right:0;color:${t.delta<0?RC.green:RC.ink}`)}
      </tr>`).join('')}</tbody>
    </table>`;
}

/* Every entry with its date and the balance after it. */
function rcLedger(d){
  let run=d.opening;
  const body=d.rows.map(t=>{
    run=money(run+num(t.delta));
    return `<tr>
      ${rcTd(fmtDM(t.date)+(d.days>300?' '+t.date.slice(2,4):''),'left',`white-space:nowrap;color:${RC.sub}`)}
      ${rcTd(rcDetail(t))}
      ${rcTd(rcSigned(num(t.delta)),'right',`white-space:nowrap;font-weight:600;color:${t.delta<0?RC.green:RC.ink}`)}
      ${rcTd(rcBal(run),'right',`white-space:nowrap;color:${run>0?RC.red:run<0?RC.green:RC.sub}`)}
    </tr>`;
  }).join('');
  const open=d.opening!==0?`<tr>
      ${rcTd(fmtDM(d.from),'left',`white-space:nowrap;color:${RC.sub}`)}
      ${rcTd('Balance from before','left',`color:${RC.sub}`)}
      ${rcTd('','right')}
      ${rcTd(rcBal(d.opening),'right',`white-space:nowrap;color:${d.opening>0?RC.red:RC.green}`)}
    </tr>`:'';
  return `${rcHead('Date-wise detail',`${d.rows.length} ${d.rows.length===1?'entry':'entries'}`)}
    <table style="width:100%;border-collapse:collapse">
      <thead><tr>${rcTh('Date','left','62px')}${rcTh('Detail')}${rcTh('Amount','right')}${rcTh('Balance','right')}</tr></thead>
      <tbody>${open}${body}</tbody>
    </table>`;
}

/* One line per month, for accounts too long to list entry by entry. */
function rcMonthly(d){
  const map=new Map();
  d.rows.forEach(t=>{
    const k=mkKey(t.date), e=map.get(k)||{goods:0,paid:0,net:0};
    if(isSale(t)) e.goods=money(e.goods+num(t.amount));
    if(t.type==='pay') e.paid=money(e.paid+num(t.amount));
    e.net=money(e.net+num(t.delta)); map.set(k,e);
  });
  let run=d.opening;
  const body=[...map.entries()].sort((a,b)=>a[0].localeCompare(b[0])).map(([k,e])=>{
    run=money(run+e.net);
    return `<tr>
      ${rcTd(monthLbl(k),'left','white-space:nowrap')}
      ${rcTd(PKR(e.goods),'right','white-space:nowrap')}
      ${rcTd(e.paid?PKR(e.paid):'','right',`white-space:nowrap;color:${RC.green}`)}
      ${rcTd(rcBal(run),'right',`white-space:nowrap;font-weight:600;color:${run>0?RC.red:run<0?RC.green:RC.sub}`)}
    </tr>`;
  }).join('');
  const open=d.opening!==0?`<tr>${rcTd('Balance from before','left',`color:${RC.sub}`)}${rcTd('','right')}${rcTd('','right')}
      ${rcTd(rcBal(d.opening),'right',`white-space:nowrap;color:${d.opening>0?RC.red:RC.green}`)}</tr>`:'';
  return `${rcHead('Month-wise detail',`${map.size} ${map.size===1?'month':'months'}`)}
    <table style="width:100%;border-collapse:collapse">
      <thead><tr>${rcTh('Month')}${rcTh('Goods','right')}${rcTh('Paid','right')}${rcTh('Balance','right')}</tr></thead>
      <tbody>${open}${body}</tbody>
    </table>
    <div style="font-size:12px;color:${RC.sub};margin-top:9px">For the day-by-day detail of any month, make that month's bill.</div>`;
}

/* ── THE BILL ── */
function buildReceiptHTML(cid){
  const d=receiptData(cid); if(!d) return '';
  const {c}=d;

  /* How the total is reached, top to bottom. */
  const sum=[];
  if(d.opening>0) sum.push(rcLine('Previous balance','',PKR(d.opening)));
  if(d.opening<0) sum.push(rcLine('Advance from before','',rcSigned(d.opening),{clr:RC.green}));
  d.items.forEach(it=>sum.push(rcLine(
    `<span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${it.color};margin-right:8px;vertical-align:1px"></span>${esc(it.name)}${it.urdu?` <span dir="rtl" style="unicode-bidi:isolate;color:${RC.sub};font-size:12.5px">${esc(it.urdu)}</span>`:''}`,
    it.rate?`${Qty(it.qty,it.unit)} × ${PKR(it.rate)}`:`${Qty(it.qty,it.unit)}, mixed rates`,
    PKR(it.amount))));
  if(d.other!==0) sum.push(rcLine('Opening balance / adjustment','',rcSigned(d.other),d.other<0?{clr:RC.green}:{}));
  if(d.items.length>1) sum.push(rcLine(d.kind==='Bill'?`Total goods, ${d.title}`:'Total goods','',PKR(d.goods),{top:true,bold:true}));
  if(d.paid!==0) sum.push(rcLine('Payments received',`${d.pays.length} ${d.pays.length===1?'payment':'payments'}`,rcSigned(-d.paid),{clr:RC.green}));
  if(!sum.length) sum.push(`<div style="padding:14px 0;text-align:center;font-size:13px;color:${RC.sub}">No entries in this period.</div>`);

  const st=d.closing>0?{bg:RC.redSoft,fg:RC.red,lbl:'Balance payable',note:'Please pay at your convenience.',val:PKR(d.closing)}
          :d.closing<0?{bg:RC.greenSoft,fg:RC.green,lbl:'Advance with shop',note:'This amount is held as your advance.',val:PKR(-d.closing)}
          :{bg:RC.soft,fg:RC.ink2,lbl:'Account clear',note:'Nothing to pay. Thank you!',val:'Rs 0'};

  let detail='';
  if(d.mode==='daily'){
    const grid=rcDailyGrid(d);
    const rest=grid?d.rows.filter(t=>!(isSale(t)&&pidOf(t)==='milk')):d.rows;
    detail=grid+rcEntryList(rest,grid?'Other items and payments':'Date-wise detail');
  } else if(d.rows.length){
    detail=d.mode==='ledger'?rcLedger(d):rcMonthly(d);
  }

  return `<div id="receiptNode" style="width:${RC.W}px;box-sizing:border-box;padding:24px 24px 18px;background:#fff;color:${RC.ink};font-family:${RC.font};font-size:13px;line-height:1.35">
    ${rcHeader(d.kind,`No. ${d.no}`)}

    <div style="display:flex;justify-content:space-between;gap:16px;margin-top:16px">
      <div style="min-width:0">
        <div style="font-size:12px;color:${RC.sub}">${d.kind==='Bill'?'Bill to':'Customer'}</div>
        <div style="font-size:17px;font-weight:700;color:${RC.ink};margin-top:2px;line-height:1.25">${esc(c.name)}</div>
        <div style="font-size:12.5px;color:${RC.ink2};margin-top:3px">${[c.phone,c.address].filter(Boolean).map(esc).join(', ')||'&nbsp;'}</div>
      </div>
      <div style="text-align:right;flex-shrink:0">
        <div style="font-size:12px;color:${RC.sub}">${d.kind==='Bill'?'Bill month':'Period'}</div>
        <div style="font-size:15px;font-weight:700;color:${RC.ink};margin-top:2px;white-space:nowrap">${d.title}</div>
        <div style="font-size:12.5px;color:${RC.ink2};margin-top:3px;white-space:nowrap">${_rscope==='all'?`${fmtDMY(d.from)} to ${fmtDMY(d.to)}`:`Issued ${fmtDMY(today())}`}</div>
      </div>
    </div>

    <div style="margin-top:16px;border:1px solid ${RC.line};border-radius:14px;overflow:hidden">
      <div style="padding:8px 16px 9px">${sum.join('')}</div>
      <div style="background:${st.bg};padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px">
        <div style="min-width:0">
          <div style="font-size:15px;font-weight:700;color:${st.fg}">${st.lbl}</div>
          <div style="font-size:12px;color:${st.fg};margin-top:2px">${st.note}</div>
        </div>

/* ── Saving and sharing ── */
function receiptFileName(c,d){
  const who=c.name.trim().replace(/[^\w]+/g,'_').replace(/^_|_$/g,'')||'Customer';
  const when=_rscope==='month'?monthLbl(_rmonth).replace(/\s+/g,'-'):_rscope==='all'?'Full-statement':`${d.from}_to_${d.to}`;
  return `${d.kind}_${who}_${when}`;
}
function saveBlob(blob,name){
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),5000);
}
/* A page is never cut through the middle of a row: a bill that fits is
   centred on A4, anything longer becomes one tall page of its own. */
function canvasToPdf(canvas,name){
  const {jsPDF}=window.jspdf;
  const ratio=canvas.height/canvas.width, M=12;
  const w=Math.min(170,(297-2*M)/ratio);
  let pdf;
  if(w>=100){
    pdf=new jsPDF({orientation:'p',unit:'mm',format:'a4'});
    pdf.addImage(canvas.toDataURL('image/png'),'PNG',(210-w)/2,M,w,w*ratio);
  } else {
    const W=160, H=W*ratio;
    pdf=new jsPDF({orientation:'p',unit:'mm',format:[W+2*M,H+2*M]});
    pdf.addImage(canvas.toDataURL('image/png'),'PNG',M,M,W,H);
  }
  pdf.save(name+'.pdf');
}
async function renderForExport(html){
  const stage=document.getElementById('exportStage');
  stage.innerHTML=html;
  try{ if(document.fonts&&document.fonts.ready) await document.fonts.ready; }catch{}
  await new Promise(r=>setTimeout(r,140));
  const node=stage.firstElementChild;
  /* Browsers refuse canvases taller than about 16,000px, so a very long
     statement is drawn a little less sharp rather than failing outright. */
  const scale=Math.max(1.2,Math.min(2.6,15000/Math.max(1,node.offsetHeight)));
  try{ return await html2canvas(node,{scale,backgroundColor:'#ffffff',useCORS:true,logging:false}); }
  finally{ stage.innerHTML=''; }
}

let _exporting=false;
async function receiptDownload(kind){
  if(_exporting) return;
  const c=custBy(_rcid), d=receiptData(_rcid); if(!c||!d) return;
  const btn=document.getElementById({share:'btnDlShare',png:'btnDlPng',pdf:'btnDlPdf'}[kind]);
  const orig=btn.innerHTML;
  _exporting=true;
  btn.innerHTML='<i class="fa-solid fa-spinner fa-spin"></i> Wait';
  btn.style.opacity='.7';
  try{
    const canvas=await renderForExport(buildReceiptHTML(_rcid));
    const name=receiptFileName(c,d);
    if(kind==='pdf'){ canvasToPdf(canvas,name); toast('PDF saved','ok'); return; }
    const blob=await new Promise(r=>canvas.toBlob(r,'image/png'));
    if(!blob) throw new Error('empty image');
    if(kind==='share'){
      const file=new File([blob],name+'.png',{type:'image/png'});
      if(navigator.canShare&&navigator.canShare({files:[file]})){
        try{ await navigator.share({files:[file],title:`${d.kind} for ${c.name}`}); return; }
        catch(e){ if(e&&e.name==='AbortError') return; console.warn('[SHARE]',e); }
      }
      /* No share sheet here (or it refused) — the image is still handed over. */
      saveBlob(blob,name+'.png'); toast('Image saved. Send it from your gallery.','info');
    } else {
      saveBlob(blob,name+'.png'); toast('Image saved','ok');
    }
  }catch(e){ console.error(e); toast('Could not make the bill. Please try again.','err'); }
  finally{ btn.innerHTML=orig; btn.style.opacity=''; _exporting=false; }
}

/* Inline rate edit — the one thing the shop changes often, so it never needs
   a sheet or a save button. */
function setProdRate(pid,val){
  const p=prodBy(pid); if(!p) return;
  const r=money(num(val));
  if(r<0){ toast('Rate cannot be negative','err'); renderItems(); return; }
  p.rate=r; persist();
  toast(`${p.name} rate ${PKR(r)}/${p.unit} ✓`,'ok');
  renderItems();
}

function toggleProd(pid){
  const p=prodBy(pid); if(!p) return;
  /* Never leave the catalogue empty — the round and the entry sheets would
     have nothing to offer. */
  if(p.active!==false&&liveProds().length<=1){ toast('At least one item must stay on','err'); return; }
  p.active=p.active===false;
  persist(); toast(`${p.name} ${p.active?'switched on':'switched off'}`,p.active?'ok':'warn');

}

function pickProdColor(cl){
  document.getElementById('p_color').value=cl;
  document.querySelectorAll('[data-pcolor]').forEach(b=>b.style.borderColor=b.dataset.pcolor===cl?'var(--ink)':'transparent');
  paintProdPreview();
}
function paintProdPreview(){
  const box=document.getElementById('pv_icon'); if(!box) return;
  box.style.background=document.getElementById('p_color').value;
  box.innerHTML=`<i class="fa-solid ${document.getElementById('p_icon').value}" style="color:#fbf3e4;font-size:16px"></i>`;
}

function saveProd(pid){
  const name=(document.getElementById('p_name').value||'').trim();
  const urdu=(document.getElementById('p_urdu').value||'').trim();
  const unit=document.getElementById('p_unit').value||'kg';
  const rate=money(num(document.getElementById('p_rate').value));
  const icon=document.getElementById('p_icon').value||'fa-box';
  const color=document.getElementById('p_color').value||'#8A3E23';
  if(!name){ toast('Item name is required','err'); return; }
  if(rate<=0){ toast('Enter a valid rate','err'); return; }
  const clash=products.some(p=>p.id!==pid&&p.name.toLowerCase()===name.toLowerCase());
  if(clash){ toast('An item with this name already exists','err'); return; }

  if(pid){
    const p=prodBy(pid); if(!p){ toast('Item not found','err'); return; }
    Object.assign(p,{name,urdu,unit,rate,icon,color});
  } else {
    products.push({id:newPid(),name,urdu,unit,rate,icon,color,builtin:false,active:true});
  }
  persist(); closeSheet();
  toast(pid?'Item updated ✓':'Item added ✓','ok');
  nav('items');
}

function confirmDeleteProd(pid){
  const p=prodBy(pid); if(!p) return;
  const used=transactions.filter(t=>isSale(t)&&pidOf(t)===pid).length;
  showConfirm(`
    <div style="text-align:center">
      <div style="width:56px;height:56px;border-radius:50%;background:var(--udhaarbg);display:grid;place-items:center;margin:0 auto 14px">
        <i class="fa-solid fa-trash-can" style="font-size:21px;color:var(--udhaar)"></i>
      </div>
      <h3 class="display" style="font-size:21px;font-weight:600;color:var(--ink)">Delete ${esc(p.name)}?</h3>
      ${used?`<div style="background:var(--goldbg);border-radius:12px;padding:12px 14px;margin-top:14px;font-size:12.5px;color:var(--gold);text-align:left">
        <i class="fa-solid fa-triangle-exclamation" style="margin-right:6px"></i>
        <b>${used}</b> ledger ${used===1?'entry uses':'entries use'} this item. Those entries keep their amounts, but the item name will read as a plain code on old receipts.
        <br><br>Switching it off instead keeps every receipt readable.
      </div>`:`<p style="color:var(--sub);font-size:13px;margin-top:8px">No entries use this item — safe to delete.</p>`}
      <div style="display:flex;gap:10px;margin-top:18px">
        <button class="btn btn-neutral grow" onclick="closeConfirm()">Cancel</button>
        <button class="btn btn-danger grow" onclick="deleteProd('${pid}')">Delete</button>
      </div>
    </div>`);
}

function deleteProd(pid){
  const p=prodBy(pid); if(!p||p.builtin) return;
  products=products.filter(x=>x.id!==pid);
  if(_roundPid===pid) _roundPid=(liveProds()[0]||{id:'milk'}).id;
  persist(); closeConfirm(); closeSheet();
  toast('Item deleted','err');
  nav('items');
}

/* ── Udhaar reminders ──
   Who owes money and has gone longest without paying. Ordered by silence
   rather than amount, because a small balance untouched for two months is a
   worse sign than a large one paid down last week. */
let _remindDays=14;

function overdueList(minDays){
  return alive()
    .map(c=>{
      const b=balanceOf(c.id);
      const last=lastPayOf(c.id);
      /* Never paid — measure from the first entry so a new customer isn't
         instantly flagged as months overdue. */
      const from=last||txOf(c.id).sort(byOldest)[0]?.date||today();
      return {c, b, last, days:daysSince(from)??0};
    })
    .filter(x=>x.b>0&&x.days>=minDays)
    .sort((a,b)=>b.days-a.days||b.b-a.b);
}

  const box=document.getElementById('repRemind'); if(!box) return;
  const list=overdueList(_remindDays);

    <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap">

      </div>

              <span style="display:block;font-weight:600;font-size:13.5px;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(c.name)}</span>
              <span style="display:block;font-size:12px;color:var(--sub);margin-top:2px">${last?`Last paid ${fmtMini(last)}`:'Never paid'} · <b style="color:var(--udhaar)">${days} days</b></span>
            </button>
            <span class="tnum" style="font-weight:700;font-size:14px;color:var(--udhaar);flex-shrink:0">${PKR(b)}</span>
            <button class="icon-btn" onclick="waSend('${esc(c.phone||'')}',waReminderText(custBy('${c.id}')))" title="Send WhatsApp reminder" aria-label="Send WhatsApp reminder"

          </div>`).join('')}

      ${list.length>12?`<p style="font-size:12.5px;color:var(--sub);text-align:center;margin-top:10px">+${list.length-12} more — see the full list below</p>`:''}
      <div style="display:flex;justify-content:space-between;align-items:center;margin-top:12px;padding-top:11px;border-top:1px solid var(--border)">
        <span style="font-size:12.5px;color:var(--sub);font-weight:500">${list.length} customer${list.length===1?'':'s'}</span>
        <span class="tnum" style="font-size:15px;font-weight:700;color:var(--udhaar)">${PKR(list.reduce((s,x)=>s+x.b,0))}</span>

        <p style="color:var(--sub);font-size:12.5px;margin-top:9px">Nobody is ${_remindDays}+ days behind. Well collected.</p>

}

function summaryExportHTML(m){
  const rows=alive().map(c=>{
    const mine=txOf(c.id).filter(t=>mkKey(t.date)===m);
    const ms=money(mine.filter(isSale).reduce((s,t)=>s+num(t.amount),0));
    const mp=money(mine.filter(t=>t.type==='pay').reduce((s,t)=>s+num(t.amount),0));
    return{name:c.name,phone:c.phone||'',ms,mp,bal:balanceOf(c.id)};
  }).sort((a,b)=>b.bal-a.bal||a.name.localeCompare(b.name));
  const tot=rows.reduce((a,r)=>({ms:money(a.ms+r.ms),mp:money(a.mp+r.mp),due:money(a.due+Math.max(r.bal,0)),adv:money(a.adv+Math.max(-r.bal,0))}),{ms:0,mp:0,due:0,adv:0});
  /* Shop-wide item totals — what the whole month's production went out as. */
  const sIds=new Set(alive().map(c=>c.id));
  const sItems=itemBreakdown(transactions.filter(t=>isLive(t)&&sIds.has(t.cid)&&mkKey(t.date)===m));
  const tile=(lbl,val,bg,fg)=>`<div style="background:${bg};border-radius:12px;padding:12px 14px">
      <div style="font-size:12px;color:${RC.ink2}">${lbl}</div>
      <div style="font-size:19px;font-weight:700;color:${fg};margin-top:4px;white-space:nowrap">${val}</div>
    </div>`;
  const itemBlock=sItems.length?`${rcHead('Item-wise sales',monthLbl(m))}
    <table style="width:100%;border-collapse:collapse">
      <thead><tr>${rcTh('Item')}${rcTh('Quantity','right')}${rcTh('Rate','right')}${rcTh('Amount','right')}</tr></thead>
      <tbody>${sItems.map(it=>`<tr>
        ${rcTd(`<span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${it.color};margin-right:8px;vertical-align:1px"></span>${esc(it.name)}`,'left','font-weight:600')}
        ${rcTd(Qty(it.qty,it.unit),'right','white-space:nowrap')}
        ${rcTd(it.rate?PKR(it.rate)+'/'+it.unit:'mixed','right',`white-space:nowrap;color:${RC.sub}`)}
        ${rcTd(PKR(it.amount),'right','white-space:nowrap;font-weight:600')}
      </tr>`).join('')}</tbody>
    </table>`:'';
  return `<div style="width:660px;box-sizing:border-box;padding:26px 26px 18px;background:#fff;color:${RC.ink};font-family:${RC.font};font-size:13px;line-height:1.35">
    ${rcHeader('Monthly report',monthLbl(m))}
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px">
      ${tile('Sales this month',PKR(tot.ms),RC.blueSoft,RC.blue)}
      ${tile('Collected this month',PKR(tot.mp),RC.greenSoft,RC.green)}
      ${tile('Total udhaar outstanding',PKR(tot.due),RC.redSoft,RC.red)}
    </div>
    ${itemBlock}
    ${rcHead('Customer balances',`${rows.length} ${rows.length===1?'customer':'customers'}`)}
    <table style="width:100%;border-collapse:collapse">
      <thead><tr>${rcTh('#','left','26px')}${rcTh('Customer')}${rcTh('Mobile')}${rcTh('Goods','right')}${rcTh('Paid','right')}${rcTh('Balance','right')}</tr></thead>
      <tbody>${rows.map((r,i)=>`<tr>
        ${rcTd(i+1,'left',`color:${RC.sub}`)}
        ${rcTd(esc(r.name),'left','font-weight:600')}
        ${rcTd(esc(r.phone),'left',`white-space:nowrap;color:${RC.sub}`)}
        ${rcTd(r.ms?PKR(r.ms):'','right','white-space:nowrap')}
        ${rcTd(r.mp?PKR(r.mp):'','right',`white-space:nowrap;color:${RC.green}`)}
        ${rcTd(r.bal>0?PKR(r.bal):r.bal<0?PKR(-r.bal)+' adv':'Clear','right',`white-space:nowrap;font-weight:700;color:${r.bal>0?RC.red:r.bal<0?RC.green:RC.sub}`)}
      </tr>`).join('')}
      <tr>
        ${rcTd('','left',`background:${RC.soft};border-bottom:none`)}
        ${rcTd('Total','left',`font-weight:700;background:${RC.soft};border-bottom:none`)}
        ${rcTd('','left',`background:${RC.soft};border-bottom:none`)}
        ${rcTd(PKR(tot.ms),'right',`white-space:nowrap;font-weight:700;background:${RC.soft};border-bottom:none`)}
        ${rcTd(PKR(tot.mp),'right',`white-space:nowrap;font-weight:700;color:${RC.green};background:${RC.soft};border-bottom:none`)}
        ${rcTd(PKR(tot.due),'right',`white-space:nowrap;font-weight:700;color:${RC.red};background:${RC.soft};border-bottom:none`)}
      </tr></tbody>
    </table>
    ${tot.adv>0?`<div style="font-size:12px;color:${RC.sub};margin-top:9px">Advance held for customers: <span style="color:${RC.green};font-weight:600">${PKR(tot.adv)}</span> (not counted in the outstanding total).</div>`:''}

      <div>Printed ${fmtDMY(today())}</div>
      <div>Software by ${esc(SOFTWARE.by)}, ${esc(SOFTWARE.phone)}</div>
    </div>
  </div>`;

async function exportSummaryPDF(){
  toast('Making the report…','info');
  try{
    const canvas=await renderForExport(summaryExportHTML(_repMonth));
    canvasToPdf(canvas,`Report_${monthLbl(_repMonth).replace(/\s+/g,'-')}`);
    toast('Report PDF saved','ok');
  }catch(e){ console.error(e); toast('Could not make the report. Please try again.','err'); }
}

/* Ask the browser to keep this app's storage durable (won't auto-evict). */
async function requestPersist(){
  try{
    if(navigator.storage&&navigator.storage.persist){
      const has=await navigator.storage.persisted();
      if(!has) await navigator.storage.persist();
    }
  }catch{}
}
function markBackup(){ try{ localStorage.setItem(KEYS.backup,new Date().toISOString()); }catch{} }
function lastBackupAt(){ try{ return localStorage.getItem(KEYS.backup); }catch{ return null; } }
function backupAgeDays(){
  const l=lastBackupAt(); if(!l) return null;
  const t=new Date(l).getTime(); if(isNaN(t)) return null;
  return Math.floor((Date.now()-t)/864e5);
}

/* ── Automatic daily snapshots ──
   These live in the same storage as the ledger, so they are NOT protection
   against the browser's data being cleared — only a downloaded backup file is.
   What they do cover is the damage done inside the app: a mistaken restore, a
   mass delete, a bad edit noticed a day later. */
const SNAP_KEEP = 7;

function loadSnaps(){ try{ const v=JSON.parse(localStorage.getItem(KEYS.snap)); return Array.isArray(v)?v:[]; }catch{ return []; } }

function autoSnapshot(){
  if(!customers.length&&!transactions.length) return;
  try{
    const snaps=loadSnaps();
    const day=today();
    /* One per day is enough history without crowding out the ledger itself. */
    if(snaps.some(s=>s.day===day)) return;
    snaps.push({day, at:new Date().toISOString(),
      counts:{customers:alive().length, transactions:transactions.filter(isLive).length},
      customers, transactions, products});
    while(snaps.length>SNAP_KEEP) snaps.shift();
    localStorage.setItem(KEYS.snap, JSON.stringify(snaps));
  }catch(e){
    /* Quota is the likely cause; drop the oldest and let the next boot retry. */
    try{ const s=loadSnaps(); s.shift(); localStorage.setItem(KEYS.snap,JSON.stringify(s)); }catch{}
    console.warn('[SNAPSHOT]',e);
  }
}

function restoreSnapshot(day){
  const s=loadSnaps().find(x=>x.day===day); if(!s) return;
  showConfirm(`
    <div style="text-align:center">
      <div style="width:56px;height:56px;border-radius:50%;background:var(--udhaarbg);display:grid;place-items:center;margin:0 auto 14px">
        <i class="fa-solid fa-clock-rotate-left" style="font-size:21px;color:var(--udhaar)"></i>
      </div>
      <h3 class="display" style="font-size:21px;font-weight:600;color:var(--ink)">Go back to ${fmtShort(s.day)}?</h3>
      <p style="color:var(--sub);font-size:13px;margin-top:7px">Everything on this device will be replaced with that day's snapshot —
        <b style="color:var(--ink)">${s.counts?.customers??'?'} customers</b>, <b style="color:var(--ink)">${s.counts?.transactions??'?'} entries</b>.</p>
      <p style="color:var(--udhaar);font-size:12.5px;margin-top:10px"><i class="fa-solid fa-triangle-exclamation" style="margin-right:5px"></i>Anything recorded after that date will be lost.</p>
      <div style="display:flex;gap:10px;margin-top:18px">
        <button class="btn btn-neutral grow" onclick="closeConfirm()">Cancel</button>
        <button class="btn btn-danger grow" onclick="_doSnapRestore('${s.day}')">Restore</button>
      </div>
    </div>`);
}
function _doSnapRestore(day){
  const s=loadSnaps().find(x=>x.day===day); if(!s) return;
  customers=Array.isArray(s.customers)?s.customers:[];
  transactions=Array.isArray(s.transactions)?s.transactions:[];
  /* A snapshot taken before the catalogue existed carries no products — the
     loader re-seeds the built-ins so the rates are never lost. */
  if(Array.isArray(s.products)&&s.products.length){ saveKey(KEYS.p,s.products); products=loadProducts(); }
  migrateData(); persist();
  closeConfirm(); closeSheet(); toast(`Restored to ${fmtShort(day)} ✓`,'ok'); nav('home');
}

function doBackup(){
  try{
    const payload={app:'RanaAhmadMilkShop',v:4,at:new Date().toISOString(),
      counts:{customers:customers.length,transactions:transactions.length,products:products.length},
      customers,transactions,products};
    const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
    a.download=`RanaAhmadMilkShop_Backup_${today()}.json`; a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),4000);
    markBackup();
    toast('Backup saved. Keep the file safe.','ok');
  }catch(e){ console.error(e); toast('Backup failed — try again','err'); }
}

/* Gentle reminder to back up if data exists and none was taken recently. */
function backupNudge(){
  if(!customers.length&&!transactions.length) return;
  const age=backupAgeDays();
  if(age!==null&&age<=7) return;
  setTimeout(()=>toast(
    age===null?'Your khata has never been backed up':`No backup for ${age} days`,
    'warn',{label:'Backup',fn:doBackup}
  ),1600);
}
function doRestore(ev){
  const f=ev.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const d=JSON.parse(r.result);
      if(!Array.isArray(d.customers)||!Array.isArray(d.transactions)) throw 0;
      showConfirm(`
        <div style="text-align:center">
          <div style="width:56px;height:56px;border-radius:50%;background:var(--udhaarbg);display:grid;place-items:center;margin:0 auto 14px">
            <i class="fa-solid fa-cloud-arrow-up" style="font-size:20px;color:var(--udhaar)"></i>
          </div>
          <h3 class="display" style="font-size:21px;font-weight:600;color:var(--ink)">Restore backup?</h3>
          <p style="color:var(--sub);font-size:13px;margin-top:8px">This will <b>replace all current data</b> on this device with the backup file. This cannot be undone.</p>
          <div style="display:flex;gap:10px;margin-top:18px">
            <button class="btn btn-neutral grow" onclick="closeConfirm()">Cancel</button>
            <button class="btn btn-danger grow" id="doRestoreBtn">Restore</button>
          </div>
        </div>`);
      document.getElementById('doRestoreBtn').onclick=()=>{
        /* A backup taken by an older build can carry the double-counted
           reversals, so repair it before it becomes the live ledger. */
        customers=d.customers; transactions=d.transactions;
        /* Backups written by v3 and earlier have no catalogue; loadProducts
           re-seeds the built-ins so those ledgers still name their items. */
        if(Array.isArray(d.products)&&d.products.length) saveKey(KEYS.p,d.products);
        products=loadProducts();
        migrateData(); persist(); markBackup();
        closeConfirm(); toast('Data restored ✓','ok'); nav('home');
      };
    }catch{ toast('Invalid backup file','err'); }
  };
  r.readAsText(f); ev.target.value='';
}

/* ────────────────────────────────────────
   11b. PIN LOCK
   A screen lock, not encryption — the ledger on disk stays readable, so this
   stops someone picking up the phone, not someone determined. "Forgot PIN"
   therefore hands the data back rather than trapping the shop out of it.
──────────────────────────────────────── */
let _pinBuf='', _pinMode='unlock', _pinFirst='', _pinTries=0;

async function hashPin(pin){
  const raw='rams:'+pin;
  try{
    if(crypto?.subtle){
      const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(raw));
      return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('');
    }
  }catch{}
  /* file:// and other insecure contexts have no SubtleCrypto — fall back so
     the lock still works rather than silently failing open. */
  let h=5381; for(let i=0;i<raw.length;i++) h=((h<<5)+h+raw.charCodeAt(i))>>>0;
  return 'x'+h.toString(16);
}
const pinIsSet = ()=>{ try{ return !!localStorage.getItem(KEYS.pin); }catch{ return false; } };

function paintPin(){
  const dots=document.getElementById('lockDots');
  if(dots) dots.innerHTML=[0,1,2,3].map(i=>`<span class="pin-dot${i<_pinBuf.length?' on':''}"></span>`).join('');
  const pad=document.getElementById('lockPad');
  if(pad&&!pad.dataset.built){
    pad.dataset.built='1';
    const key=(label,fn)=>`<button class="pin-key tnum" onclick="${fn}">${label}</button>`;
    pad.innerHTML=[1,2,3,4,5,6,7,8,9].map(n=>key(n,`pinTap('${n}')`)).join('')
      + `<span></span>` + key(0,`pinTap('0')`)
      + `<button class="pin-key pk-plain" onclick="pinBack()" aria-label="Delete last digit"><i class="fa-solid fa-delete-left"></i></button>`;
  }
}

function pinTap(d){
  if(_pinBuf.length>=4) return;
  _pinBuf+=d; paintPin();
  if(_pinBuf.length===4) setTimeout(pinSubmit,120);
}
function pinBack(){ _pinBuf=_pinBuf.slice(0,-1); paintPin(); }

function pinSay(msg,bad){
  const m=document.getElementById('lockMsg');
  if(!m) return;
  m.textContent=msg;
  m.style.color=bad?'var(--udhaar)':'var(--sub)';
  if(bad){ const s=document.getElementById('lockDots'); if(s){ s.style.animation='none'; void s.offsetWidth; s.style.animation='shake .4s'; } }
}

async function pinSubmit(){
  const entered=_pinBuf; _pinBuf=''; paintPin();

  if(_pinMode==='unlock'){
    const h=await hashPin(entered);
    if(h===localStorage.getItem(KEYS.pin)){ _pinTries=0; closeLock(); return; }
    _pinTries++;
    pinSay(_pinTries>=3?`Wrong PIN (${_pinTries} tries) — use "Forgot PIN?"`:'Wrong PIN — try again',true);
    return;
  }
  if(_pinMode==='set'){
    _pinFirst=entered; _pinMode='confirm'; pinSay('Enter the same PIN again');
    return;
  }
  if(_pinMode==='confirm'){
    if(entered!==_pinFirst){ _pinMode='set'; _pinFirst=''; pinSay('PINs did not match — start again',true); return; }
    try{ localStorage.setItem(KEYS.pin, await hashPin(entered)); }
    catch{ toast('Could not save the PIN','err'); closeLock(); return; }
    _pinFirst=''; closeLock(); toast('PIN lock is on ✓','ok');
  }
}

function openLock(mode='unlock'){
  _pinMode=mode; _pinBuf=''; _pinFirst=''; _pinTries=0;
  const scr=document.getElementById('lockScreen'); if(!scr) return;
  scr.hidden=false;
  document.getElementById('lockForgot').hidden = mode!=='unlock';
  paintPin();
  pinSay(mode==='unlock'?'Enter your 4-digit PIN':'Choose a new 4-digit PIN');
}
function closeLock(){
  const scr=document.getElementById('lockScreen'); if(scr) scr.hidden=true;
  _pinBuf=''; _pinMode='unlock';
}

/* Honest escape hatch: the ledger was never encrypted, so refusing entry
   forever would only cost the shop its data. Hand over a backup, then reset. */
function forgotPin(){
  showConfirm(`
    <div style="text-align:center">
      <div style="width:56px;height:56px;border-radius:50%;background:var(--goldbg);display:grid;place-items:center;margin:0 auto 14px">

      <h3 class="display" style="font-size:21px;font-weight:600;color:var(--ink)">Reset the PIN?</h3>
      <p style="color:var(--sub);font-size:13px;margin-top:8px">A backup file will be saved first, then the lock is removed and you can set a new PIN.</p>
      <p style="color:var(--sub);font-size:12.5px;margin-top:10px">This is a screen lock, not a password on the data — it keeps casual eyes out, nothing more.</p>
      <div style="display:flex;gap:10px;margin-top:18px">
        <button class="btn btn-neutral grow" onclick="closeConfirm()">Cancel</button>
        <button class="btn btn-filled grow" onclick="_doForgotPin()">Backup &amp; reset</button>
      </div>
    </div>`);
}
function _doForgotPin(){
  doBackup();
  try{ localStorage.removeItem(KEYS.pin); }catch{}
  closeConfirm(); closeLock(); toast('PIN removed — set a new one in Settings','warn');
}

/* ── Force update ──
   Clears every cached response and re-registers the worker, then reloads.
   Deliberately never touches localStorage, which is where the khata lives. */
async function forceUpdate(){
  toast('Fetching the latest version…','info');
  try{
    if('serviceWorker' in navigator){
      const regs=await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(r=>r.unregister()));
    }
    if(window.caches){
      const keys=await caches.keys();
      await Promise.all(keys.map(k=>caches.delete(k)));
    }
  }catch(e){ console.warn('[UPDATE]',e); }
  /* A changed query string defeats any HTTP cache still holding the old HTML. */
  const url=location.origin+location.pathname+'?u='+Date.now();
  setTimeout(()=>location.replace(url),450);
}

function removePin(){
  try{ localStorage.removeItem(KEYS.pin); }catch{}
  toast('PIN lock turned off','warn'); openSettings();
}

/* ── Bottom Sheet (race-condition-safe) ── */
function openSheet(html){
  if(_closeTimer){ clearTimeout(_closeTimer); _closeTimer=null; }
  const root=document.getElementById('sheetRoot');
  const card=document.getElementById('sheetCard');
  card.style.animation='';
  card.innerHTML=html;
  root.hidden=false;
  card.className='modal-card a-sheet';
}
function closeSheet(){
  const card=document.getElementById('sheetCard');
  card.style.animation='sheetUp .3s cubic-bezier(.4,0,1,1) reverse forwards';
  _closeTimer=setTimeout(()=>{
    document.getElementById('sheetRoot').hidden=true;
    card.style.animation='';
    _closeTimer=null;
  },270);
}
document.getElementById('sheetRoot').addEventListener('click',e=>{
  if(e.target.id==='sheetRoot') closeSheet();
});

/* ── Toast ── */
function toast(msg,kind='info',action){
  const clr={ok:'var(--snack-ok)',err:'var(--snack-err)',info:'var(--inverse-primary)',warn:'var(--snack-warn)'}[kind]||'var(--inverse-primary)';
  const ic={ok:'fa-circle-check',err:'fa-circle-exclamation',info:'fa-circle-info',warn:'fa-triangle-exclamation'}[kind]||'fa-circle-info';
  const t=document.createElement('div');
  t.className='snack';
  t.setAttribute('role','status');
  t.innerHTML=`<i class="fa-solid ${ic}" style="font-size:17px;flex-shrink:0;color:${clr}"></i><span>${String(msg).replace(/\s*✓/g,'')}</span>`;

  let gone=false;
  const dismiss=()=>{ if(gone) return; gone=true;
    t.style.transition='opacity .2s,transform .2s'; t.style.opacity='0'; t.style.transform='translateY(8px)';
    setTimeout(()=>t.remove(),220); };

  /* Optional inline action (e.g. Undo a delete) — kept short-lived so it can
     never fire against a ledger the user has since moved on from. */
  if(action&&typeof action.fn==='function'){
    const b=document.createElement('button');
    b.textContent=action.label||'Undo';
    b.onclick=()=>{ dismiss(); action.fn(); };
    t.appendChild(b);
  }

  const box=document.getElementById('toastBox');
  /* Android shows one snackbar at a time — a newer message replaces the old. */
  while(box.children.length>1) box.firstChild.remove();
  box.appendChild(t);
  setTimeout(dismiss, action?4800:2400);
}

──────────────────────────────────────── */
function checkOnline(){
  document.getElementById('offlineBanner').style.display=navigator.onLine?'none':'block';
}
window.addEventListener('online',checkOnline);
window.addEventListener('offline',checkOnline);
checkOnline();

/* ────────────────────────────────────────
   14. SERVICE WORKER (offline / installable)
──────────────────────────────────────── */
if('serviceWorker' in navigator){
  let _reloaded=false;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{
    if(_reloaded) return; _reloaded=true; location.reload();
  });
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('sw.js').then(reg=>{
      reg.addEventListener('updatefound',()=>{
        const nw=reg.installing; if(!nw) return;
        nw.addEventListener('statechange',()=>{
          if(nw.state==='installed'&&navigator.serviceWorker.controller){
            nw.postMessage('SKIP_WAITING'); // activate the fresh version
          }
        });
      });
    }).catch(console.warn);
  });
}

/* ── Overflow menu ── */
function openMenu(){ document.getElementById('menuRoot').hidden=false; }
function closeMenu(){ const m=document.getElementById('menuRoot'); if(m) m.hidden=true; }

/* ── Touch ripple ──
   Every button answers the finger from the point it was touched. */
document.addEventListener('pointerdown',e=>{
  const t=e.target.closest('button,.tap,.menu-item');
  if(!t||t.disabled||t.classList.contains('nav-btn')) return;
  const r=t.getBoundingClientRect();
  const d=Math.max(r.width,r.height)*2.4;
  const s=document.createElement('span');
  s.className='rpl';
  s.style.cssText=`width:${d}px;height:${d}px;left:${e.clientX-r.left-d/2}px;top:${e.clientY-r.top-d/2}px`;
  t.appendChild(s);
  setTimeout(()=>s.remove(),520);
},{passive:true});

/* ── App bar lifts once the page under it has scrolled ── */
document.querySelectorAll('[data-screen]').forEach(s=>s.addEventListener('scroll',()=>{
  if(!s.hidden) document.getElementById('topBar').dataset.lifted=s.scrollTop>4;
},{passive:true}));

/* ── Phone back button ──
   Closes whatever is open (menu, dialog, sheet, receipt), then steps back to
   Home, and only then leaves the app — the way an installed app behaves. */
function handleBack(){
  const open=id=>{ const n=document.getElementById(id); return n&&!n.hidden; };
  if(open('menuRoot')){ closeMenu(); return true; }
  if(open('confirmRoot')){ closeConfirm(); return true; }
  if(open('lockScreen')){
    if(_pinMode==='unlock') return false;      // never a way around the lock
    closeLock(); return true;
  }
  if(!document.getElementById('receiptModal').classList.contains('hidden')){ closeReceiptModal(); return true; }
  if(open('sheetRoot')){ closeSheet(); return true; }
  if(cur==='profile'){ goBack(); return true; }
  if(cur!=='home'){ nav('home'); return true; }
  return false;
}
try{
  history.replaceState({rams:'root'},'');
  history.pushState({rams:'app'},'');
  window.addEventListener('popstate',()=>{
    if(handleBack()) history.pushState({rams:'app'},'');
    else history.back();
  });
}catch(e){ console.warn('[BACK]',e); }

/* ── BOOT ── */
(function boot(){
  const lg=document.getElementById('brandLogo'); if(lg) lg.src=LOGO;
  const ll=document.getElementById('lockLogo'); if(ll) ll.src=LOGO;
  requestPersist();
  const repaired=migrateData();
  if(_healedText){ persist(); _healedText=false; }
  /* Snapshot the state we booted with, before any of today's edits. */
  autoSnapshot();
  if(pinIsSet()) openLock('unlock');
  nav('home');
  if(repaired) setTimeout(()=>toast('Ledger balances recalculated ✓','ok'),900);
  backupNudge();
})();

/* ── Startup splash controller ── */
(function splashInit(){
  const scr=document.getElementById('splashScreen');
  const vid=document.getElementById('splashVideo');
  const skip=document.getElementById('splashSkip');
  if(!scr||!vid) return;
  let done=false;
  function finish(){
    if(done) return; done=true;
    scr.classList.add('hide');
    setTimeout(()=>scr.remove(),700);
    /* The home screen was drawn behind the video — play its entrance now
       that it can actually be seen. */
    try{ if(cur!=='profile'){ render(cur); playEnter(S(cur)); } }catch(e){ console.warn('[SPLASH]',e); }
  }
  vid.addEventListener('ended',finish);
  vid.addEventListener('error',finish);
  skip&&skip.addEventListener('click',finish);
  // Safety: never trap the user if video stalls
  setTimeout(finish,12000);
  const p=vid.play(); if(p&&p.catch) p.catch(()=>{});
})();
</script>
