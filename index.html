function saveCust(id){
  const name=(document.getElementById('f_name').value||'').trim();
  const phone=(document.getElementById('f_phone').value||'').trim();
  const rate=num(document.getElementById('f_rate').value);
  const addr=(document.getElementById('f_addr').value||'').trim();
  const defaultQty=money(num(document.getElementById('f_dqty')?.value));
  const leaveFrom=(document.getElementById('f_lfrom')?.value||'')||null;
  let   leaveTo  =(document.getElementById('f_lto')?.value||'')||null;
  if(!name){ toast('Customer name is required','err'); return; }
  if(rate<=0){ toast('Enter a valid rate per litre','err'); return; }
  if(leaveTo&&!leaveFrom){ toast('Set the leave start date too','err'); return; }
  if(leaveFrom&&leaveTo&&leaveTo<leaveFrom){ toast('Leave "To" is before "From"','err'); return; }
  /* Bot hisaab needs a number the bot can recognise, and that number must
     belong to one customer only. */
  const cycle=CYCLES[document.getElementById('f_cycle')?.value]?document.getElementById('f_cycle').value:'';
  if(cycle){
    const bp=botPhone(phone);
    if(!bp){ toast('Bot hisaab ke liye sahi mobile number likhein (03XX-XXXXXXX)','err'); return; }
    const other=botCusts().find(x=>x.id!==id&&botPhone(x.phone)===bp);
    if(other){ toast(`Ye number ${other.name} pe bhi hai — bot hisaab ek hi pe ho sakta hai`,'err'); return; }
  }
  /* Only rates that were actually typed are stored, so raising a shop rate
     still reaches every customer who was never given a special price. */
  const rates={};
  document.querySelectorAll('[data-frate]').forEach(inp=>{
    const v=money(num(inp.value));
    if(String(inp.value).trim()!==''&&v>0) rates[inp.dataset.frate]=v;
  });
  const extra={defaultQty,leaveFrom,leaveTo,rates,cycle};
  if(id){
    Object.assign(custBy(id),{name,phone,rate,address:addr},extra);
  } else {
    const cid=uid();
    customers.push({id:cid,name,phone,address:addr,rate,...extra,createdAt:new Date().toISOString(),deleted:false});
    /* A negative figure records an advance the customer already paid. */
    const open=money(num(document.getElementById('f_open')?.value));
    if(open!==0) transactions.push({id:uid(),cid,date:today(),createdAt:new Date().toISOString(),type:'opening',amount:Math.abs(open),delta:open,note:'Opening balance'});
  }
  persist(); closeSheet(); toast(id?'Customer updated':'Customer added ✓','ok');
  if(id&&cur==='profile') render('profile'); else nav('customers');
}

  const warn=b!==0?`<div style="background:var(--udhaarbg);border-radius:12px;padding:12px 14px;margin-top:14px;font-size:12.5px;color:var(--udhaar)">

    This customer has an outstanding balance of <b>${PKR(Math.abs(b))}</b>. It will no longer show in your totals.

  `<div style="background:var(--jamabg);border-radius:12px;padding:10px 14px;margin-top:12px;font-size:12.5px;color:var(--jama)">
    <i class="fa-solid fa-check-circle" style="margin-right:6px"></i>Account is clear — safe to delete.

function ledgerRow(x,running,i){
  const off=!!x.voided;
  const isPay=x.type==='pay';
  const sale=isSale(x)?prodOf(x):null;
  const clr=off?'var(--sub)':(isPay||(!sale&&num(x.delta)<0))?'var(--jama)':'var(--udhaar)';
  const bg=off?'var(--surface2)':isPay?'var(--jamabg)':sale?'var(--c-bg)':num(x.delta)<0?'var(--jamabg)':'var(--udhaarbg)';
  const ic=isPay?'fa-hand-holding-dollar':sale?sale.icon:'fa-scale-balanced';
  const title=sale?esc(sale.name):x.type==='pay'?'Payment':x.type==='opening'?'Opening balance':'Adjustment';
  const meta=sale?`${Qty(x.qty,unitOf(x))} × ${PKR(x.rate)}/${unitOf(x)}`
    :x.type==='pay'?(x.method||'Cash')+(x.note?` · ${esc(x.note)}`:'')
    :esc(x.note||'');
  const rb=off?null:balTag(running);
  const editable=isSale(x)||x.type==='pay';
  /* v17: sign and colour follow what the entry did to the balance, so an
     opening advance reads "−Rs 500" in green instead of "+Rs 500" in red. */
  const down=isPay||num(x.delta)<0;

  const btn=(fn,icon,label,tone)=>`<button class="icon-btn" onclick="${fn}" title="${label}" aria-label="${label}"
    style="color:${tone.fg}">
    <i class="fa-solid ${icon}" style="font-size:14px"></i></button>`;
  const T={
    del :{fg:'var(--sub)'},
    undo:{fg:'var(--jama)'}
  };
  const editFn=(!off&&editable)?`openEntrySheet('${isSale(x)?'sale':x.type}','${x.cid}','${x.id}')`:'';
  const actions=off
    ? btn(`restoreEntry('${x.id}')`,'fa-rotate-left','Restore entry',T.undo)
    : btn(`event.stopPropagation();confirmDeleteEntry('${x.id}')`,'fa-trash-can','Delete entry',T.del);

  return `<div class="row${editFn?' tap':''}" ${editFn?`onclick="${editFn}" role="button" tabindex="0"`:''} style="gap:11px;padding-right:4px;${off?'opacity:.62':''}">
    <span style="width:40px;height:40px;border-radius:50%;background:${bg};color:${off||!sale?clr:tone(sale.color)};display:grid;place-items:center;flex-shrink:0">
      <i class="fa-solid ${ic}" style="font-size:15px"></i>
    </span>
    <span style="flex:1;min-width:0">
      <span style="display:block;font-weight:700;font-size:14px;line-height:1.3;color:var(--ink);${off?'text-decoration:line-through':''}">${title}</span>
      <span style="display:block;font-size:13px;color:var(--sub);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${meta}</span>
      <span style="display:block;font-size:12.5px;color:var(--sub);margin-top:1px">
        ${fmtMini(x.date)}${off?', <span style="color:var(--udhaar);font-weight:600">deleted</span>':x.editedAt?', <span style="color:var(--gold)">edited</span>':''}
      </span>
    </span>
    <span style="text-align:right;flex-shrink:0">
      <span class="tnum" style="display:block;font-weight:600;font-size:15px;color:${clr};${off?'text-decoration:line-through':''}">${down?'−':'+'}${PKR(Math.abs(num(x.amount)||num(x.delta)))}</span>
      ${rb?`<span class="tnum" style="display:block;font-size:12px;color:${rb.fg};margin-top:2px">${running<0?'Adv':'Bal'} ${rb.txt}</span>`:''}
    </span>
    <span style="display:flex;flex-shrink:0;margin-left:-8px">${actions}</span>
  </div>`;
}

/* ── Delete / restore a single ledger entry ──
   Voiding keeps the row on disk, so a wrong entry can be removed from the
   balance immediately and still be brought back if it was the wrong one. */
function confirmDeleteEntry(id){
  const t=transactions.find(x=>x.id===id); if(!t) return;
  const c=custBy(t.cid);
  const after=money(balanceOf(t.cid)-num(t.delta));
  const at=balTag(after);
  const what=isSale(t)?`${Qty(t.qty,unitOf(t))} ${esc(prodName(t).toLowerCase())} @ ${PKR(t.rate)}/${unitOf(t)}`
    :t.type==='pay'?`${t.method||'Cash'} payment`:'this entry';
  showConfirm(`
    <div style="text-align:center">
      <div style="width:56px;height:56px;border-radius:50%;background:var(--udhaarbg);display:grid;place-items:center;margin:0 auto 14px">
        <i class="fa-solid fa-trash-can" style="font-size:21px;color:var(--udhaar)"></i>
      </div>
      <h3 class="display" style="font-size:21px;font-weight:600;color:var(--ink)">Delete this entry?</h3>
      <p style="color:var(--sub);font-size:13px;margin-top:7px">${esc(c?.name||'Customer')} · ${what}<br>
        <b style="color:var(--ink)">${PKR(t.amount)}</b> on ${fmtShort(t.date)}</p>
      <div style="background:var(--surface2);border-radius:16px;padding:12px 14px;margin-top:14px;display:flex;justify-content:space-between;align-items:center;font-size:13px">
        <span style="color:var(--sub)">Balance after delete</span>
        <b style="color:${at.fg}">${at.txt} ${at.lbl}</b>
      </div>
      <p style="color:var(--sub);font-size:12.5px;margin-top:10px">You can restore it later from the deleted list.</p>
      <div style="display:flex;gap:10px;margin-top:18px">
        <button class="btn btn-neutral grow" onclick="closeConfirm()">Cancel</button>
        <button class="btn btn-danger grow" onclick="deleteEntry('${id}')">Delete</button>
      </div>
    </div>`);
}

function deleteEntry(id){
  const t=transactions.find(x=>x.id===id); if(!t) return;
  t.voided=true; t.voidedAt=new Date().toISOString();
  persist(); closeConfirm();
  toast('Entry deleted','err',{label:'Undo',fn:()=>restoreEntry(id)});
  render(cur);
}

function restoreEntry(id){
  const t=transactions.find(x=>x.id===id); if(!t) return;
  delete t.voided; delete t.voidedAt;
  persist(); toast('Entry restored ✓','ok'); render(cur);
}

/* Older builds wired this to the Reverse button; keep the name working so a
   cached page never calls into nothing. */
function reverseTx(id){ confirmDeleteEntry(id); }

/* Live state for the open entry sheet — lets the running preview stay correct
   without threading the balance through every inline oninput handler. */
let _entry=null;

function openEntrySheet(type,cid,editId,pid){
  const c=custBy(cid); if(!c){ toast('Customer not found','err'); return; }
  const ed=editId?transactions.find(t=>t.id===editId):null;
  if(editId&&!ed){ toast('Entry no longer exists','err'); return; }

  /* 'milk' was the only sale type before the catalogue existed; anything that
     still calls with it lands on the milk item. */
  if(type==='milk'){ type='sale'; pid=pid||'milk'; }
  const isMilk=type==='sale';

  /* An explicit item wins (the picker passes one); otherwise an entry being
     edited keeps whatever item it was saved as. */
  const wanted=pid||(ed&&isSale(ed)?pidOf(ed):'milk');
  const P=prodBy(wanted)||liveProds()[0]||prodBy('milk')||DEFAULT_PRODUCTS[0];

  /* When editing, the balance the previews build on must exclude the entry
     being edited — otherwise its old amount is counted twice. */
  const bal=money(balanceOf(cid)-(ed?num(ed.delta):0));
  const accent=isMilk?tone(P.color):'var(--jama-fill)';
  /* The saved rate is only kept while the entry is still the same item —
     switching to ghee must not carry the milk rate across. */
  const rate=(ed&&isSale(ed)&&pidOf(ed)===P.id)?money(num(ed.rate)):rateFor(c,P.id);
  const bt=balTag(bal);
  _entry={type,cid,editId:editId||null,bal,rate,pid:P.id,unit:P.unit};

  /* Quick amounts follow the unit — litres go up in halves, kilos in quarters,
     pieces one at a time. */
  const chips=P.unit==='pcs'||P.unit==='dozen'?[1,2,3,5,10]
    :P.unit==='g'?[100,250,500,750,1000]
    :P.unit==='kg'?[0.25,0.5,1,2,5]
    :[0.5,1,1.5,2,3];
  const qtyChip=v=>`<button class="chip chip-fill" type="button" onclick="setQty(${v})">${Qnum(v)} ${P.unit}</button>`;

  /* Switching item mid-entry re-opens the sheet on the new item so the rate,
     unit and quick amounts all move together. */
  const picker=liveProds().map(p=>{
    const on=p.id===P.id;
    const pc=tone(p.color);
    return `<button class="chip" type="button" data-chip="${p.id}" onclick="openEntrySheet('sale','${cid}',${editId?`'${editId}'`:'null'},'${p.id}')"
      style="border-color:${on?pc:'var(--border2)'};background:${on?pc:'transparent'};color:${on?'#fbf3e4':'var(--ink2)'}">
      <i class="fa-solid ${p.icon}" style="font-size:13px;color:${on?'#fbf3e4':pc}"></i>${esc(p.name)}
    </button>`;
  }).join('');

  openSheet(`
    <div style="padding:16px 20px 12px;flex-shrink:0;border-bottom:1px solid var(--border)">
      <div style="width:32px;height:4px;border-radius:99px;background:var(--border2);margin:0 auto 16px"></div>
      <div style="display:flex;align-items:center;gap:11px">
        <span style="width:44px;height:44px;border-radius:50%;background:${accent};display:grid;place-items:center;flex-shrink:0">
          <i class="fa-solid ${isMilk?P.icon:'fa-hand-holding-dollar'}" style="color:#fbf3e4;font-size:16px"></i>
        </span>
        <div>
          <h3 class="display" style="font-size:21px;font-weight:600;color:var(--ink)">${ed?'Edit ':''}${isMilk?esc(P.name)+' delivered':'Payment received'}</h3>
          <p style="font-size:12.5px;color:var(--sub)">${esc(c.name)} · <span style="color:${bt.fg};font-weight:600">${bt.lbl} ${bt.txt}</span></p>
        </div>
      </div>
    </div>

    <div class="scroll" style="flex:1;min-height:0;padding:18px 20px;display:flex;flex-direction:column;gap:14px">
      ${isMilk?`
        <div>
          <label class="label">Item</label>
          <div class="hscroll" style="display:flex;gap:6px;overflow-x:auto;padding-bottom:3px">${picker}</div>
        </div>`:''}

      <div>
        <label class="label">Date</label>
        <input id="e_date" type="date" class="field mono" value="${ed?.date||today()}" max="${today()}">
      </div>

      ${isMilk?`
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
          <div>
            <label class="label">Quantity (${P.unit}) *</label>
            <input id="e_qty" type="number" inputmode="decimal" step="${P.unit==='pcs'||P.unit==='dozen'?'1':P.unit==='g'?'50':'0.25'}" min="0" class="field mono display" style="text-align:center;font-size:24px;min-height:58px" placeholder="0" value="${ed?ed.qty:(P.id==='milk'?(c.defaultQty||''):'')}" oninput="calcEntry()">
          </div>
          <div>
            <label class="label">Rate / ${P.unit}</label>
            <input id="e_rate" type="number" inputmode="decimal" min="0" class="field mono display" style="text-align:center;font-size:24px;min-height:58px" value="${rate||''}" oninput="calcEntry()">
          </div>
        </div>
        <div style="display:grid;grid-template-columns:repeat(5,1fr);gap:6px">
          ${chips.map(qtyChip).join('')}
        </div>
        ${rateFor(c,P.id)!==money(num(P.rate))?`<p style="font-size:12px;color:var(--gold);margin-top:-4px"><i class="fa-solid fa-tag" style="margin-right:5px"></i>Special rate for ${esc(c.name)} — shop rate is ${PKR(P.rate)}/${P.unit}</p>`:''}
        <div style="background:var(--a-100);border-radius:var(--radius-lg);padding:14px 18px;display:flex;align-items:center;justify-content:space-between">
          <span class="kk" style="color:var(--a-700);font-size:10.5px">Bill amount</span>
          <span class="tnum display" id="e_calc" style="font-size:28px;color:var(--a-700)">Rs 0</span>
        </div>
        <div id="e_balPreview" style="background:var(--surface2);border-radius:var(--radius-lg);padding:14px 18px"></div>
      `:`
        <div>
          <label class="label">Amount received (Rs) *</label>
          <input id="e_amt" type="number" inputmode="decimal" min="0" class="field mono display" style="text-align:center;font-size:28px;min-height:62px" placeholder="0" value="${ed?ed.amount:''}" oninput="calcEntry()">
        </div>
        ${bal>0?`<button class="btn btn-sm block" type="button" onclick="setAmt(${bal})"
          style="background:var(--jamabg);color:var(--jama)">
          <i class="fa-solid fa-check-double" style="margin-right:6px"></i>Full settlement — ${PKR(bal)}
        </button>`:''}
        <div>
          <label class="label">Payment method</label>
          <select id="e_method" class="field">
            ${['Cash','JazzCash','EasyPaisa','Bank Transfer','Other'].map(x=>`<option${ed&&ed.method===x?' selected':''}>${x}</option>`).join('')}
          </select>
        </div>
        <div id="e_balPreview" style="background:var(--surface2);border-radius:var(--radius-lg);padding:14px 18px"></div>
      `}

      <div>
        <label class="label">Note (optional)</label>
        <input id="e_note" class="field" placeholder="Add a note…" value="${esc(ed?.note||'')}">
      </div>
    </div>

    <div style="padding:14px 20px;padding-bottom:calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--border);display:flex;gap:10px;flex-shrink:0">
      <button class="btn btn-neutral grow" onclick="closeSheet()">Cancel</button>
      <button class="btn grow ${isMilk?'btn-filled':'btn-success'}" id="e_save" onclick="saveEntry()">${ed?'Update entry':'Save entry'}</button>
    </div>`);

  calcEntry();
  setTimeout(()=>document.getElementById(isMilk?'e_qty':'e_amt')?.focus(),130);
  /* With eight items the strip scrolls; bring the chosen one into view so the
     sheet never opens looking like nothing is selected. */
  setTimeout(()=>chipIntoView(`[data-chip="${P.id}"]`),170);
}

/* Centres a chip inside its own horizontal strip without moving the page. */
function chipIntoView(sel){
  const el=document.querySelector(sel); if(!el) return;
  const box=el.parentElement; if(!box) return;
  box.scrollLeft=Math.max(0, el.offsetLeft-(box.clientWidth-el.offsetWidth)/2);
}

function setQty(v){
  const el=document.getElementById('e_qty'); if(!el) return;
  el.value=v; calcEntry(); el.focus();
}
function setAmt(v){
  const el=document.getElementById('e_amt'); if(!el) return;
  el.value=money(v); calcEntry(); el.focus();
}

const balLine=v=>v>0?`<b style="color:var(--udhaar)">${PKR(v)} Udhaar</b>`
  :v<0?`<b style="color:var(--jama)">${PKR(-v)} Advance</b>`
  :`<b style="color:var(--jama)">Account clear</b>`;

/* One preview routine for both sheets: current balance → this entry → result.
   Whatever it shows is exactly what the ledger will read after saving. */
function calcEntry(){
  if(!_entry) return;
  const {type,bal,rate,pid}=_entry;
  const box=document.getElementById('e_balPreview');
  let after=bal, label='';

  if(type==='sale'){
    const q=num(document.getElementById('e_qty')?.value);
    const r=num(document.getElementById('e_rate')?.value)||rate;
    const amt=money(q*r);
    const el=document.getElementById('e_calc'); if(el) el.textContent=PKR(amt);
    after=money(bal+amt); label='After this '+(prodBy(pid)?.name||'item').toLowerCase();
  } else {
    const amt=money(num(document.getElementById('e_amt')?.value));
    after=money(bal-amt); label='After payment';
  }
  if(!box) return;
  box.innerHTML=`
    <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:8px">
      <span style="color:var(--sub)">Current balance</span>${balLine(bal)}
    </div>
    <div style="height:1px;background:var(--border);margin-bottom:8px"></div>
    <div style="display:flex;justify-content:space-between;font-size:13px">
      <span style="color:var(--sub)">${label}</span>${balLine(after)}
    </div>`;
}

/* Guards a double-tap on Save from writing the entry twice — a silent way for
   a day's milk to be billed at double. */
let _saving=false;

/* Shown when milk is already on the books for that customer and date. Two
   deliveries a day are legitimate, so this asks rather than blocks. */
function confirmDuplicate(c,date,already,patch){
  const P=prodBy(patch.pid)||{name:'Item',unit:patch.unit||'kg'};
  const lt=money(already.reduce((s,t)=>s+num(t.qty),0));
  const amt=money(already.reduce((s,t)=>s+num(t.amount),0));
  showConfirm(`
    <div style="text-align:center">
      <div style="width:56px;height:56px;border-radius:50%;background:var(--goldbg);display:grid;place-items:center;margin:0 auto 14px">
        <i class="fa-solid fa-triangle-exclamation" style="font-size:21px;color:var(--gold)"></i>
      </div>
      <h3 class="display" style="font-size:21px;font-weight:600;color:var(--ink)">${esc(P.name)} already recorded</h3>
      <p style="color:var(--sub);font-size:13px;margin-top:7px">${esc(c.name)} already has
        <b style="color:var(--ink)">${Qty(lt,P.unit)}</b> (${PKR(amt)}) on <b style="color:var(--ink)">${fmtShort(date)}</b>
        ${already.length>1?`<br>across ${already.length} entries`:''}.</p>
      <div style="background:var(--surface2);border-radius:16px;padding:12px 14px;margin-top:14px;text-align:left">
        ${already.map(t=>`<div style="display:flex;justify-content:space-between;font-size:12.5px;padding:3px 0">
          <span style="color:var(--sub)">${Qty(t.qty,unitOf(t))} × ${PKR(t.rate)}/${unitOf(t)}</span><b style="color:var(--ink)">${PKR(t.amount)}</b></div>`).join('')}
        <div style="height:1px;background:var(--border);margin:7px 0"></div>
        <div style="display:flex;justify-content:space-between;font-size:12.5px">
          <span style="color:var(--gold);font-weight:600">Adding now</span>
          <b style="color:var(--gold)">${Qty(patch.qty,P.unit)} · ${PKR(patch.amount)}</b>
        </div>
      </div>
      <p style="color:var(--sub);font-size:12.5px;margin-top:10px">Add it only if this is a second delivery. Otherwise cancel and edit the existing entry.</p>
      <div style="display:flex;gap:10px;margin-top:18px">
        <button class="btn btn-neutral grow" onclick="closeConfirm()">Cancel</button>
        <button class="btn btn-filled grow" onclick="closeConfirm();saveEntry(true)">Add anyway</button>
      </div>
    </div>`);
}

function saveEntry(confirmed){
  if(_saving||!_entry) return;
  const {type,cid,editId,pid}=_entry;
  const c=custBy(cid); if(!c){ toast('Customer not found','err'); return; }

  let date=(document.getElementById('e_date')?.value||'').trim()||today();
  if(date>today()){ date=today(); toast('Future date not allowed — set to today','warn'); }
  const note=(document.getElementById('e_note')?.value||'').trim();

  let patch;
  if(type==='sale'){
    const P=prodBy(pid)||prodBy('milk')||DEFAULT_PRODUCTS[0];
    const qty=money(num(document.getElementById('e_qty')?.value));
    const rate=money(num(document.getElementById('e_rate')?.value)||rateFor(c,P.id));
    if(qty<=0){ toast(`Enter ${P.name.toLowerCase()} quantity`,'err'); return; }
    if(rate<=0){ toast(`Enter a valid rate per ${P.unit}`,'err'); return; }
    if(qty>5000){ toast('Quantity looks too large — please check','err'); return; }
    const amount=money(qty*rate);
    patch={type:'sale',pid:P.id,date,qty,unit:P.unit,rate,amount,delta:amount,note};
  } else {
    const amount=money(num(document.getElementById('e_amt')?.value));
    if(amount<=0){ toast('Enter payment amount','err'); return; }
    patch={type:'pay',date,amount,delta:-amount,method:document.getElementById('e_method').value,note};
  }

  /* Billing the same item on the same day twice is the easiest mistake to make
     and the hardest to spot later, so a repeat has to be deliberate. Only the
     same item counts — milk in the morning and ghee in the evening is normal. */
  if(type==='sale'&&!editId&&!confirmed){
    const already=saleOn(cid,date,patch.pid);
    if(already.length){
      confirmDuplicate(c,date,already,patch);
      return;
    }
  }

  _saving=true;
  const btn=document.getElementById('e_save');
  if(btn){ btn.disabled=true; btn.style.opacity='.6'; btn.style.pointerEvents='none'; }
  try{
    if(editId){
      const t=transactions.find(x=>x.id===editId);
      if(!t){ toast('Entry no longer exists','err'); closeSheet(); return; }
      Object.assign(t,patch,{editedAt:new Date().toISOString()});
      toast(type==='sale'?`${prodBy(patch.pid)?.name||'Item'} entry updated ✓`:'Payment updated ✓','ok');
    } else {
      transactions.push({id:uid(),cid,createdAt:new Date().toISOString(),...patch});
      toast(type==='sale'?`${prodBy(patch.pid)?.name||'Item'} entry saved ✓`:'Payment recorded ✓','ok');
    }
    persist(); _entry=null; closeSheet(); render(cur);
  } finally {
    setTimeout(()=>{ _saving=false; },400);
  }
}

/* ────────────────────────────────────────
   9. BILL & STATEMENT ENGINE
   One layout answers what a customer asks at the door: how much, for what,
   on which days, and what has already been paid. There is no short/long
   switch any more — the bill always carries its own detail, and picks the
   form of that detail from the length of the period:
     up to two months → a day-by-day milk grid plus the other dated entries
     longer, few rows → every entry with its date and running balance
     longer, many rows→ one line per month
──────────────────────────────────────── */
let _rcid=null, _rscope='month', _rmonth=mkKey(), _rfrom=mkKey()+'-01', _rto=today();
let _rdetail=true;   // older cached pages still read this name
/* Stamp choice for the bill: 'none' (no stamp), 'paid', 'unpaid', 'auto' (worked out from the khata). */
let _rstamp='none';

const RC={W:520, ink:'#14202E', ink2:'#3A4757', sub:'#627080', line:'#DCE3EB', soft:'#F3F6FA',
  blue:'#1661B6', blueSoft:'#E6F0FC', red:'#B8301F', redSoft:'#FCEBE8',
  green:'#14753F', greenSoft:'#E2F4E9', amber:'#8A5A00', amberSoft:'#FCF1D3',
  font:"'RAMS SF',-apple-system,'Helvetica Neue',Arial,sans-serif"};

const fmtDMY=d=>{ const x=parseD(d); return x?x.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}):d; };
const fmtDM =d=>{ const x=parseD(d); return x?x.toLocaleDateString('en-GB',{day:'2-digit',month:'short'}):d; };
const ymd   =x=>x.toLocaleDateString('en-CA');

function openReceiptModal(cid){
  _rcid=cid; _rscope='month'; _rmonth=mkKey(); _rfrom=mkKey()+'-01'; _rto=today(); _rstamp='none';
  const scroll=document.getElementById('receiptScroll');
  const old=scroll&&scroll.querySelector('#rCtrl'); if(old) old.remove();
  _buildReceiptModal();
  const bb=document.getElementById('btnDlBot'); if(bb) bb.style.display=botBillOk(custBy(cid))?'':'none';
  document.getElementById('receiptModal').classList.remove('hidden');
  document.body.style.overflow='hidden';
  scroll.scrollTop=0;
  /* Measuring only works once the modal is on screen — a hidden node has no
     width, which would leave the preview scaled to nothing. */
  fitReceiptPreview();
}

function closeReceiptModal(){
  document.getElementById('receiptModal').classList.add('hidden');
  document.body.style.overflow='';
}

const R_HINT={
  month:'Ek mahine ka bill, full statement ki tarah: har entry tareekh aur balance ke saath.',
  range:'Apni marzi ki tareekhon ka hisaab, full statement ki tarah tareekh aur balance ke saath.',
  all:'Pehle din se aaj tak ka poora hisaab.'
};

function _buildReceiptModal(){
  const wrap=document.getElementById('receiptPreviewWrap'); if(!wrap) return;
  const scroll=document.getElementById('receiptScroll');
  scroll.querySelector('#rCtrl')||_injectReceiptCtrl(scroll);
  const on=(id,v)=>document.getElementById(id).classList.toggle('on',v);
  on('rTab_m',_rscope==='month'); on('rTab_r',_rscope==='range'); on('rTab_a',_rscope==='all');
  ['none','paid','unpaid','auto'].forEach(k=>{ const b=document.getElementById('rStamp_'+k); if(b) b.classList.toggle('on',_rstamp===k); });
  document.getElementById('rMonthPick').style.display=_rscope==='month'?'flex':'none';
  document.getElementById('rRangePick').style.display=_rscope==='range'?'grid':'none';
  document.getElementById('rHint').textContent=R_HINT[_rscope]||'';
  const mi=document.getElementById('rMonthInp'); if(mi&&mi.value!==_rmonth) mi.value=_rmonth;
  const nx=document.getElementById('rMonthNext'); if(nx){ const end=_rmonth>=mkKey(); nx.disabled=end; nx.style.opacity=end?'.35':'1'; }
  _refreshReceipt();
}

function _injectReceiptCtrl(scroll){
  const div=document.createElement('div');
  div.id='rCtrl';
  div.style.cssText='margin-bottom:14px;display:flex;flex-direction:column;gap:10px';
  div.innerHTML=`
    <div class="seg seg-block">
      <button id="rTab_m" onclick="_setRScope('month')">Monthly bill</button>
      <button id="rTab_r" onclick="_setRScope('range')">Custom dates</button>
      <button id="rTab_a" onclick="_setRScope('all')">Full statement</button>
    </div>
    <div id="rMonthPick" style="align-items:center;gap:8px">
      <button class="icon-btn" onclick="_stepRMonth(-1)" aria-label="Previous month" style="background:var(--surface);width:48px;height:48px">
        <i class="fa-solid fa-chevron-left"></i>
      </button>
      <input id="rMonthInp" type="month" class="field" aria-label="Bill month" style="flex:1;min-width:0;background:var(--surface);text-align:center;font-weight:600;height:48px;padding:0 10px"
        value="${_rmonth}" max="${mkKey()}" onchange="_rmonth=this.value||mkKey();_buildReceiptModal()">
      <button id="rMonthNext" class="icon-btn" onclick="_stepRMonth(1)" aria-label="Next month" style="background:var(--surface);width:48px;height:48px">
        <i class="fa-solid fa-chevron-right"></i>
      </button>
    </div>
    <div id="rRangePick" style="grid-template-columns:1fr 1fr;gap:8px">
      <div>
        <label class="label" style="padding-left:4px">From</label>
        <input type="date" class="field" style="background:var(--surface);padding:12px" value="${_rfrom}" max="${today()}" onchange="_rfrom=this.value||_rfrom;_refreshReceipt()">
      </div>
      <div>
        <label class="label" style="padding-left:4px">To</label>
        <input type="date" class="field" style="background:var(--surface);padding:12px" value="${_rto}" max="${today()}" onchange="_rto=this.value||_rto;_refreshReceipt()">
      </div>
    </div>
    <p id="rHint" style="font-size:13px;color:var(--sub);line-height:1.4;padding:0 4px"></p>
    <div>
      <label class="label" style="padding-left:4px">Stamp</label>
      <div class="seg seg-block">
        <button id="rStamp_none" onclick="_setRStamp('none')">No stamp</button>
        <button id="rStamp_paid" class="b" onclick="_setRStamp('paid')">Paid</button>
        <button id="rStamp_unpaid" onclick="_setRStamp('unpaid')">Unpaid</button>
        <button id="rStamp_auto" onclick="_setRStamp('auto')">Auto</button>
      </div>
    </div>`;
  scroll.insertBefore(div, scroll.firstChild);
  return div;
}

function _setRScope(s){ _rscope=s; _buildReceiptModal(); }
function _setRStamp(k){ _rstamp=k; _buildReceiptModal(); }
function _setRDetail(){ _buildReceiptModal(); }           // old name, kept harmless
function _stepRMonth(by){
  const [y,m]=_rmonth.split('-').map(Number);
  const next=mkKey(ymd(new Date(y,m-1+by,1)));
  if(next>mkKey()) return;                                 // no bills for months that have not happened
  _rmonth=next; _buildReceiptModal();
}
function _refreshReceipt(){
  const wrap=document.getElementById('receiptPreviewWrap'); if(!wrap) return;
  wrap.innerHTML=buildReceiptHTML(_rcid);
  fitReceiptPreview();
}

/* The bill is laid out at one fixed width so the saved image and PDF are the
   same shape whatever phone made them. On screen it is scaled to fit the
   sheet; the export still renders the node at full size off-stage. */
function fitReceiptPreview(){
  const wrap=document.getElementById('receiptPreviewWrap'); if(!wrap) return;
  const node=wrap.querySelector('#receiptNode'); if(!node) return;
  node.style.transform='none';
  wrap.style.height='';
  const avail=wrap.clientWidth;
  if(!avail) return;              // still hidden — the open handler re-runs this
  const s=Math.min(1, avail/RC.W);
  node.style.transformOrigin='top left';
  node.style.transform=`scale(${s})`;
  wrap.style.height=Math.ceil(node.offsetHeight*s)+'px';
}
window.addEventListener('resize',()=>{
  if(!document.getElementById('receiptModal').classList.contains('hidden')) fitReceiptPreview();
});

/* ── What the bill covers ── */
function receiptData(cid){
  const c=custBy(cid); if(!c) return null;
  const all=txOf(cid).sort(byOldest);
  let from,to,title,kind;
  if(_rscope==='range'){
    from=_rfrom||today(); to=_rto||today();
    if(from>to){ const x=from; from=to; to=x; }
    title=from===to?fmtDMY(from):`${fmtDM(from)} to ${fmtDMY(to)}`; kind='Statement';
  } else if(_rscope==='all'){
    from=all.length?all[0].date:today();
    to=all.length&&all[all.length-1].date>today()?all[all.length-1].date:today();
    title='Full statement'; kind='Statement';
  } else {
    const [y,m]=_rmonth.split('-').map(Number);
    from=_rmonth+'-01';
    to=_rmonth+'-'+String(new Date(y,m,0).getDate()).padStart(2,'0');
    title=monthLbl(_rmonth); kind='Bill';
  }
  let rows=all.filter(t=>t.date>=from&&t.date<=to);
  let opening=_rscope==='all'?0:money(all.filter(t=>t.date<from).reduce((s,t)=>s+num(t.delta),0));
  /* v22: a payment made inside this period that only cleared the dues from
     BEFORE it (e.g. the 1-15 bill paid on the 19th) belongs to that earlier
     bill. It is taken off the previous balance and left out of this one, so
     the 15-30 statement shows just its own milk. Payments clear the oldest
     dues first; only what is left over after the old dues shows here. */
  if(opening>0){
    let left=opening; const keep=[]; let spill=null;
    for(const t of rows){
      if(left>0&&t.type==='pay'&&num(t.delta)<0){
        const amt=num(t.amount)||-num(t.delta);
        if(amt<=left){ left=money(left-amt); continue; }
        const rest=money(amt-left); left=0;
        const part={...t,amount:rest,delta:-rest};
        keep.push(part); spill=part; continue;
      }
      keep.push(t);
    }
    rows=keep; opening=left;
    /* v23: the same payment also paid for the first days of this period
       (e.g. the old bill ran to the 15th and the statement starts on the
       15th). Those days are already paid, so they drop off this statement
       together with the part of the payment that covered them. Only on
       custom dates; a monthly bill keeps every day of its month. */
    if(spill&&_rscope==='range'){
      let rest=num(spill.amount); const gone=new Set();
      for(const t of rows){
        if(t===spill) continue;
        if(!isSale(t)||t.date>spill.date) break;
        const a=num(t.delta); if(a<=0||a>rest) break;
        rest=money(rest-a); gone.add(t);
      }
      if(gone.size){
        rows=rows.filter(t=>!gone.has(t));
        /* the period now starts the day after the last paid day */
        const lastPaid=[...gone].map(t=>t.date).sort().pop(), nx=parseD(lastPaid);
        nx.setDate(nx.getDate()+1); const nf=ymd(nx);
        if(nf<=to){ from=nf; title=from===to?fmtDMY(from):`${fmtDM(from)} to ${fmtDMY(to)}`; }
        if(rest>0){ spill.amount=rest; spill.delta=-rest; }
        else rows=rows.filter(t=>t!==spill);
      }
    }
  }
  const items=itemBreakdown(rows);
  const goods=money(items.reduce((s,i)=>s+i.amount,0));
  const pays=rows.filter(t=>t.type==='pay');
  const paid=money(pays.reduce((s,t)=>s+num(t.amount),0));
  const closing=money(opening+rows.reduce((s,t)=>s+num(t.delta),0));
  /* Whatever is left after goods and payments — an opening figure typed in
     when the account was made, or an adjustment. Printing it is what makes
     the lines on the bill always add up to the total under them. */
  const other=money(closing-opening-goods+paid);
  const days=Math.round((parseD(to)-parseD(from))/864e5)+1;
  /* Monthly bill and custom dates use the same full-statement layout (date-wise
     table with running balance), only filtered to the chosen dates. */
  const mode=(_rscope!=='all'&&days<=62)?'ledger':rows.length<=60?'ledger':'monthly';
  const serial=String(Math.max(1,customers.indexOf(c)+1)).padStart(3,'0');
  const no=kind==='Bill'?_rmonth.slice(2).replace('-','')+'-'+serial:'S'+to.slice(2).replace(/-/g,'')+'-'+serial;
  return {c,all,rows,from,to,title,kind,opening,items,goods,pays,paid,other,closing,days,mode,no};
}

/* ── Small building blocks ── */
/* Customers dial the local form, so the bill prints 0323… rather than +92 323… */
const rcPhone=()=>String(SHOP.phone||'').replace(/^\+92[\s-]*/,'0');
const rcSigned=v=>v<0?'− '+PKR(-v):PKR(v);
const rcBal=v=>v>0?PKR(v):v<0?PKR(-v)+' adv':'Rs 0';
const rcDetail=t=>isSale(t)?`${esc(prodName(t))}, ${Qty(t.qty,unitOf(t))} × ${PKR(t.rate)}`
  :t.type==='pay'?`Payment received (${esc(t.method||'Cash')})${t.note?', '+esc(t.note):''}`
  :t.type==='opening'?'Opening balance'
  :`Adjustment${t.note?', '+esc(t.note):''}`;
const rcHead=(txt,right='')=>`<div style="display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:22px 0 9px">
    <div style="font-size:14px;font-weight:700;color:${RC.ink}">${txt}</div>
    ${right?`<div style="font-size:12px;color:${RC.sub};white-space:nowrap">${right}</div>`:''}
  </div>`;
const rcTh=(txt,al='left',w='')=>`<th style="padding:8px 8px;text-align:${al};font-size:11.5px;font-weight:600;color:${RC.ink2};background:${RC.soft};border-bottom:1px solid ${RC.line};white-space:nowrap${w?';width:'+w:''}">${txt}</th>`;
const rcTd=(html,al='left',st='')=>`<td style="padding:8px 8px;text-align:${al};font-size:12.5px;color:${RC.ink};border-bottom:1px solid ${RC.line};vertical-align:top;${st}">${html}</td>`;
const rcLine=(label,sub,val,o={})=>`<div style="display:flex;align-items:baseline;justify-content:space-between;gap:14px;padding:7px 0;${o.top?`border-top:1px solid ${RC.line};margin-top:3px;padding-top:10px;`:''}">
    <div style="min-width:0;font-size:13.5px;color:${RC.ink};font-weight:${o.bold?600:400}">${label}${sub?`<span style="color:${RC.sub};font-size:12px;font-weight:400">&nbsp;&nbsp;${sub}</span>`:''}</div>
    <div style="flex-shrink:0;white-space:nowrap;font-size:13.5px;font-weight:${o.bold?700:500};color:${o.clr||RC.ink}">${val}</div>
  </div>`;
function rcHeader(docTitle,line2){
  return `<div style="display:flex;align-items:center;gap:13px">
      <img src="${LOGO}" alt="" style="width:56px;height:56px;border-radius:50%;object-fit:cover;flex-shrink:0;background:#fff"/>

function rcFooter(what){

/* ── Day-by-day milk ──
   The part a household actually checks: which days the milk came. */
function rcDailyGrid(d){
  const milk=d.rows.filter(t=>isSale(t)&&pidOf(t)==='milk');
  if(!milk.length) return '';
  const byDay={}; milk.forEach(t=>byDay[t.date]=money((byDay[t.date]||0)+num(t.qty)));
  const unit=unitOf(milk[0]);
  /* The grid runs only over days that could have had a delivery: not before
     the account's first entry, and not past today. */
  const first=d.all.length?d.all[0].date:d.from, td=today();
  const gs=d.from<first?first:d.from, ge=d.to>td?td:d.to;
  if(gs>ge) return '';
  const oneMonth=mkKey(gs)===mkKey(ge);
  let cells='', got=0, naga=0, total=0;
  for(const x=parseD(gs); ymd(x)<=ge; x.setDate(x.getDate()+1)){
    const ds=ymd(x), q=byDay[ds]||0;
    const lbl=oneMonth?x.toLocaleDateString('en-GB',{day:'numeric',weekday:'short'}).replace(',','')
                      :x.toLocaleDateString('en-GB',{day:'numeric',month:'short'});
    let val, vs, bg='#fff';
    if(q>0){ got++; total=money(total+q); val=Qnum(q); vs=`font-size:15px;font-weight:700;color:${RC.ink}`; }
    else if(onLeave(d.c,ds)){ val='Chhutti'; vs=`font-size:11px;font-weight:600;color:${RC.amber};padding-top:3px`; bg=RC.amberSoft; }
    else { naga++; val='Naga'; vs=`font-size:11.5px;font-weight:600;color:${RC.red};padding-top:3px`; bg=RC.redSoft; }
    cells+=`<div style="border:1px solid ${RC.line};border-radius:8px;background:${bg};text-align:center;padding:5px 0 5px;height:46px;box-sizing:border-box">
        <div style="font-size:10.5px;color:${RC.sub};line-height:1.15;white-space:nowrap">${lbl}</div>
        <div style="line-height:1.2;margin-top:2px;${vs}">${val}</div>
      </div>`;
  }
  const span=gs===ge?fmtDM(gs):oneMonth?`${parseD(gs).getDate()} to ${fmtDM(ge)}`:`${fmtDM(gs)} to ${fmtDM(ge)}`;
  return `${rcHead(`Daily milk (${unit==='L'?'litres':esc(unit)})`,span)}
    <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px">${cells}</div>
    <div style="display:flex;justify-content:space-between;gap:10px;margin-top:9px;font-size:12.5px;color:${RC.ink2}">
      <span>Milk came on <b style="font-weight:700;color:${RC.ink}">${got}</b> ${got===1?'day':'days'}${naga?`, naga on <b style="font-weight:700;color:${RC.red}">${naga}</b>`:''}</span>
      <span>Total <b style="font-weight:700;color:${RC.ink}">${Qty(total,unit)}</b></span>
    </div>`;
}

/* Dated lines for everything the grid does not show. */
function rcEntryList(rows,title){
  if(!rows.length) return '';
  return `${rcHead(title)}
    <table style="width:100%;border-collapse:collapse">
      <tbody>${rows.map(t=>`<tr>
        ${rcTd(fmtDM(t.date),'left',`white-space:nowrap;color:${RC.sub};width:58px;padding-left:0`)}
        ${rcTd(rcDetail(t))}
        ${rcTd(rcSigned(num(t.delta)),'right',`white-space:nowrap;font-weight:600;padding-right:0;color:${t.delta<0?RC.green:RC.ink}`)}
      </tr>`).join('')}</tbody>
    </table>`;
}

/* Every entry with its date and the balance after it. */
function rcLedger(d){
  let run=d.opening;
  const body=d.rows.map(t=>{
    run=money(run+num(t.delta));
    return `<tr>
      ${rcTd(fmtDM(t.date)+(d.days>300?' '+t.date.slice(2,4):''),'left',`white-space:nowrap;color:${RC.sub}`)}
      ${rcTd(rcDetail(t))}
      ${rcTd(rcSigned(num(t.delta)),'right',`white-space:nowrap;font-weight:600;color:${t.delta<0?RC.green:RC.ink}`)}
      ${rcTd(rcBal(run),'right',`white-space:nowrap;color:${run>0?RC.red:run<0?RC.green:RC.sub}`)}
    </tr>`;
  }).join('');
  const open=d.opening!==0?`<tr>
      ${rcTd(fmtDM(d.from),'left',`white-space:nowrap;color:${RC.sub}`)}
      ${rcTd('Balance from before','left',`color:${RC.sub}`)}
      ${rcTd('','right')}
      ${rcTd(rcBal(d.opening),'right',`white-space:nowrap;color:${d.opening>0?RC.red:RC.green}`)}
    </tr>`:'';
  return `${rcHead('Date-wise detail',`${d.rows.length} ${d.rows.length===1?'entry':'entries'}`)}
    <table style="width:100%;border-collapse:collapse">
      <thead><tr>${rcTh('Date','left','62px')}${rcTh('Detail')}${rcTh('Amount','right')}${rcTh('Balance','right')}</tr></thead>
      <tbody>${open}${body}</tbody>
    </table>`;
}

/* One line per month, for accounts too long to list entry by entry. */
function rcMonthly(d){
  const map=new Map();
  d.rows.forEach(t=>{
    const k=mkKey(t.date), e=map.get(k)||{goods:0,paid:0,net:0};
    if(isSale(t)) e.goods=money(e.goods+num(t.amount));
    if(t.type==='pay') e.paid=money(e.paid+num(t.amount));
    e.net=money(e.net+num(t.delta)); map.set(k,e);
  });
  let run=d.opening;
  const body=[...map.entries()].sort((a,b)=>a[0].localeCompare(b[0])).map(([k,e])=>{
    run=money(run+e.net);
    return `<tr>
      ${rcTd(monthLbl(k),'left','white-space:nowrap')}
      ${rcTd(PKR(e.goods),'right','white-space:nowrap')}
      ${rcTd(e.paid?PKR(e.paid):'','right',`white-space:nowrap;color:${RC.green}`)}
      ${rcTd(rcBal(run),'right',`white-space:nowrap;font-weight:600;color:${run>0?RC.red:run<0?RC.green:RC.sub}`)}
    </tr>`;
  }).join('');
  const open=d.opening!==0?`<tr>${rcTd('Balance from before','left',`color:${RC.sub}`)}${rcTd('','right')}${rcTd('','right')}
      ${rcTd(rcBal(d.opening),'right',`white-space:nowrap;color:${d.opening>0?RC.red:RC.green}`)}</tr>`:'';
  return `${rcHead('Month-wise detail',`${map.size} ${map.size===1?'month':'months'}`)}
    <table style="width:100%;border-collapse:collapse">
      <thead><tr>${rcTh('Month')}${rcTh('Goods','right')}${rcTh('Paid','right')}${rcTh('Balance','right')}</tr></thead>
      <tbody>${open}${body}</tbody>
    </table>
    <div style="font-size:12px;color:${RC.sub};margin-top:9px">For the day-by-day detail of any month, make that month's bill.</div>`;
}

/* ── THE BILL ── */
function buildReceiptHTML(cid){
  const d=receiptData(cid); if(!d) return '';
  const {c}=d;

  /* How the total is reached, top to bottom. */
  const sum=[];
  if(d.opening>0) sum.push(rcLine('Previous balance','',PKR(d.opening)));
  if(d.opening<0) sum.push(rcLine('Advance from before','',rcSigned(d.opening),{clr:RC.green}));
  d.items.forEach(it=>sum.push(rcLine(
    `<span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${it.color};margin-right:8px;vertical-align:1px"></span>${esc(it.name)}${it.urdu?` <span dir="rtl" style="unicode-bidi:isolate;color:${RC.sub};font-size:12.5px">${esc(it.urdu)}</span>`:''}`,
    it.rate?`${Qty(it.qty,it.unit)} × ${PKR(it.rate)}`:`${Qty(it.qty,it.unit)}, mixed rates`,
    PKR(it.amount))));
  if(d.other!==0) sum.push(rcLine('Opening balance / adjustment','',rcSigned(d.other),d.other<0?{clr:RC.green}:{}));
  if(d.items.length>1) sum.push(rcLine(d.kind==='Bill'?`Total goods, ${d.title}`:'Total goods','',PKR(d.goods),{top:true,bold:true}));
  if(d.paid!==0) sum.push(rcLine('Payments received',`${d.pays.length} ${d.pays.length===1?'payment':'payments'}`,rcSigned(-d.paid),{clr:RC.green}));
  if(!sum.length) sum.push(`<div style="padding:14px 0;text-align:center;font-size:13px;color:${RC.sub}">No entries in this period.</div>`);

  /* Stamp follows the choice in the receipt screen; 'auto' reads the khata. */
  const auto=billStatus(d);
  const lastPay=(d.pays.slice().sort(byNewest)[0]||{}).date||today();
  const stamp=_rstamp==='none'?null
             :_rstamp==='paid'?{paid:true,on:auto&&auto.paid?auto.on:lastPay}
             :_rstamp==='unpaid'?{paid:false,due:d.closing}
             :auto;
  const st=d.closing>0&&stamp&&stamp.paid?{bg:RC.greenSoft,fg:RC.green,lbl:'Bill amount, paid',note:`Paid on ${fmtDMY(stamp.on)}. Thank you!`,val:PKR(d.closing)}
          :d.closing>0?{bg:RC.redSoft,fg:RC.red,lbl:'Balance payable',note:'Please pay at your convenience.',val:PKR(d.closing)}
          :d.closing<0?{bg:RC.greenSoft,fg:RC.green,lbl:'Advance with shop',note:'This amount is held as your advance.',val:PKR(-d.closing)}
          :{bg:RC.soft,fg:RC.ink2,lbl:'Account clear',note:'Nothing to pay. Thank you!',val:'Rs 0'};

  let detail='';
  if(d.mode==='daily'){
    const grid=rcDailyGrid(d);
    const rest=grid?d.rows.filter(t=>!(isSale(t)&&pidOf(t)==='milk')):d.rows;
    detail=grid+rcEntryList(rest,grid?'Other items and payments':'Date-wise detail');
  } else if(d.rows.length){
    detail=d.mode==='ledger'?rcLedger(d):rcMonthly(d);
  }

  return `<div id="receiptNode" style="width:${RC.W}px;box-sizing:border-box;padding:24px 24px 18px;background:#fff;color:${RC.ink};font-family:${RC.font};font-size:13px;line-height:1.35">
    ${rcHeader(d.kind,`No. ${d.no}`)}

    <div style="display:flex;justify-content:space-between;gap:16px;margin-top:16px">
      <div style="min-width:0">
        <div style="font-size:12px;color:${RC.sub}">${d.kind==='Bill'?'Bill to':'Customer'}</div>
        <div style="font-size:17px;font-weight:700;color:${RC.ink};margin-top:2px;line-height:1.25">${esc(c.name)}</div>
        <div style="font-size:12.5px;color:${RC.ink2};margin-top:3px">${[c.phone,c.address].filter(Boolean).map(esc).join(', ')||'&nbsp;'}</div>
      </div>
      <div style="text-align:right;flex-shrink:0">
        <div style="font-size:12px;color:${RC.sub}">${d.kind==='Bill'?'Bill month':'Period'}</div>
        <div style="font-size:15px;font-weight:700;color:${RC.ink};margin-top:2px;white-space:nowrap">${d.title}</div>
        <div style="font-size:12.5px;color:${RC.ink2};margin-top:3px;white-space:nowrap">${_rscope==='range'?`Issued ${fmtDMY(today())}`:`${fmtDMY(d.from)} to ${fmtDMY(d.to)}`}</div>
      </div>
    </div>

    <div style="margin-top:16px;border:1px solid ${RC.line};border-radius:14px">
      <div style="padding:8px 16px 9px">${sum.join('')}</div>
      <div style="position:relative;background:${st.bg};border-radius:0 0 13px 13px;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px">
        <div style="min-width:0">
          <div style="font-size:15px;font-weight:700;color:${st.fg}">${st.lbl}</div>
          <div style="font-size:12px;color:${st.fg};margin-top:2px">${st.note}</div>
        </div>
        <div style="flex-shrink:0;font-size:30px;font-weight:700;line-height:1;color:${st.fg};white-space:nowrap;letter-spacing:-.01em">${st.val}</div>
        ${stamp?(()=>{ /* the stamp lands in the gap between the words and the amount */
          const inner=RC.W-50, sz=112;
          const textEnd=16+Math.max(st.lbl.length*8.6,st.note.length*6.3), amtStart=inner-16-String(st.val).length*17.6;
          const cx=Math.max(150,Math.min(330,(textEnd+amtStart)/2));
          return `<img src="${stampSVG(stamp)}" alt="${stamp.paid?'Paid':'Unpaid'}" data-stamp="${stamp.paid?'paid':'unpaid'}" data-on="${stamp.on||''}" data-alpha="1" style="position:absolute;width:${sz}px;height:${sz}px;left:${Math.round(cx-sz/2)}px;top:-50px;pointer-events:none"/>`;
        })():''}
      </div>
    </div>

    ${detail}
    ${rcFooter(d.kind.toLowerCase())}
  </div>`;
}

/* ── v19: PAID / UNPAID stamp ──
   Every bill carries the shop's round stamp. PAID once the whole amount of
   the bill has been received — also when it was paid after the bill's month
   ended (payments clear the oldest dues first, the way the khata is kept).
   UNPAID while anything on it is still owed. */
function billStatus(d){
  if(!d.rows.length&&d.opening===0) return null;           // nothing on this bill
  if(d.closing<=0){
    const last=d.rows.filter(t=>num(t.delta)<0).sort(byNewest)[0];
    return {paid:true,on:last?last.date:d.to};
  }
  let due=d.closing;
  for(const t of d.all.filter(t=>t.date>d.to&&num(t.delta)<0).sort(byOldest)){
    due=money(due+num(t.delta));
    if(due<=0) return {paid:true,on:t.date};
  }
  return {paid:false,due};
}
/* One drawing of the stamp (200 × 200 units), used both for the picture on
   screen and for the PDF, where it is drawn as real lines and letters. */
function stampSpec(st){
  const paid=st.paid;
  return {
    paid, ink:paid?[23,128,74]:[194,49,42], tilt:-13,
    top:SHOP.name.toUpperCase(), bottom:'MULTAN  ★  SINCE 1970',
    word:paid?'PAID':'UNPAID', wordSize:paid?37:28, wordLs:paid?4:1.5, wordY:paid?113.5:111,
    when:paid?('ON '+fmtDMY(st.on).toUpperCase()):'BALANCE DUE'
  };
}
function stampSVG(st){
  const s=stampSpec(st), ink=`rgb(${s.ink.join(',')})`;
  const ff="'Helvetica Neue',Helvetica,Arial,'Roboto',sans-serif";
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <path id="sTop" d="M 30,100 A 70,70 0 0 1 170,100"/>
    <path id="sBot" d="M 25,100 A 75,75 0 0 0 175,100"/>
  </defs>
  <g transform="rotate(${s.tilt} 100 100)" fill="none" stroke="${ink}" opacity=".9">
    <circle cx="100" cy="100" r="95" stroke-width="5"/>
    <circle cx="100" cy="100" r="88" stroke-width="1.6"/>
    <path d="M 47.32 81 A 56 56 0 0 1 152.68 81 M 48.09 121 A 56 56 0 0 0 151.91 121" stroke-width="1.6"/>
    <g stroke="none" fill="${ink}" font-family="${ff}" font-weight="800">
      <text font-size="12.4" letter-spacing="1.1" text-anchor="middle"><textPath href="#sTop" startOffset="50%">${esc(s.top)}</textPath></text>
      <text font-size="11" letter-spacing="1.8" text-anchor="middle"><textPath href="#sBot" startOffset="50%">${s.bottom}</textPath></text>
      <text x="100" y="66" font-size="11" text-anchor="middle">★ ★ ★</text>
      <text x="100" y="${s.wordY}" font-size="${s.wordSize}" font-weight="900" letter-spacing="${s.wordLs}" text-anchor="middle">${s.word}</text>
      <text x="100" y="135" font-size="8.6" letter-spacing=".8" text-anchor="middle" font-weight="700">${esc(s.when)}</text>
    </g>
    <rect x="12" y="81" width="176" height="40" rx="5" stroke-width="2.6"/>
    <rect x="16" y="85" width="168" height="32" rx="3" stroke-width="1"/>
  </g>
</svg>`;
  return 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);
}
/* The same stamp drawn straight into the PDF: a couple of KB instead of a
   picture. (cx,cy) is its centre and size its width, in PDF points. */
function stampToPdf(pdf,st,cx,cy,size){
  const s=stampSpec(st), u=size/200, th=s.tilt*Math.PI/180, C=Math.cos(th), Sn=Math.sin(th);
  const P=(x,y)=>{ const dx=x-100, dy=y-100; return [cx+(dx*C-dy*Sn)*u, cy+(dx*Sn+dy*C)*u]; };
  pdf.saveGraphicsState();
  try{ pdf.setGState(new pdf.GState({opacity:.9,'stroke-opacity':.9})); }catch{}
  pdf.setDrawColor(...s.ink); pdf.setFillColor(...s.ink); pdf.setTextColor(...s.ink);
  [[95,5],[88,1.6]].forEach(([r,w])=>{ pdf.setLineWidth(w*u); pdf.circle(cx,cy,r*u,'S'); });
  /* the inner ring stops at the band, as on a rubber stamp */
  pdf.setLineWidth(1.6*u);
  [[-19,true],[21,false]].forEach(([edge,top])=>{
    const a0=Math.asin(edge/56);
    const from=top?Math.PI-a0:a0, to=top?2*Math.PI+a0:Math.PI-a0, n=36;
    for(let i=0;i<=n;i++){
      const a=from+(to-from)*i/n, q=P(100+56*Math.cos(a),100+56*Math.sin(a));
      i?pdf.lineTo(...q):pdf.moveTo(...q);
    }
    pdf.stroke();
  });
  const rr=(x,y,w,h,r,lw)=>{
    const K=0.5523*r, pts=[
      ['m',x+r,y],['l',x+w-r,y],['c',x+w-r+K,y,x+w,y+r-K,x+w,y+r],['l',x+w,y+h-r],['c',x+w,y+h-r+K,x+w-r+K,y+h,x+w-r,y+h],
      ['l',x+r,y+h],['c',x+r-K,y+h,x,y+h-r+K,x,y+h-r],['l',x,y+r],['c',x,y+r-K,x+r-K,y,x+r,y]];
    pdf.setLineWidth(lw*u);
    pts.forEach(p=>{
      if(p[0]==='m') pdf.moveTo(...P(p[1],p[2]));
      else if(p[0]==='l') pdf.lineTo(...P(p[1],p[2]));
      else pdf.curveTo(...P(p[1],p[2]),...P(p[3],p[4]),...P(p[5],p[6]));
    });
    pdf.close(); pdf.stroke();
  };
  rr(12,81,176,40,5,2.6); rr(16,85,168,32,3,1);
  const star=(x,y,r)=>{                                     // a filled five-point star
    for(let i=0;i<10;i++){
      const a=-Math.PI/2+i*Math.PI/5, rad=i%2?r*0.42:r;
      const q=P(x+rad*Math.cos(a),y+rad*Math.sin(a));
      i?pdf.lineTo(...q):pdf.moveTo(...q);
    }
    pdf.close(); pdf.fill();
  };
  /* straight lines of text, centred on x=100 */
  const line=(t,y,fs,ls)=>{
    pdf.setFont('helvetica','bold'); pdf.setFontSize(fs*u);
    const w=pdf.getTextWidth(t)/u+ls*(t.length-1);
    pdf.text(t,...P(100-w/2,y),{angle:-s.tilt,charSpace:ls*u});
  };
  [86,100,114].forEach(x=>star(x,62.2,4.6));
  line(s.word,s.wordY,s.wordSize,s.wordLs);
  line(s.when,135,8.6,.8);
  /* lettering round the ring, one letter at a time */
  const arc=(t,r,fs,ls,bottom)=>{
    pdf.setFont('helvetica','bold'); pdf.setFontSize(fs*u);
    const adv=[...t].map(ch=>ch==='★'?fs*0.86:pdf.getTextWidth(ch)/u);
    const L=adv.reduce((a,b)=>a+b,0)+ls*(t.length-1);
    let sPos=-L/2;
    [...t].forEach((ch,i)=>{
      const mid=sPos+adv[i]/2;
      const phi=bottom?Math.PI/2-mid/r:1.5*Math.PI+mid/r;   // angle of the letter's centre
      const tx=bottom?Math.sin(phi):-Math.sin(phi), ty=bottom?-Math.cos(phi):Math.cos(phi);
      const mx=100+r*Math.cos(phi), my=100+r*Math.sin(phi);
      const ox=mx-tx*adv[i]/2, oy=my-ty*adv[i]/2;           // the letter's left foot
      const ang=Math.atan2(ty,tx)*180/Math.PI;
      if(ch==='★') star(mx+(100-mx)*fs*0.36/r,my+(100-my)*fs*0.36/r,fs*0.42);
      else if(ch.trim()) pdf.text(ch,...P(ox,oy),{angle:-(ang+s.tilt)});
      sPos+=adv[i]+ls;
    });
  };
  arc(s.top,70,12.4,1.1,false);
  arc(s.bottom,75,11,1.8,true);
  pdf.restoreGraphicsState();
}

/* ── v19: libraries load only when a bill is saved ──
   html2canvas and jsPDF are big (about 560 KB together). They used to load
   before the app could even draw, so every launch waited for them. Now they
   are fetched the first time a bill is made (and quietly warmed up a few
   seconds after the app opens), straight from the offline cache. */
const LIBS={
  h2c:{url:'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js',ok:()=>!!window.html2canvas},
  pdf:{url:'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js',ok:()=>!!(window.jspdf&&window.jspdf.jsPDF)}
};
const _libWait={};
function needLib(k){
  const L=LIBS[k];
  if(L.ok()) return Promise.resolve();
  return _libWait[k]||(_libWait[k]=new Promise((resolve,reject)=>{
    const s=document.createElement('script');
    s.src=L.url; s.async=true;
    s.onload=()=>L.ok()?resolve():(delete _libWait[k],reject(new Error('Library '+k+' did not start')));
    s.onerror=()=>{ delete _libWait[k]; s.remove(); reject(new Error('Library '+k+' could not load')); };
    document.head.appendChild(s);
  }));
}
function warmLibs(){
  const go=()=>{ needLib('h2c').catch(()=>{}); needLib('pdf').catch(()=>{}); };
  if('requestIdleCallback' in window) requestIdleCallback(go,{timeout:6000}); else setTimeout(go,1500);
}

/* ── v19: real PDF, like a bank statement ──
   The PDF used to be a photo of the bill (a 2.6× PNG inside the file), which
   is why a single month came out at several MB. Now the bill is laid out
   exactly as on screen and every line, box and word is written into the PDF
   as real text and vector shapes. The file is a few dozen KB, the text is
   sharp at any zoom, and it can be searched and copied.
   Only the logo, the PAID / UNPAID stamp and any Urdu text go in as small
   pictures, because the built-in PDF fonts cannot draw Urdu. */
const VP={
  /* Characters the built-in PDF fonts (Windows-1252) can write directly. */
  okChar(ch){
    const c=ch.codePointAt(0);
    return (c>=0x20&&c<0x7F)||(c>=0xA0&&c<=0xFF)||CP1252_BACK[c]!==undefined;
  },
  clean(s){
    return s.replace(/−/g,'–').replace(/[     ]/g,' ')
            .replace(/[​-‏⁦-⁩‪-‮]/g,'');
  },
  rgb(str){
    const m=String(str||'').match(/rgba?\(([^)]+)\)/);
    if(!m) return null;
    const p=m[1].split(/[,\s/]+/).filter(Boolean).map(Number);
    const a=p.length>3?p[3]:1;
    if(!(a>0)) return null;
    return {r:p[0],g:p[1],b:p[2],a};
  },
  /* Mix a translucent colour onto white, the way it looks on the paper. */
  solid(c){
    if(c.a>=1) return [c.r,c.g,c.b];
    return [c.r,c.g,c.b].map(v=>Math.round(v*c.a+255*(1-c.a)));
  },
  radii(cs,w,h){
    const one=v=>{ const p=String(v).split(' ')[0]; return p.endsWith('%')?parseFloat(p)/100*Math.min(w,h):parseFloat(p)||0; };
    let r=[one(cs.borderTopLeftRadius),one(cs.borderTopRightRadius),one(cs.borderBottomRightRadius),one(cs.borderBottomLeftRadius)];
    const lim=Math.min(w,h)/2;
    return r.map(v=>Math.max(0,Math.min(v,lim)));
  }
};
const _vpMetric={};
function vpAscent(font){
  if(_vpMetric[font]!=null) return _vpMetric[font];
  const cx=(vpAscent._c||(vpAscent._c=document.createElement('canvas'))).getContext('2d');
  cx.font=font;
  const m=cx.measureText('Hg');
  return (_vpMetric[font]=m.fontBoundingBoxAscent||parseFloat(font.match(/(\d+(?:\.\d+)?)px/)?.[1]||13)*0.93);
}

/* Read the laid-out bill into a flat list of shapes, words and pictures. */
function vpCollect(root){
  const R=root.getBoundingClientRect();
  const ops=[], atoms=[];
  const box=r=>({x:r.left-R.left,y:r.top-R.top,w:r.width,h:r.height});
  /* Boxes that cut off what is inside them (overflow:hidden), nearest first. */
  function clipChain(from){
    const out=[];
    for(let a=from;a;a=a.parentElement){
      const s=getComputedStyle(a);
      if(s.overflow!=='visible'){
        const b=box(a.getBoundingClientRect());
        out.push({...b,r:VP.radii(s,b.w,b.h)});
      }
      if(a===root) break;
    }
    return out;
  }
  const fontOf=cs=>`${cs.fontStyle} ${cs.fontWeight} ${cs.fontSize} ${cs.fontFamily}`;
  function textRuns(node,cs){
    const raw=node.nodeValue; if(!raw||!raw.trim()) return;
    const words=[], rg=document.createRange(), re=/\S+/g; let m;
    while((m=re.exec(raw))){
      rg.setStart(node,m.index); rg.setEnd(node,m.index+m[0].length);
      const r=rg.getBoundingClientRect(); if(!r.width) continue;
      words.push({t:m[0],r});
    }
    if(!words.length) return;
    const lines=[];
    words.forEach(w=>{
      const L=lines[lines.length-1];
      if(L&&Math.abs(L.top-w.r.top)<2){ L.words.push(w); L.left=Math.min(L.left,w.r.left); L.right=Math.max(L.right,w.r.right); L.bottom=Math.max(L.bottom,w.r.bottom); }
      else lines.push({words:[w],top:w.r.top,bottom:w.r.bottom,left:w.r.left,right:w.r.right});
    });
    const rtl=cs.direction==='rtl';
    lines.forEach(L=>{
      const t=L.words.map(w=>w.t).join(' ');
      const b=box({left:L.left,top:L.top,width:L.right-L.left,height:L.bottom-L.top});
      const op={k:'text',...b,t,rtl,font:fontOf(cs),size:parseFloat(cs.fontSize),bold:parseInt(cs.fontWeight,10)>=600,
        color:VP.rgb(cs.color)||{r:0,g:0,b:0,a:1},clips:clipChain(node.parentElement)};
      ops.push(op); atoms.push(b);
    });
  }
  (function walk(el){
    const cs=getComputedStyle(el);
    if(cs.display==='none'||cs.visibility==='hidden'||parseFloat(cs.opacity)===0) return;
    const r=el.getBoundingClientRect();
    if(r.width&&r.height){
      const b=box(r), rad=VP.radii(cs,b.w,b.h), clips=el===root?[]:clipChain(el.parentElement);
      const bg=VP.rgb(cs.backgroundColor);
      if(bg&&el!==root) ops.push({k:'fill',...b,r:rad,color:bg,clips});
      const side=s=>({w:parseFloat(cs['border'+s+'Width'])||0,c:VP.rgb(cs['border'+s+'Color']),st:cs['border'+s+'Style']});
      const T=side('Top'),Rt=side('Right'),B=side('Bottom'),L=side('Left');
      const all=[T,Rt,B,L];
      if(all.every(s=>s.w>0&&s.c&&s.st!=='none'&&s.w===T.w&&s.c.r===T.c.r&&s.c.g===T.c.g&&s.c.b===T.c.b)&&rad.some(v=>v>0)){
        ops.push({k:'frame',...b,r:rad,lw:T.w,color:T.c,clips});
      } else {
        if(T.w&&T.c&&T.st!=='none')  ops.push({k:'line',x1:b.x,y1:b.y+T.w/2,x2:b.x+b.w,y2:b.y+T.w/2,lw:T.w,color:T.c,clips});
        if(B.w&&B.c&&B.st!=='none')  ops.push({k:'line',x1:b.x,y1:b.y+b.h-B.w/2,x2:b.x+b.w,y2:b.y+b.h-B.w/2,lw:B.w,color:B.c,clips});
        if(L.w&&L.c&&L.st!=='none')  ops.push({k:'line',x1:b.x+L.w/2,y1:b.y,x2:b.x+L.w/2,y2:b.y+b.h,lw:L.w,color:L.c,clips});
        if(Rt.w&&Rt.c&&Rt.st!=='none')ops.push({k:'line',x1:b.x+b.w-Rt.w/2,y1:b.y,x2:b.x+b.w-Rt.w/2,y2:b.y+b.h,lw:Rt.w,color:Rt.c,clips});
      }
      if(el.tagName==='IMG'&&el.complete&&el.naturalWidth){
        ops.push({k:'img',...b,r:rad,el,cover:cs.objectFit==='cover',alpha:el.dataset.alpha==='1',clips});
        atoms.push(b);
      }
      /* Small boxes (table rows, day cells, chips) are never cut by a page break. */
      if((bg||T.w||B.w)&&b.h<140&&el!==root) atoms.push(b);
      if(el.tagName==='TR') atoms.push(b);
    }
    for(const ch of el.childNodes){
      if(ch.nodeType===1) walk(ch);
      else if(ch.nodeType===3) textRuns(ch,cs);
    }
  })(root);
  return {ops,atoms,W:R.width,H:R.height};
}

/* Page breaks fall between rows, never through a line of text. */
function vpBreaks(atoms,H,cap){
  const out=[]; let y=0;
  while(H-y>cap+0.5){
    let b=y+cap;
    for(let guard=0;guard<60;guard++){
      const hit=atoms.filter(a=>a.y<b-0.5&&a.y+a.h>b+0.5);
      if(!hit.length) break;
      b=Math.min(...hit.map(a=>a.y))-0.5;
    }
    if(b<y+cap*0.35) b=y+cap;      // a block taller than a page: cut it
    out.push(b); y=b;
  }
  return out;
}

async function vpImage(op,scale){
  const el=op.el, W=Math.max(1,Math.round(op.w*scale)), H=Math.max(1,Math.round(op.h*scale));
  const cv=document.createElement('canvas'); cv.width=W; cv.height=H;
  const cx=cv.getContext('2d');
  if(!op.alpha){ cx.fillStyle='#fff'; cx.fillRect(0,0,W,H); }
  if(op.r.some(v=>v>0)){
    const rr=op.r.map(v=>v*scale);
    cx.beginPath();
    if(cx.roundRect) cx.roundRect(0,0,W,H,rr); else cx.rect(0,0,W,H);
    cx.clip();
  }
  let sx=0,sy=0,sw=el.naturalWidth,sh=el.naturalHeight;
  if(op.cover){
    const s=Math.max(W/sw,H/sh), cw=W/s, ch=H/s;
    sx=(sw-cw)/2; sy=(sh-ch)/2; sw=cw; sh=ch;
  }
  cx.imageSmoothingQuality='high';
  cx.drawImage(el,sx,sy,sw,sh,0,0,W,H);
  return op.alpha?{data:cv.toDataURL('image/png'),fmt:'PNG'}:{data:cv.toDataURL('image/jpeg',0.9),fmt:'JPEG'};
}

/* Urdu and other scripts the PDF fonts cannot write go in as a tiny picture. */
function vpTextImage(op,scale){
  const W=Math.ceil((op.w+4)*scale), H=Math.ceil((op.h+2)*scale);
  const cv=document.createElement('canvas'); cv.width=W; cv.height=H;
  const cx=cv.getContext('2d');
  cx.scale(scale,scale);
  cx.font=op.font; cx.fillStyle=`rgb(${op.color.r},${op.color.g},${op.color.b})`;
  cx.textBaseline='alphabetic';
  if(op.rtl){ cx.direction='rtl'; cx.textAlign='right'; cx.fillText(op.t,op.w+2,vpAscent(op.font)+1); }
  else { cx.textAlign='left'; cx.fillText(op.t,2,vpAscent(op.font)+1); }
  return cv.toDataURL('image/png');
}

async function htmlToVectorPdf(html,name,meta={}){
  await needLib('pdf');
  const stage=document.getElementById('exportStage');
  stage.innerHTML=html;
  try{
    try{ if(document.fonts&&document.fonts.ready) await document.fonts.ready; }catch{}
    await Promise.all([...stage.querySelectorAll('img')].map(im=>im.complete?0:new Promise(r=>{ im.onload=im.onerror=r; })));
    await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
    const root=stage.firstElementChild;
    const {ops,atoms,W,H}=vpCollect(root);

    const {jsPDF}=window.jspdf;
    const PW=595.28, PH=841.89, M=34, FOOT=16;
    const kMax=Math.min((PW-2*M)/W, 481.9/W);          // never wider than 170 mm, as before
    const kOne=(PH-2*M)/H;
    const one=kOne>=283.5/W;                           // fits one A4 page at 100 mm or wider
    const k=one?Math.min(kMax,kOne):kMax;
    const cap=one?H:(PH-2*M-FOOT)/k;
    const breaks=one?[]:vpBreaks(atoms,H,cap);
    const starts=[0,...breaks], ends=[...breaks,H];
    const ox=(PW-W*k)/2;

    const pdf=new jsPDF({unit:'pt',format:'a4',orientation:'p',compress:true});
    pdf.setDocumentProperties({title:meta.title||name,subject:meta.subject||'',author:SHOP.name,creator:'RAMS Khata · '+SOFTWARE.by,keywords:'bill, statement, khata'});
    const imgCache=new Map();
    let imgN=0;

    const pathRR=(x,y,w,h,r)=>{
      const [a,b,c,d]=r, K=0.5523;
      pdf.moveTo(x+a,y);
      pdf.lineTo(x+w-b,y);  if(b) pdf.curveTo(x+w-b+b*K,y,x+w,y+b-b*K,x+w,y+b);
      pdf.lineTo(x+w,y+h-c);if(c) pdf.curveTo(x+w,y+h-c+c*K,x+w-c+c*K,y+h,x+w-c,y+h);
      pdf.lineTo(x+d,y+h);  if(d) pdf.curveTo(x+d-d*K,y+h,x,y+h-d+d*K,x,y+h-d);
      pdf.lineTo(x,y+a);    if(a) pdf.curveTo(x,y+a-a*K,x+a-a*K,y,x+a,y);
      pdf.close();
    };

    for(let p=0;p<starts.length;p++){
      if(p) pdf.addPage();
      const y0=starts[p], y1=ends[p];
      const X=v=>ox+v*k, Y=v=>M+(v-y0)*k;
      pdf.saveGraphicsState();
      pdf.rect(0,M-1,PW,(y1-y0)*k+2,null); pdf.clip(); pdf.discardPath();

      for(const op of ops){
        const top=op.k==='line'?Math.min(op.y1,op.y2):op.y, bot=op.k==='line'?Math.max(op.y1,op.y2):op.y+op.h;
        if(bot<y0-1||top>y1+1) continue;
        const clipped=op.clips&&op.clips.length;
        if(clipped){
          pdf.saveGraphicsState();
          op.clips.forEach(c=>{ pathRR(X(c.x),Y(c.y),c.w*k,c.h*k,c.r.map(v=>v*k)); pdf.clip(); pdf.discardPath(); });
        }
        if(op.k==='fill'){
          pdf.setFillColor(...VP.solid(op.color));
          if(op.r.some(v=>v>0)){ pathRR(X(op.x),Y(op.y),op.w*k,op.h*k,op.r.map(v=>v*k)); pdf.fill(); }
          else pdf.rect(X(op.x),Y(op.y),op.w*k,op.h*k,'F');
        } else if(op.k==='frame'){
          pdf.setDrawColor(...VP.solid(op.color)); pdf.setLineWidth(op.lw*k);
          const i=op.lw/2;
          pathRR(X(op.x+i),Y(op.y+i),(op.w-op.lw)*k,(op.h-op.lw)*k,op.r.map(v=>Math.max(0,v-i)*k)); pdf.stroke();
        } else if(op.k==='line'){
          pdf.setDrawColor(...VP.solid(op.color)); pdf.setLineWidth(op.lw*k);
          pdf.line(X(op.x1),Y(op.y1),X(op.x2),Y(op.y2));
        } else if(op.k==='img'&&op.el.dataset.stamp){
          stampToPdf(pdf,{paid:op.el.dataset.stamp==='paid',on:op.el.dataset.on},X(op.x+op.w/2),Y(op.y+op.h/2),op.w*k);
        } else if(op.k==='img'){
          const key=op.el.src+'|'+Math.round(op.w)+'x'+Math.round(op.h)+'|'+op.r.join(',');
          let im=imgCache.get(key);
          if(!im){ im={...(await vpImage(op,op.alpha?2.4:3)),alias:'im'+(imgN++)}; imgCache.set(key,im); }
          pdf.addImage(im.data,im.fmt,X(op.x),Y(op.y),op.w*k,op.h*k,im.alias,'FAST');
        } else if(op.k==='text'){
          const t=VP.clean(op.t);
          if(op.rtl||![...t].every(VP.okChar)){
            const key='t|'+op.font+'|'+op.t+'|'+op.color.r+op.color.g+op.color.b;
            let al=imgCache.get(key);
            if(!al){ al={data:vpTextImage(op,4),alias:'tx'+(imgN++)}; imgCache.set(key,al); }
            pdf.addImage(al.data,'PNG',X(op.x-2),Y(op.y-1),(op.w+4)*k,(op.h+2)*k,al.alias,'FAST');
          } else {
            const fs=op.size*k;
            pdf.setFont('helvetica',op.bold?'bold':'normal');
            pdf.setFontSize(fs);
            pdf.setTextColor(...VP.solid(op.color));
            const tw=pdf.getTextWidth(t), target=op.w*k;
            /* Helvetica is a hair wider or narrower than the screen font, so the
               spacing is nudged until each line fills exactly the space it had. */
            let cs=(target-tw)/Math.max(1,t.length);
            let x=X(op.x);
            if(Math.abs(cs)>fs*0.09){ cs=0; x=X(op.x)+(target-tw)/2; }
            pdf.text(t,x,Y(op.y)+vpAscent(op.font)*k,{charSpace:cs,baseline:'alphabetic'});
          }
        }
        if(clipped) pdf.restoreGraphicsState();
      }
      pdf.restoreGraphicsState();
      if(starts.length>1){
        pdf.setFont('helvetica','normal'); pdf.setFontSize(8); pdf.setTextColor(98,112,128);
        pdf.text(`${meta.footer||SHOP.name}   ·   Page ${p+1} of ${starts.length}`,PW/2,PH-M/2-2,{align:'center'});
      }
    }
    const blob=pdf.output('blob');
    saveBlob(blob,name+'.pdf');
    return blob.size;
  } finally { stage.innerHTML=''; }
}

/* ── Saving and sharing ── */
function receiptFileName(c,d){
  const who=c.name.trim().replace(/[^\w]+/g,'_').replace(/^_|_$/g,'')||'Customer';
  const when=_rscope==='month'?monthLbl(_rmonth).replace(/\s+/g,'-'):_rscope==='all'?'Full-statement':`${d.from}_to_${d.to}`;
  return `${d.kind}_${who}_${when}`;
}
function saveBlob(blob,name){
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),5000);
}
const fmtSize=b=>b<1048576?Math.max(1,Math.round(b/1024))+' KB':(b/1048576).toFixed(1)+' MB';
async function renderForExport(html){
  await needLib('h2c');
  const stage=document.getElementById('exportStage');
  stage.innerHTML=html;
  try{ if(document.fonts&&document.fonts.ready) await document.fonts.ready; }catch{}
  await new Promise(r=>setTimeout(r,140));
  const node=stage.firstElementChild;
  /* Browsers refuse canvases taller than about 16,000px, so a very long
     statement is drawn a little less sharp rather than failing outright. */
  const scale=Math.max(1.2,Math.min(2.6,15000/Math.max(1,node.offsetHeight)));
  try{ return await html2canvas(node,{scale,backgroundColor:'#ffffff',useCORS:true,logging:false}); }
  finally{ stage.innerHTML=''; }
}

let _exporting=false;
async function receiptDownload(kind){
  if(_exporting) return;
  const c=custBy(_rcid), d=receiptData(_rcid); if(!c||!d) return;
  const btn=document.getElementById({share:'btnDlShare',png:'btnDlPng',pdf:'btnDlPdf',bot:'btnDlBot'}[kind]);
  const orig=btn.innerHTML;
  _exporting=true;
  btn.innerHTML='<i class="fa-solid fa-spinner fa-spin"></i> Wait';
  btn.style.opacity='.7';
  try{
    const sc=rScopeNow();
    const name=receiptFileName(c,d);
    /* v19: the PDF is written as real text, not a photo, so it stays in KBs. */
    if(kind==='pdf'){
      const size=await htmlToVectorPdf(buildReceiptHTML(_rcid),name,{
        title:`${d.kind} ${d.title} - ${c.name}`,subject:`${SHOP.name}, ${d.kind.toLowerCase()} No. ${d.no}`,
        footer:`${SHOP.name}  ·  ${c.name}  ·  ${d.kind} No. ${d.no}`});
      toast(`PDF saved (${fmtSize(size)})`,'ok');
      if(_rscope!=='all'&&pngAuto()&&botBillOk(c)){
        const cv=await renderForExport(buildReceiptHTML(_rcid));
        botSendBill(c,d,cv,sc).then(r=>{ if(!r.ok) toast('Bot pe bill nahi gaya: '+String(r.msg||''),'warn'); })
          .catch(e=>console.warn('[PNG]',e));
      }
      return;
    }
    const canvas=await renderForExport(buildReceiptHTML(_rcid));
    /* v16: the bill also goes to the bot, so the customer can ask for it on WhatsApp. */
    if(kind==='bot'){
      const r=await botSendBill(c,d,canvas,sc);
      toast(r.ok?`Bill bot pe chala gaya — ${c.name} WhatsApp pe "bill" likh kar le sakte hain`:String(r.msg||'Bill bot pe nahi gaya'),r.ok?'ok':'err');
      return;
    }
    if(_rscope!=='all'&&pngAuto()&&botBillOk(c)){
      botSendBill(c,d,canvas,sc).then(r=>{ if(!r.ok) toast('Bot pe bill nahi gaya: '+String(r.msg||''),'warn'); })
        .catch(e=>console.warn('[PNG]',e));
    }
    const blob=await new Promise(r=>canvas.toBlob(r,'image/png'));
    if(!blob) throw new Error('empty image');
    if(kind==='share'){
      const file=new File([blob],name+'.png',{type:'image/png'});
      if(navigator.canShare&&navigator.canShare({files:[file]})){
        try{ await navigator.share({files:[file],title:`${d.kind} for ${c.name}`}); return; }
        catch(e){ if(e&&e.name==='AbortError') return; console.warn('[SHARE]',e); }
      }
      /* No share sheet here (or it refused) — the image is still handed over. */
      saveBlob(blob,name+'.png'); toast('Image saved. Send it from your gallery.','info');
    } else {
      saveBlob(blob,name+'.png'); toast('Image saved','ok');
    }
  }catch(e){ console.error(e); toast('Could not make the bill. Please try again.','err'); }
  finally{ btn.innerHTML=orig; btn.style.opacity=''; _exporting=false; }
}

function saveProd(pid){
  const name=(document.getElementById('p_name').value||'').trim();
  const urdu=(document.getElementById('p_urdu').value||'').trim();
  const unit=document.getElementById('p_unit').value||'kg';
  const rate=money(num(document.getElementById('p_rate').value));
  const icon=document.getElementById('p_icon').value||'fa-box';
  const color=document.getElementById('p_color').value||'#8A3E23';
  if(!name){ toast('Item name is required','err'); return; }
  if(rate<=0){ toast('Enter a valid rate','err'); return; }
  const clash=products.some(p=>p.id!==pid&&p.name.toLowerCase()===name.toLowerCase());
  if(clash){ toast('An item with this name already exists','err'); return; }

  if(pid){
    const p=prodBy(pid); if(!p){ toast('Item not found','err'); return; }
    Object.assign(p,{name,urdu,unit,rate,icon,color});
  } else {
    products.push({id:newPid(),name,urdu,unit,rate,icon,color,builtin:false,active:true});

  persist(); closeSheet();
  toast(pid?'Item updated ✓':'Item added ✓','ok');

        <div><div class="k">Received</div><div class="v">${PKR(coll)}</div></div>

      </div>

            return `<div>

/* ── Udhaar reminders ──
   Who owes money and has gone longest without paying. Ordered by silence
   rather than amount, because a small balance untouched for two months is a
   worse sign than a large one paid down last week. */
let _remindDays=14;

function overdueList(minDays){
  return alive()
    .map(c=>{
      const b=balanceOf(c.id);
      const last=lastPayOf(c.id);
      /* Never paid — measure from the first entry so a new customer isn't
         instantly flagged as months overdue. */
      const from=last||txOf(c.id).sort(byOldest)[0]?.date||today();
      return {c, b, last, days:daysSince(from)??0};
    })
    .filter(x=>x.b>0&&x.days>=minDays)
    .sort((a,b)=>b.days-a.days||b.b-a.b);
}

/* ── v17: Excel export ──
   A CSV opens straight in Excel / Google Sheets. It starts with a UTF-8 BOM so
   Urdu names read correctly, and a text cell that begins with = + - @ is
   quoted with an apostrophe so a spreadsheet can never run it as a formula. */
function csvCell(v,isNum){
  if(isNum) return (v===''||v==null)?'':String(money(num(v)));
  let t=String(v??'');
  if(/^[=+\-@\t\r]/.test(t)) t="'"+t;
  return /[",\n\r]/.test(t)?'"'+t.replace(/"/g,'""')+'"':t;
}
function csvDownload(name,head,rows){
  const lines=[head.map(h=>csvCell(h)).join(',')].concat(rows.map(r=>r.map(c=>Array.isArray(c)?csvCell(c[0],true):csvCell(c)).join(',')));
  saveBlob(new Blob(['﻿'+lines.join('\r\n')],{type:'text/csv;charset=utf-8'}),name+'.csv');
}

/* ────────────────────────────────────────
   11. BACKUP / RESTORE
──────────────────────────────────────── */
/* Ask the browser to keep this app's storage durable (won't auto-evict). */
async function requestPersist(){
  try{
    if(navigator.storage&&navigator.storage.persist){
      const has=await navigator.storage.persisted();
      if(!has) await navigator.storage.persist();
    }
  }catch{}
}
function markBackup(){ try{ localStorage.setItem(KEYS.backup,new Date().toISOString()); }catch{} }
function lastBackupAt(){ try{ return localStorage.getItem(KEYS.backup); }catch{ return null; } }
function backupAgeDays(){
  const l=lastBackupAt(); if(!l) return null;
  const t=new Date(l).getTime(); if(isNaN(t)) return null;
  return Math.floor((Date.now()-t)/864e5);
}

/* ── Automatic daily snapshots ──
   These live in the same storage as the ledger, so they are NOT protection
   against the browser's data being cleared — only a downloaded backup file is.
   What they do cover is the damage done inside the app: a mistaken restore, a
   mass delete, a bad edit noticed a day later. */
const SNAP_KEEP = 7;

function loadSnaps(){ try{ const v=JSON.parse(localStorage.getItem(KEYS.snap)); return Array.isArray(v)?v:[]; }catch{ return []; } }

function autoSnapshot(){
  if(!customers.length&&!transactions.length) return;
  try{
    const snaps=loadSnaps();
    const day=today();
    /* One per day is enough history without crowding out the ledger itself. */
    if(snaps.some(s=>s.day===day)) return;
    snaps.push({day, at:new Date().toISOString(),
      counts:{customers:alive().length, transactions:transactions.filter(isLive).length},
      customers, transactions, products});
    while(snaps.length>SNAP_KEEP) snaps.shift();
    localStorage.setItem(KEYS.snap, JSON.stringify(snaps));
  }catch(e){
    /* Quota is the likely cause; drop the oldest and let the next boot retry. */
    try{ const s=loadSnaps(); s.shift(); localStorage.setItem(KEYS.snap,JSON.stringify(s)); }catch{}
    console.warn('[SNAPSHOT]',e);
  }
}

function restoreSnapshot(day){
  const s=loadSnaps().find(x=>x.day===day); if(!s) return;
  showConfirm(`
    <div style="text-align:center">
      <div style="width:56px;height:56px;border-radius:50%;background:var(--udhaarbg);display:grid;place-items:center;margin:0 auto 14px">
        <i class="fa-solid fa-clock-rotate-left" style="font-size:21px;color:var(--udhaar)"></i>
      </div>
      <h3 class="display" style="font-size:21px;font-weight:600;color:var(--ink)">Go back to ${fmtShort(s.day)}?</h3>
      <p style="color:var(--sub);font-size:13px;margin-top:7px">Everything on this device will be replaced with that day's snapshot —
        <b style="color:var(--ink)">${s.counts?.customers??'?'} customers</b>, <b style="color:var(--ink)">${s.counts?.transactions??'?'} entries</b>.</p>
      <p style="color:var(--udhaar);font-size:12.5px;margin-top:10px"><i class="fa-solid fa-triangle-exclamation" style="margin-right:5px"></i>Anything recorded after that date will be lost.</p>
      <div style="display:flex;gap:10px;margin-top:18px">
        <button class="btn btn-neutral grow" onclick="closeConfirm()">Cancel</button>
        <button class="btn btn-danger grow" onclick="_doSnapRestore('${s.day}')">Restore</button>
      </div>
    </div>`);
}
function _doSnapRestore(day){
  const s=loadSnaps().find(x=>x.day===day); if(!s) return;
  customers=Array.isArray(s.customers)?s.customers:[];
  transactions=Array.isArray(s.transactions)?s.transactions:[];
  /* A snapshot taken before the catalogue existed carries no products — the
     loader re-seeds the built-ins so the rates are never lost. */
  if(Array.isArray(s.products)&&s.products.length){ saveKey(KEYS.p,s.products); products=loadProducts(); }
  migrateData(); persist();
  closeConfirm(); closeSheet(); toast(`Restored to ${fmtShort(day)} ✓`,'ok'); nav('home');
}

function doBackup(){
  try{
    const payload={app:'RanaAhmadMilkShop',v:4,at:new Date().toISOString(),
      counts:{customers:customers.length,transactions:transactions.length,products:products.length},
      customers,transactions,products};
    const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});

  }catch(e){ console.error(e); toast('Backup failed — try again','err'); }
}
