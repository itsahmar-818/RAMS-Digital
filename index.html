/* ────────────────────────────────────────
   11b. PIN LOCK
   A screen lock, not encryption — the ledger on disk stays readable, so this
   stops someone picking up the phone, not someone determined. "Forgot PIN"
   therefore hands the data back rather than trapping the shop out of it.
──────────────────────────────────────── */
let _pinBuf='', _pinMode='unlock', _pinFirst='', _pinTries=0;

async function hashPin(pin){
  const raw='rams:'+pin;
  try{
    if(crypto?.subtle){
      const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(raw));
      return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('');
    }
  }catch{}
  /* file:// and other insecure contexts have no SubtleCrypto — fall back so
     the lock still works rather than silently failing open. */
  let h=5381; for(let i=0;i<raw.length;i++) h=((h<<5)+h+raw.charCodeAt(i))>>>0;
  return 'x'+h.toString(16);
}
const pinIsSet = ()=>{ try{ return !!localStorage.getItem(KEYS.pin); }catch{ return false; } };

function paintPin(){
  const dots=document.getElementById('lockDots');
  if(dots) dots.innerHTML=[0,1,2,3].map(i=>`<span class="pin-dot${i<_pinBuf.length?' on':''}"></span>`).join('');
  const pad=document.getElementById('lockPad');
  if(pad&&!pad.dataset.built){
    pad.dataset.built='1';
    const key=(label,fn)=>`<button class="pin-key tnum" onclick="${fn}">${label}</button>`;
    pad.innerHTML=[1,2,3,4,5,6,7,8,9].map(n=>key(n,`pinTap('${n}')`)).join('')
      + `<span></span>` + key(0,`pinTap('0')`)
      + `<button class="pin-key pk-plain" onclick="pinBack()" aria-label="Delete last digit"><i class="fa-solid fa-delete-left"></i></button>`;
  }
}

function pinTap(d){
  if(_pinBuf.length>=4) return;
  _pinBuf+=d; paintPin();
  if(_pinBuf.length===4) setTimeout(pinSubmit,120);
}
function pinBack(){ _pinBuf=_pinBuf.slice(0,-1); paintPin(); }

function pinSay(msg,bad){
  const m=document.getElementById('lockMsg');
  if(!m) return;
  m.textContent=msg;
  m.style.color=bad?'var(--udhaar)':'var(--sub)';
  if(bad){ const s=document.getElementById('lockDots'); if(s){ s.style.animation='none'; void s.offsetWidth; s.style.animation='shake .4s'; } }
}

async function pinSubmit(){
  const entered=_pinBuf; _pinBuf=''; paintPin();

  if(_pinMode==='unlock'){
    const h=await hashPin(entered);
    if(h===localStorage.getItem(KEYS.pin)){ _pinTries=0; closeLock(); return; }
    _pinTries++;
    pinSay(_pinTries>=3?`Wrong PIN (${_pinTries} tries) — use "Forgot PIN?"`:'Wrong PIN — try again',true);
    return;
  }
  if(_pinMode==='set'){
    _pinFirst=entered; _pinMode='confirm'; pinSay('Enter the same PIN again');
    return;
  }
  if(_pinMode==='confirm'){
    if(entered!==_pinFirst){ _pinMode='set'; _pinFirst=''; pinSay('PINs did not match — start again',true); return; }
    try{ localStorage.setItem(KEYS.pin, await hashPin(entered)); }
    catch{ toast('Could not save the PIN','err'); closeLock(); return; }
    _pinFirst=''; closeLock(); toast('PIN lock is on ✓','ok');
  }
}

function openLock(mode='unlock'){
  /* v18: the dialog layer is above the lock (so "Forgot PIN" can show), which
     let a "Delete" or "Restore" dialog left open stay tappable over the lock. */
  try{ closeConfirm(); closeMenu(); }catch{}
  _pinMode=mode; _pinBuf=''; _pinFirst=''; _pinTries=0;
  const scr=document.getElementById('lockScreen'); if(!scr) return;
  scr.hidden=false;
  document.getElementById('lockForgot').hidden = mode!=='unlock';
  paintPin();
  pinSay(mode==='unlock'?'Enter your 4-digit PIN':'Choose a new 4-digit PIN');
}
function closeLock(){
  const scr=document.getElementById('lockScreen'); if(scr) scr.hidden=true;
  _pinBuf=''; _pinMode='unlock';
}

/* Honest escape hatch: the ledger was never encrypted, so refusing entry
   forever would only cost the shop its data. Hand over a backup, then reset. */
function forgotPin(){
  showConfirm(`
    <div style="text-align:center">
      <div style="width:56px;height:56px;border-radius:50%;background:var(--goldbg);display:grid;place-items:center;margin:0 auto 14px">
        <i class="fa-solid fa-key" style="font-size:21px;color:var(--gold)"></i>
      </div>
      <h3 class="display" style="font-size:21px;font-weight:600;color:var(--ink)">Reset the PIN?</h3>
      <p style="color:var(--sub);font-size:13px;margin-top:8px">A backup file will be saved first, then the lock is removed and you can set a new PIN.</p>
      <p style="color:var(--sub);font-size:12.5px;margin-top:10px">This is a screen lock, not a password on the data — it keeps casual eyes out, nothing more.</p>
      <div style="display:flex;gap:10px;margin-top:18px">
        <button class="btn btn-neutral grow" onclick="closeConfirm()">Cancel</button>
        <button class="btn btn-filled grow" onclick="_doForgotPin()">Backup &amp; reset</button>
      </div>
    </div>`);

/* ── Force update ──
   Clears every cached response and re-registers the worker, then reloads.
   Deliberately never touches localStorage, which is where the khata lives. */
async function forceUpdate(){
  toast('Fetching the latest version…','info');
  try{
    if('serviceWorker' in navigator){
      const regs=await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(r=>r.unregister()));
    }
    if(window.caches){
      const keys=await caches.keys();
      await Promise.all(keys.map(k=>caches.delete(k)));
    }
  }catch(e){ console.warn('[UPDATE]',e); }
  /* A changed query string defeats any HTTP cache still holding the old HTML. */
  const url=location.origin+location.pathname+'?u='+Date.now();
  setTimeout(()=>location.replace(url),450);
}

function removePin(){

/* ────────────────────────────────────────
   11d. WHATSAPP BOT SYNC
   The khata lives only on this phone. For the customers who have a "bot
   hisaab" cycle switched on, a compact copy of their recent entries is sent
   to the shop's own n8n server, so the WhatsApp bot can answer "bill" and
   "baqaya" from the same figures this app shows. Nothing is sent anywhere
   until a sync code from the bot has been pasted in Settings, and the code is
   kept outside the backup file.
──────────────────────────────────────── */
const CYCLES = { week:'Hafta war (7 din)', '10':'10 din', '15':'15 din', month:'Mahana' };
/* Listed by hand: an object puts its number-like keys first, which would open the picker on "10 din". */
const CYCLE_ORDER = ['week','10','15','month'];
/* The bot knows a customer by the number they message from, always 03XXXXXXXXX. */
function botPhone(p){
  let d=String(p||'').replace(/\D/g,'');
  if(d.startsWith('0092')) d=d.slice(2);
  if(d.startsWith('92')&&d.length===12) d='0'+d.slice(2);
  if(d.length===10&&d.startsWith('3')) d='0'+d;
  return /^03\d{9}$/.test(d)?d:'';
}
const botCusts = ()=>alive().filter(c=>CYCLES[c.cycle]&&botPhone(c.phone));

function loadSync(){ try{ const v=JSON.parse(localStorage.getItem(KEYS.sync)); return v&&typeof v==='object'&&!Array.isArray(v)?v:{}; }catch{ return {}; } }
function saveSync(patch){ const v=Object.assign(loadSync(),patch); try{ localStorage.setItem(KEYS.sync,JSON.stringify(v)); }catch{} return v; }
const syncOn = ()=>{ const c=loadSync(); return !!(c.url&&c.key); };

/* The bot sends one line: https://…/webhook/rams-khata#<code>. The whole
   WhatsApp message can be pasted; only that line is picked out of it. */
function parseSyncCode(txt){
  const m=/(https?:\/\/[^\s#]+)#([A-Za-z0-9]{16,64})/.exec(String(txt||''));
  if(!m) return null;
  const local=/^http:\/\/(localhost|127\.0\.0\.1)(:\d+)?\//.test(m[1]);
  if(!m[1].startsWith('https://')&&!local) return null;
  return {url:m[1],key:m[2]};
}

/* Entries from the first day of the month before last travel in full; anything
   older is folded into one opening figure, so the balance the bot works out is
   the balance shown here while the upload stays small. */
function syncWindowStart(){
  const d=parseD(today())||new Date();
  return new Date(d.getFullYear(),d.getMonth()-2,1).toLocaleDateString('en-CA');
}
function buildSyncPayload(key){
  const from=syncWindowStart(), it={};
  const list=botCusts(), count={};
  list.forEach(c=>{ const p=botPhone(c.phone); count[p]=(count[p]||0)+1; });
  /* One number on two accounts could hand one family another's hisaab, so
     such a pair is held back until the number is fixed. */
  const dups=list.filter(c=>count[botPhone(c.phone)]>1).map(c=>({n:c.name,p:botPhone(c.phone),why:'ye number do customers pe hai'}));
  const safePid=x=>{ const s=String(x||'').replace(/[^\w-]/g,'_').slice(0,40); return (!s||s==='__proto__'||s==='constructor'||s==='prototype')?'item':s; };
  const c=list.filter(cu=>count[botPhone(cu.phone)]===1).map(cu=>{
    let o=0; const e=[];
    txOf(cu.id).slice().sort(byOldest).forEach(t=>{
      const dv=money(num(t.delta));
      const d=(/^\d{4}-\d{2}-\d{2}$/.test(t.date||'')&&parseD(t.date))?t.date:'';
      /* An opening balance is what was owed before the khata began, whatever
         day it was typed in — it belongs with the previous balance. */
      if(!d||d<from||t.type==='opening'){ o=money(o+dv); return; }
      if(isSale(t)){
        const p=prodOf(t), pid=safePid(pidOf(t)), amt=money(num(t.amount));
        it[pid]=[String(p.name||pid),String(p.urdu||''),String(p.unit||'')];
        const row=[d,'s',pid,num(t.qty),String(unitOf(t)||''),money(num(t.rate)),amt];
        if(dv!==amt) row.push(dv);
        e.push(row);
      } else if(t.type==='pay'){
        const amt=money(num(t.amount)), row=[d,'p',amt,String(t.method||'')];
        if(dv!==money(-amt)) row.push(dv);
        e.push(row);
      } else e.push([d,'a',dv,String(t.note||t.type||'')]);
    });
    return {p:botPhone(cu.phone),n:String(cu.name||''),y:String(cu.cycle),o,b:balanceOf(cu.id),e};
  });
  const rev='r-'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
  return {payload:{k:key,v:1,app:APP_BUILD,rev,from,it,c},dups};
}

let _syncBusy=false, _syncTimer=null, _syncVerifyT=null, _syncGen=0, _syncRounds=0;

/* text/plain keeps this a "simple" request, so the browser sends it straight
   to n8n without a separate permission round-trip first. */
async function syncPost(cfg,body){
  const ctl=new AbortController(); const tm=setTimeout(()=>ctl.abort(),25000);
  try{
    const r=await fetch(cfg.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=UTF-8'},
      body:JSON.stringify(body),signal:ctl.signal,cache:'no-store',credentials:'omit'});
    let j=null; try{ j=await r.json(); }catch{}
    if(!j||typeof j!=='object'||Array.isArray(j)) return {ok:false,code:'http',
      msg:r.status===404?'Bot ka pata nahi mila. n8n mein workflow Published hai?':`Server ne ajeeb jawab diya (${r.status})`};
    return j;
  }catch(e){
    return {ok:false,code:'net',msg:navigator.onLine?'Bot ke server tak nahi pahunch saka. PC aur n8n chal rahe hain?':'Internet nahi hai'};
  }finally{ clearTimeout(tm); }
}

async function doSync(manual){
  const cfg=loadSync();
  if(!cfg.url||!cfg.key){ if(manual) openSyncCode(); return false; }
  if(_syncBusy){ if(manual) toast('Sync chal raha hai…','info'); return false; }
  _syncBusy=true;
  const gen=_syncGen;
  try{
    if(manual) toast('Bot ko khata bhej raha hoon…','info');
    const {payload,dups}=buildSyncPayload(cfg.key);
    const res=await syncPost(cfg,payload);
    const now=new Date().toISOString();
    if(res&&res.ok){
      const skipped=(Array.isArray(res.skipped)?res.skipped:[]).concat(dups).slice(0,30);
      /* An entry saved while this upload was in the air is not in it — keep
         the khata marked as changed so it goes up on the next pass. */
      saveSync({lastOk:now,lastTry:now,lastMsg:'',lastN:num(res.saved),lastRev:payload.rev,skipped,dirty:gen!==_syncGen});
      if(gen!==_syncGen) syncSoon(); else scheduleVerify();
      if(manual) toast(skipped.length?`${num(res.saved)} bot pe, ${skipped.length} reh gaye — Settings dekhein`:`${num(res.saved)} customer${num(res.saved)===1?'':'s'} ka khata bot pe aa gaya ✓`,skipped.length?'warn':'ok');
    } else {
      saveSync({lastTry:now,lastMsg:String((res&&res.msg)||'Sync nahi ho saka').slice(0,160),dirty:true});
      if(manual) toast(String((res&&res.msg)||'Sync nahi ho saka'),'err');
      /* The shop PC may simply be off — try again by itself in a few minutes
         while the app stays open. A wrong code is not retried; it needs fixing. */
      if(res&&(res.code==='net'||res.code==='http')){
        clearTimeout(_syncTimer);
        _syncTimer=setTimeout(()=>{ if(navigator.onLine&&loadSync().dirty) doSync(false); },5*60*1000);
      }
    }
    refreshSyncUI();
    return !!(res&&res.ok);
  } finally { _syncBusy=false; }
}

/* Called after every save. Waits a few seconds so a burst of entries (a whole
   Daily Round) goes up once, not once per row. */
function syncSoon(){
  const cfg=loadSync(); if(!cfg.url||!cfg.key) return;
  _syncGen++; _syncRounds=0;
  if(!cfg.dirty) saveSync({dirty:true});
  clearTimeout(_syncTimer);
  _syncTimer=setTimeout(()=>{ if(navigator.onLine) doSync(false); },6000);
}

/* n8n keeps the khata next to the bot's other memory, and a chat finishing at
   the same moment can write an older copy back over it. So a little later the
   app asks the bot which upload it is holding, and sends again if it is not
   the latest one. */
function scheduleVerify(){ clearTimeout(_syncVerifyT); _syncVerifyT=setTimeout(verifySync,45000); }
async function verifySync(){
  const cfg=loadSync();
  if(!cfg.url||!cfg.key||!cfg.lastRev||!navigator.onLine||_syncBusy) return;
  const r=await syncPost(cfg,{k:cfg.key,check:1});
  if(r&&r.ok&&String(r.ver||'')!==String(cfg.botVer||'')) saveSync({botVer:String(r.ver||'')});
  if(r&&r.ok&&r.rev!==cfg.lastRev&&_syncRounds<3){ _syncRounds++; doSync(false); }
  else if(r&&!r.ok&&(r.code==='key'||r.code==='nokey')){ saveSync({lastMsg:String(r.msg||'Sync code ab nahi chal raha'),dirty:true}); refreshSyncUI(); }
}

/* On launch, and whenever the app comes back to the front after a while. */
function bootSync(){
  const cfg=loadSync(); if(!cfg.url||!cfg.key||!navigator.onLine) return;
  const last=cfg.lastOk?new Date(cfg.lastOk).getTime():0;
  const stale=!last||Date.now()-last>3*3600*1000||new Date(last).toLocaleDateString('en-CA')!==today();
  if(cfg.dirty||stale) doSync(false); else verifySync();
}
window.addEventListener('online',()=>{ if(loadSync().dirty) setTimeout(()=>doSync(false),1500); });
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible') setTimeout(bootSync,1200); });

async function saveSyncCode(){
  const cfg=parseSyncCode(document.getElementById('sync_code')?.value);
  if(!cfg){ toast('Ye code sahi nahi lag raha. Bot wala poora message paste karein.','err'); return; }

function syncOff(){

  try{ localStorage.removeItem(KEYS.sync); }catch{}
  refreshSyncUI();
  toast('Bot sync band. Jo khata bot pe hai use hatane ke liye bot ko likhein: KHATA HATAO','warn');
}

/* ────────────────────────────────────────
   11b-2. BILL PHOTOS FOR THE BOT (v16)
   The very bill image the shop shares is also handed to the bot, so a
   customer who types "bill" on WhatsApp gets this same picture — and only
   ever the one made for their own number.
──────────────────────────────────────── */
const pngAuto = ()=>loadSync().autoPng!==false;
const botBillOk = c=>syncOn()&&!!botPhone(c&&c.phone);
let _pngSent=[], _pngVerT=null, _pngRounds=0, _pngBulk=null;

/* A bill photo is bigger than the khata, so it gets more time on slow data. */
async function pngPost(cfg,body,ms){
  const ctl=new AbortController(); const tm=setTimeout(()=>ctl.abort(),ms||90000);
  try{
    const r=await fetch(cfg.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=UTF-8'},
      body:JSON.stringify(body),signal:ctl.signal,cache:'no-store',credentials:'omit'});
    let j=null; try{ j=await r.json(); }catch{}
    if(!j||typeof j!=='object'||Array.isArray(j)) return {ok:false,code:'http',
      msg:r.status===404?'Bot ka pata nahi mila. n8n mein workflow Published hai?':r.status===413?'Bill ki photo server ke liye bohat bari hai':`Server ne ajeeb jawab diya (${r.status})`};
    return j;
  }catch(e){
    return {ok:false,code:'net',msg:navigator.onLine?'Bot ke server tak nahi pahunch saka. PC aur n8n chal rahe hain?':'Internet nahi hai'};
  }finally{ clearTimeout(tm); }
}

/* WhatsApp takes images up to 5 MB. A copy about 1100px wide is still sharp
   on any phone and goes up quickly on mobile data. */
async function botBlob(canvas){
  const shrink=(src,w)=>{ const c2=document.createElement('canvas'); c2.width=w; c2.height=Math.max(1,Math.round(src.height*w/src.width));
    const g=c2.getContext('2d'); g.fillStyle='#fff'; g.fillRect(0,0,c2.width,c2.height);
    g.imageSmoothingEnabled=true; g.imageSmoothingQuality='high'; g.drawImage(src,0,0,c2.width,c2.height); return c2; };
  let cv=canvas.width>1100?shrink(canvas,1100):canvas;
  let blob=await new Promise(r=>cv.toBlob(r,'image/png'));
  for(let i=0;i<4&&blob&&blob.size>3.6e6&&cv.width>480;i++){ cv=shrink(cv,Math.round(cv.width*.8)); blob=await new Promise(r=>cv.toBlob(r,'image/png')); }
  return blob;
}
const blobB64=b=>new Promise((res,rej)=>{ const fr=new FileReader(); fr.onload=()=>res(String(fr.result).replace(/^data:[^,]*,/,'')); fr.onerror=()=>rej(fr.error); fr.readAsDataURL(b); });
const rScopeNow=()=>({s:_rscope,m:_rmonth,f:_rfrom,t:_rto});

/* Builds one customer's bill for a given period without touching what the
   receipt screen is showing: the period is swapped in only while the HTML is
   written, which happens in one go. */
async function renderBillFor(cid,sc){
  const keep={s:_rscope,m:_rmonth,f:_rfrom,t:_rto};
  let d,html;
  try{ _rscope=sc.s; _rmonth=sc.m; _rfrom=sc.f; _rto=sc.t; d=receiptData(cid); html=d?buildReceiptHTML(cid):''; }
  finally{ _rscope=keep.s; _rmonth=keep.m; _rfrom=keep.f; _rto=keep.t; }
  if(!d||!html) throw new Error('no bill');
  return {d,canvas:await renderForExport(html)};
}

async function botSendBill(c,d,canvas,sc){
  const cfg=loadSync(), p=botPhone(c&&c.phone);
  if(!cfg.url||!cfg.key) return {ok:false,code:'nosync',msg:'Pehle bot sync on karein: Settings > WhatsApp bot sync.'};
  if(!p) return {ok:false,code:'phone',msg:'Is customer ka mobile number 03XXXXXXXXX nahi hai.'};
  const blob=await botBlob(canvas);
  if(!blob) return {ok:false,code:'img',msg:'Photo nahi ban saki'};
  if(blob.size>4.8e6) return {ok:false,code:'big',msg:'Ye bill bohat lamba hai. Mahine ka bill bana kar bhejein.'};
  const res=await pngPost(cfg,{k:cfg.key,png:1,v:1,p,n:String(c.name||''),a:d.from,b:d.to,t:d.title,kd:d.kind,tot:d.closing,no:d.no,img:await blobB64(blob)});
  if(res&&res.ok){
    _pngSent=_pngSent.filter(x=>!(x.p===p&&x.a===d.from&&x.b===d.to));
    _pngSent.push({cid:c.id,p,a:d.from,b:d.to,at:res.at,sc:sc||rScopeNow()});
    saveSync({pngLast:new Date().toISOString(),pngMsg:'',pngSrv:true});
    schedulePngVerify();
  } else {
    if(res&&res.code==='shape'&&!/number|tareekh|PNG/i.test(String(res.msg||''))){ res.msg='Bot ka workflow purana hai — n8n mein RAMS Bot v3.4 lagayein.'; saveSync({pngSrv:false}); }
    saveSync({pngMsg:String((res&&res.msg)||'Bill bot pe nahi gaya').slice(0,160)});
  }
  refreshSyncUI();
  return res||{ok:false,msg:'Bill bot pe nahi gaya'};
}

/* Same idea as the khata check: a chat finishing at the same moment can write
   an older copy of the bot's memory back, so a little later the app asks
   which bills the bot is holding and sends again any that went missing. */
function schedulePngVerify(){ clearTimeout(_pngVerT); _pngVerT=setTimeout(verifyPng,45000); }
async function verifyPng(){
  const cfg=loadSync();
  if(!cfg.url||!cfg.key||!_pngSent.length||!navigator.onLine) return;
  if(_pngBulk||_exporting){ schedulePngVerify(); return; }
  const r=await pngPost(cfg,{k:cfg.key,pngcheck:1},25000);
  if(!r||!r.ok||!r.have||typeof r.have!=='object') return;
  const miss=_pngSent.filter(x=>!(Array.isArray(r.have[x.p])&&r.have[x.p].includes(x.a+'|'+x.b+'|'+x.at)));
  _pngSent=[];
  if(!miss.length||_pngRounds>=2){ _pngRounds=0; return; }
  _pngRounds++;
  for(const x of miss){ const c=custBy(x.cid); if(!c) continue;
    try{ const {d,canvas}=await renderBillFor(x.cid,x.sc); await botSendBill(c,d,canvas,x.sc); }catch(e){ console.warn('[PNG]',e); } }
}

/* The period a customer's bill covers when all bills go up together:
   their own cycle ending today; monthly customers get this month, or last
   month during the first five days. */
function bulkScope(c){
  const t=today(), d=parseD(t)||new Date();
  const n={week:7,'10':10,'15':15}[c.cycle];
  if(n) return {s:'range',m:mkKey(),f:ymd(new Date(d.getFullYear(),d.getMonth(),d.getDate()-(n-1))),t};
  const m=d.getDate()<=5?mkKey(ymd(new Date(d.getFullYear(),d.getMonth()-1,1))):mkKey();
  return {s:'month',m,f:m+'-01',t};
}
async function pngBulk(){
  const cfg=loadSync(); if(!cfg.url||!cfg.key){ openSyncCode(); return; }
  if(_pngBulk||_exporting){ toast('Pehla kaam chal raha hai…','info'); return; }
  const list=botCusts();
  if(!list.length){ toast('Kisi customer pe bot hisaab on nahi. Customer → Edit → "WhatsApp bot hisaab" mein dor chunein.','warn'); return; }
  const job=_pngBulk={stop:false,done:0,fail:[]};
  showConfirm(`
    <div style="text-align:center">
      <h3 class="display" style="font-size:21px;font-weight:600;color:var(--ink)">Bills bot pe ja rahe hain</h3>
      <p id="pngProg" style="color:var(--sub);font-size:13.5px;margin-top:10px;line-height:1.5">Shuru…</p>
      <p style="color:var(--sub);font-size:12px;margin-top:6px">App khuli rakhein. Har customer ka bill us ke apne dor ka banta hai.</p>
      <button class="btn btn-neutral block" style="margin-top:16px" onclick="pngBulkStop()">Rok dein</button>
    </div>`);
  const prog=t=>{ const el=document.getElementById('pngProg'); if(el) el.textContent=t; };
  _exporting=true;
  try{
    for(let i=0;i<list.length;i++){
      if(job.stop) break;
      const c=list[i]; prog(`${i+1} / ${list.length}: ${c.name}`);
      try{
        const sc=bulkScope(c);
        const {d,canvas}=await renderBillFor(c.id,sc);
        const r=await botSendBill(c,d,canvas,sc);
        if(r&&r.ok) job.done++;
        else { job.fail.push(`${c.name}: ${(r&&r.msg)||'nahi gaya'}`);
          /* These will not get better on the next customer — stop and say why. */
          if(r&&(['net','http','key','nokey','disk'].includes(r.code)||(r.code==='shape'&&/v3\.\d/.test(String(r.msg))))){ job.why=r.msg; break; } }
      }catch(e){ job.fail.push(`${c.name}: bill nahi bana`); }
    }
  } finally {
    _exporting=false; _pngBulk=null; closeConfirm(); refreshSyncUI();
    if(job.why) toast(`${job.done} gaye, phir ruk gaya: ${job.why}`,'err');
    else if(job.fail.length) toast(`${job.done} bill bot pe gaye, ${job.fail.length} reh gaye — ${job.fail[0]}`,'warn');
    else toast(job.stop?`${job.done} bill bot pe gaye (roka gaya)`:`${job.done} bill bot pe chale gaye ✓`,job.stop?'info':'ok');
  }
}
function pngBulkStop(){ if(_pngBulk) _pngBulk.stop=true; const el=document.getElementById('pngProg'); if(el) el.textContent='Rok raha hoon…'; }
function togglePngAuto(){ saveSync({autoPng:!pngAuto()}); refreshSyncUI(); toast(pngAuto()?'Ab har bill banate hi bot pe bhi jayega':'Bill ab sirf "Bot" dabane pe bot pe jayega','info'); }

/* ── Toast ── */
function toast(msg,kind='info',action){
  const clr={ok:'var(--snack-ok)',err:'var(--snack-err)',info:'var(--inverse-primary)',warn:'var(--snack-warn)'}[kind]||'var(--inverse-primary)';
  const ic={ok:'fa-circle-check',err:'fa-circle-exclamation',info:'fa-circle-info',warn:'fa-triangle-exclamation'}[kind]||'fa-circle-info';
  const t=document.createElement('div');
  t.className='snack';
  t.setAttribute('role','status');
  t.innerHTML=`<i class="fa-solid ${ic}" style="font-size:17px;flex-shrink:0;color:${clr}"></i><span></span>`;
  t.querySelector('span').textContent=String(msg).replace(/\s*✓/g,'');

  let gone=false;
  const dismiss=()=>{ if(gone) return; gone=true;
    t.style.transition='opacity .2s,transform .2s'; t.style.opacity='0'; t.style.transform='translateY(8px)';
    setTimeout(()=>t.remove(),220); };

  /* Optional inline action (e.g. Undo a delete) — kept short-lived so it can
     never fire against a ledger the user has since moved on from. */
  if(action&&typeof action.fn==='function'){
    const b=document.createElement('button');
    b.textContent=action.label||'Undo';
    b.onclick=()=>{ dismiss(); action.fn(); };
    t.appendChild(b);
  }

  const box=document.getElementById('toastBox');
  /* Android shows one snackbar at a time — a newer message replaces the old. */
  while(box.children.length>1) box.firstChild.remove();
  box.appendChild(t);
  setTimeout(dismiss, action?4800:2400);
}

        const nw=reg.installing; if(!nw) return;
        nw.addEventListener('statechange',()=>{
          if(nw.state==='installed'&&navigator.serviceWorker.controller){
            nw.postMessage('SKIP_WAITING'); // activate the fresh version
          }
        });
      });
    }).catch(console.warn);
  });
}

/* ── Overflow menu ── */
function openMenu(){ document.getElementById('menuRoot').hidden=false; }
function closeMenu(){ const m=document.getElementById('menuRoot'); if(m) m.hidden=true; }

/* ── Touch ripple ──
   Every button answers the finger from the point it was touched. */
document.addEventListener('pointerdown',e=>{
  const t=e.target.closest('button,.tap,.menu-item');
  if(!t||t.disabled||t.classList.contains('nav-btn')) return;
  const r=t.getBoundingClientRect();
  const d=Math.max(r.width,r.height)*2.4;
  const s=document.createElement('span');
  s.className='rpl';
  s.style.cssText=`width:${d}px;height:${d}px;left:${e.clientX-r.left-d/2}px;top:${e.clientY-r.top-d/2}px`;
  t.appendChild(s);
  setTimeout(()=>s.remove(),520);
},{passive:true});

/* ── App bar lifts once the page under it has scrolled ── */
document.querySelectorAll('[data-screen]').forEach(s=>s.addEventListener('scroll',()=>{
  if(!s.hidden) document.getElementById('topBar').dataset.lifted=s.scrollTop>4;
},{passive:true}));

/* ── Phone back button ──
   Closes whatever is open (menu, dialog, sheet, receipt), then steps back to
   Home, and only then leaves the app — the way an installed app behaves. */
function handleBack(){
  const open=id=>{ const n=document.getElementById(id); return n&&!n.hidden; };
  if(open('menuRoot')){ closeMenu(); return true; }
  if(open('confirmRoot')){ closeConfirm(); return true; }
  if(open('lockScreen')){
    if(_pinMode==='unlock') return false;      // never a way around the lock
    closeLock(); return true;
  }
  if(!document.getElementById('receiptModal').classList.contains('hidden')){ closeReceiptModal(); return true; }
  if(open('sheetRoot')){ closeSheet(); return true; }
  if(cur==='profile'){ goBack(); return true; }
  if(cur!=='home'){ nav('home'); return true; }
  return false;
}
try{
  history.replaceState({rams:'root'},'');
  history.pushState({rams:'app'},'');
  window.addEventListener('popstate',()=>{
    if(handleBack()) history.pushState({rams:'app'},'');
    else history.back();
  });
}catch(e){ console.warn('[BACK]',e); }

/* ── v17: lock again when the app comes back after 5+ minutes away ──
   The PIN used to be asked only at launch, so a phone left unlocked on the
   counter kept the khata open all day. Not while a bill is being made or
   shared — the share sheet itself sends the app to the background. */
let _hiddenAt=0;
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='hidden'){ _hiddenAt=Date.now(); return; }
  const away=_hiddenAt?Date.now()-_hiddenAt:0; _hiddenAt=0;
  try{
    const scr=document.getElementById('lockScreen');
    if(away>5*60*1000&&pinIsSet()&&scr&&scr.hidden&&!_exporting&&!_pngBulk) openLock('unlock');
  }catch(e){ console.warn('[LOCK]',e); }
});

/* ── BOOT ── */
(function boot(){
  const lg=document.getElementById('brandLogo'); if(lg) lg.src=LOGO;
  const ll=document.getElementById('lockLogo'); if(ll) ll.src=LOGO;
  requestPersist();
  const repaired=migrateData();
  if(_healedText){ persist(); _healedText=false; }
  /* Snapshot the state we booted with, before any of today's edits. */
  autoSnapshot();
  if(pinIsSet()) openLock('unlock');
  nav('home');
  if(repaired) setTimeout(()=>toast('Ledger balances recalculated ✓','ok'),900);
  backupNudge();
  setTimeout(()=>{ try{ bootSync(); }catch(e){ console.warn('[SYNC]',e); } },4000);
  setTimeout(warmLibs,3500);
})();
