<style>
/* ══════════════════════════════════════════════════════════════════
   RAMS KHATA — Organic design system
   Same tokens, type and shapes as RAMS Electric so both apps read as
   one family: cream paper, terracotta + sage, set in iPhone type (v19).
   Old token names (--surface2, --udhaar, --gold …) are kept as aliases
   so every screen picks the look up without its logic being touched.
══════════════════════════════════════════════════════════════════ */
/* v19 — iPhone type. On an iPhone the app is set in Apple's own San
   Francisco (-apple-system). Apple's licence does not allow SF to be shipped
   to Android phones, so there the app uses Inter: the open font drawn after
   SF, with SF's large "Display" cut built in. It sits in this folder, so it
   works offline and costs one small file instead of three. */
@font-face{
  font-family:'RAMS SF';
  src:url('inter.woff2') format('woff2');
  font-weight:100 900;font-style:normal;font-display:swap;
}
:root{
  --c-bg:#f5ead8;
  --c-surface:#ebddc5;
  --c-text:#201e1d;
  --c-accent:#c67139;
  --c-accent-2:#7a8a5e;
  --c-divider:color-mix(in srgb,#201e1d 16%,transparent);
  --c-hair:color-mix(in srgb,#201e1d 8%,transparent);

  --n-100:#f9f4ed; --n-200:#eee7db; --n-300:#dcd3c4;
  --n-400:#c0b6a5; --n-500:#a19786; --n-600:#82796a;
  --n-700:#645c50; --n-800:#474238; --n-900:#2e2b25;

  --a-100:#fff2eb; --a-200:#ffe1d0; --a-300:#ffc6a5;
  --a-400:#f6a06b; --a-500:#d67f48; --a-600:#b2622d;
  --a-700:#8c491a; --a-800:#643312; --a-900:#402310;

  --b-100:#f0fae1; --b-200:#e1eecc; --b-300:#ccdbb2;
  --b-400:#aebf92; --b-500:#8fa073; --b-600:#728157;
  --b-700:#56633f; --b-800:#3d472b; --b-900:#272e1b;

  --c-alert:#b8402a; --c-alert-100:#ffe3db; --c-alert-700:#8a2a17;

  --font-sf:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","RAMS SF","Helvetica Neue",system-ui,"Segoe UI",Roboto,sans-serif;
  --font-heading:var(--font-sf);
  --font-body:var(--font-sf);

  --space-1:4.4px; --space-2:8.8px; --space-3:13.2px;
  --space-4:17.6px; --space-6:26.4px; --space-8:35.2px;
  --radius-sm:8px; --radius-md:16px; --radius-lg:28px;
  --r-card:32px;

  --shadow-sm:0 1px 2px color-mix(in srgb,#2e2b25 14%,transparent);
  --shadow:0 3px 10px color-mix(in srgb,#2e2b25 16%,transparent);
  --shadow-lg:0 12px 32px color-mix(in srgb,#2e2b25 22%,transparent);

  --tab-h:62px;
  --bar-h:calc(var(--tab-h) + 12px);   /* room the floating tab bar takes */
  --sat:env(safe-area-inset-top,0px);
  --sab:env(safe-area-inset-bottom,0px);
  --ease:cubic-bezier(.22,1,.36,1);
  --spring:cubic-bezier(.34,1.56,.64,1);

  /* ── names the screens ask for ── */
  --bg:#eadcc4;
  --page:var(--c-bg);
  --surface:var(--c-surface);
  --surface2:var(--c-bg);
  --surface3:var(--n-300);
  --border:var(--c-hair);
  --border2:var(--c-divider);
  --ink:var(--c-text);
  --ink2:var(--n-800);
  --sub:var(--n-700);

  --primary:var(--c-accent);
  --on-primary:var(--c-bg);
  --primary-c:var(--a-100);
  --on-primary-c:var(--a-800);

  --gold:var(--a-700);
  --gold2:var(--a-400);
  --goldbg:var(--a-100);

  --udhaar:var(--c-alert);
  --udhaarbg:var(--c-alert-100);
  --udhaar-fill:var(--c-alert);
  --on-udhaar-fill:var(--c-bg);
  --jama:var(--b-700);
  --jamabg:var(--b-100);
  --jama-fill:var(--b-600);
  --on-jama-fill:var(--c-bg);

  --inverse:var(--n-900);
  --inverse-ink:var(--n-100);
  --inverse-primary:var(--a-400);
  --snack-ok:var(--b-400);
  --snack-err:#ff9e86;
  --snack-warn:var(--a-400);
  --scrim:rgba(46,43,37,.5);

  --r:var(--r-card);
  --r-sm:var(--radius-md);
  --navy:var(--inverse);
  --navymid:var(--surface);
  --rust:var(--udhaar);
  --brand-grad:linear-gradient(140deg,var(--a-400),var(--a-700));
  --gold-grad:linear-gradient(140deg,var(--a-400),var(--a-700));
}
[data-theme="dark"]{
  --c-bg:#191614;
  --c-surface:#241f1c;
  --c-text:#f4ebdd;
  --c-divider:color-mix(in srgb,#f4ebdd 18%,transparent);
  --c-hair:color-mix(in srgb,#f4ebdd 9%,transparent);

  --n-100:#211d1a; --n-200:#2b2622; --n-300:#3b342d;
  --n-400:#544c42; --n-500:#7d7365; --n-600:#a89c8a;
  --n-700:#c8bcaa; --n-800:#e0d5c3; --n-900:#f4ebdd;

  --c-accent:#d9834b;
  --a-100:#33231a; --a-200:#432d20; --a-300:#5c3d29;
  --a-400:#8a5a33; --a-500:#b5743f; --a-600:#d0894f;
  --a-700:#eba86f; --a-800:#f6c79b; --a-900:#fde3c8;

  --c-accent-2:#8fa073;
  --b-100:#22271b; --b-200:#2e3524; --b-300:#3f4931;
  --b-400:#5b6a45; --b-500:#788a5c; --b-600:#93a678;
  --b-700:#b3c496; --b-800:#cfdcb6; --b-900:#e6efd6;

  --c-alert:#e8674a; --c-alert-100:#3a1d16; --c-alert-700:#ff9e86;

  --shadow-sm:0 1px 2px rgba(0,0,0,.5);
  --shadow:0 3px 10px rgba(0,0,0,.55);
  --shadow-lg:0 12px 32px rgba(0,0,0,.62);

  --bg:#0f0d0b;
  --snack-err:#b8402a;
  --scrim:rgba(0,0,0,.62);
  --brand-grad:linear-gradient(140deg,var(--a-600),var(--a-400));
  --gold-grad:linear-gradient(140deg,var(--a-600),var(--a-400));
}

*,*::before,*::after{-webkit-tap-highlight-color:transparent;box-sizing:border-box}
*{margin:0;padding:0}
html,body{height:100%;overscroll-behavior:none}
html{background:var(--bg);font-synthesis:none}
body{
  background:var(--bg);color:var(--ink);
  font-family:var(--font-body);font-size:15px;line-height:1.45;font-weight:400;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility;
}
button,input,select,textarea{font:inherit;color:inherit}
button{border:none;background:none;cursor:pointer;position:relative;overflow:hidden;
  -webkit-user-select:none;user-select:none}
b,strong{font-weight:700}
h1,h2,h3,h4,.display{font-family:var(--font-heading);font-weight:400;line-height:1.12;letter-spacing:-.015em}
:focus{outline:none}
:focus-visible{outline:2px solid var(--c-accent);outline-offset:2px}
::selection{background:color-mix(in srgb,var(--c-accent) 30%,transparent)}
/* while the theme flips, colours glide instead of snapping */
html.theming *,html.theming *::before,html.theming *::after{
  transition:background-color .4s ease,color .4s ease,border-color .4s ease,fill .4s ease,stroke .4s ease!important}

/* ── App shell ── */
#app{
  max-width:480px;margin:0 auto;height:100dvh;
  background:var(--page);display:flex;flex-direction:column;
  position:relative;overflow:hidden;
}
#app::before{content:'';position:absolute;top:-90px;right:-70px;width:260px;height:260px;border-radius:50%;
  background:color-mix(in srgb,var(--c-accent) 13%,transparent);pointer-events:none;z-index:0}
#app::after{content:'';position:absolute;top:130px;left:-95px;width:190px;height:190px;border-radius:50%;
  background:color-mix(in srgb,var(--c-accent-2) 14%,transparent);pointer-events:none;z-index:0}
#app>main{z-index:1}
.scroll{overflow-y:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
/* room for the tab bar, which floats over the end of every screen */
[data-screen]::after{content:'';display:block;height:calc(var(--bar-h) + var(--sab) + 18px)}
main::before{content:'';position:absolute;top:0;left:0;right:0;height:16px;z-index:3;pointer-events:none;
  background:linear-gradient(to bottom,var(--page),transparent);opacity:0;transition:opacity .25s}
#topBar[data-lifted="true"]+main::before{opacity:1}

/* ── Type helpers ── */
.mono,.tnum{font-variant-numeric:tabular-nums;font-feature-settings:'tnum' 1}
.eyebrow{font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--n-600);font-weight:700;
  margin:var(--space-6) var(--space-2) var(--space-2);
  display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.eyebrow.first{margin-top:var(--space-2)}
.eyebrow span{letter-spacing:.04em;text-transform:none;font-weight:600;font-size:11px}

/* ── Motion ── */
@keyframes pin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes rise{from{opacity:0;transform:translateY(18px) scale(.985)}to{opacity:1;transform:none}}
@keyframes slideX{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:none}}
@keyframes slideXBack{from{opacity:0;transform:translateX(-28px)}to{opacity:1;transform:none}}
@keyframes sheetUp{from{transform:translateY(102%)}to{transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes popIn{from{opacity:0;transform:scale(.88)}to{opacity:1;transform:scale(1)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
@keyframes ripple{from{transform:scale(0);opacity:.2}60%{opacity:.12}to{transform:scale(1);opacity:0}}
@keyframes snackIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes floatBlob{0%,100%{transform:translate(0,0)}50%{transform:translate(-10px,12px)}}

.scr-fade{animation:pin .32s var(--ease) both}
.scr-fwd{animation:slideX .34s var(--ease) both}
.scr-back{animation:slideXBack .34s var(--ease) both}
/* One orchestrated entrance per navigation: the sections of a screen rise
   in order. Re-renders after a save do not replay it. */
.enter>div>*{animation:rise .55s var(--ease) both}
.enter>div>*:nth-child(1){animation-delay:.02s}
.enter>div>*:nth-child(2){animation-delay:.07s}
.enter>div>*:nth-child(3){animation-delay:.12s}
.enter>div>*:nth-child(4){animation-delay:.17s}
.enter>div>*:nth-child(5){animation-delay:.22s}
.enter>div>*:nth-child(6){animation-delay:.27s}
.enter>div>*:nth-child(7){animation-delay:.32s}
.enter>div>*:nth-child(n+8){animation-delay:.37s}
.a-up,.a-right{animation:none}
.a-sheet{animation:sheetUp .4s var(--ease) both}
.a-fade{animation:fadeIn .2s ease both}
.a-pop{animation:popIn .32s var(--spring) both}
#app::before,#app::after{animation:floatBlob 16s ease-in-out infinite}
#app::after{animation-duration:21s;animation-direction:reverse}

.rpl{position:absolute;border-radius:50%;background:currentColor;pointer-events:none;
  animation:ripple .55s ease-out forwards}

/* ── App bar ── */
#topBar{flex-shrink:0;position:relative;z-index:5;padding-top:var(--sat)}
.tb-row{min-height:68px;display:flex;align-items:center;gap:var(--space-3);
  padding:var(--space-3) var(--space-3) var(--space-2) var(--space-4)}
#topBar[data-scr="profile"] .tb-row{padding-left:var(--space-2);gap:var(--space-2)}
.mark{width:40px;height:40px;border-radius:999px;flex:none;padding:0;display:grid;place-items:center;
  background:var(--brand-grad);box-shadow:var(--shadow-sm);transition:transform .2s var(--spring)}
.mark:active{transform:scale(.9)}
.mark img,.brand-logo{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block;background:#fff}
.tb-titles{flex:1;min-width:0}
#topTitle{font-size:19px;line-height:1.1;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#topSub{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--n-600);font-weight:600;
  margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#topActions{display:flex;align-items:center;gap:var(--space-1);flex-shrink:0}
.cyc{display:flex;align-items:center;gap:var(--space-2);background:var(--surface);border-radius:999px;
  padding:6px 13px 6px 7px;flex:none}
.cyc .t{line-height:1.2}
.cyc .t b{display:block;font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.cyc .t span{display:block;font-size:9.5px;color:var(--n-600);white-space:nowrap}
.cyc.over .t b{color:var(--c-alert)}
.cyc circle{transition:stroke-dasharray .9s var(--ease)}

/* ── Icon buttons ── */
.icon-btn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;flex-shrink:0;
  color:var(--n-700);font-size:15px;transition:background .15s,transform .15s}
.icon-btn:active{background:color-mix(in srgb,var(--c-text) 10%,transparent);transform:scale(.92)}
#topBar .icon-btn{width:38px;height:38px;font-size:16px}
.icon-btn.ib-tonal{background:var(--c-bg);color:var(--a-700)}
.icon-btn.ib-soft{background:color-mix(in srgb,var(--c-text) 8%,transparent)}
label.icon-btn{cursor:pointer;position:relative;overflow:hidden}

/* ── Overflow menu ── */
#menuRoot{position:fixed;inset:0;z-index:70}
#topMenu{position:absolute;top:calc(var(--sat) + 60px);right:max(12px,calc(50% - 228px));
  min-width:232px;background:var(--surface);border-radius:var(--radius-lg);padding:8px;
  box-shadow:var(--shadow-lg);transform-origin:top right;animation:popIn .26s var(--spring) both}
.menu-item{width:100%;min-height:48px;display:flex;align-items:center;gap:var(--space-3);padding:0 12px;border-radius:999px;
  font-size:14px;font-weight:600;color:var(--ink);text-align:left;cursor:pointer;position:relative;overflow:hidden}
.menu-item i{width:32px;height:32px;border-radius:999px;background:var(--c-bg);color:var(--a-700);
  display:grid;place-items:center;font-size:13px;flex:none}
.menu-item:active{background:var(--c-hair)}

/* ── Tab bar: v19 glass, like the iPhone's floating tab bar ──
   It floats above the page and is see-through: the screen scrolls under it
   and shows through, blurred. The highlight is a glass pill that slides to
   the tab you pick, stretching like a drop of liquid on the way. You can
   also hold the bar and slide your finger across it to pick a tab. */
#tabBar{position:absolute;z-index:6;left:max(14px,env(safe-area-inset-left,0px));right:max(14px,env(safe-area-inset-right,0px));
  bottom:calc(var(--sab) + 12px);height:var(--tab-h);padding:5px;display:flex;border-radius:999px;
  background:color-mix(in srgb,var(--c-surface) 38%,transparent);
  -webkit-backdrop-filter:blur(20px) saturate(1.9);backdrop-filter:blur(20px) saturate(1.9);
  border:1px solid color-mix(in srgb,#fff 62%,transparent);
  box-shadow:0 14px 34px -12px rgba(46,43,37,.34),0 2px 8px -2px rgba(46,43,37,.12),
    inset 0 1px 0 rgba(255,255,255,.75),inset 0 -1px 0 rgba(255,255,255,.18);
  touch-action:pan-y;isolation:isolate}
/* the glass sheen along the top edge */
#tabBar::before{content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:-1;
  background:linear-gradient(180deg,rgba(255,255,255,.42) 0%,rgba(255,255,255,.08) 46%,rgba(255,255,255,0) 60%,rgba(255,255,255,.12) 100%)}
[data-theme="dark"] #tabBar{background:color-mix(in srgb,var(--c-surface) 46%,transparent);
  border-color:rgba(255,255,255,.13);
  box-shadow:0 14px 34px -10px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.16),inset 0 -1px 0 rgba(255,255,255,.04)}
[data-theme="dark"] #tabBar::before{background:linear-gradient(180deg,rgba(255,255,255,.12),rgba(255,255,255,0) 55%)}
#tabInd{position:absolute;top:5px;bottom:5px;left:5px;width:calc((100% - 10px) / 5);border-radius:999px;
  pointer-events:none;z-index:0;will-change:transform;transform-origin:50% 50%;
  background:linear-gradient(180deg,color-mix(in srgb,#fff 70%,var(--a-100)),color-mix(in srgb,var(--a-200) 55%,rgba(255,255,255,.4)));
  box-shadow:inset 0 1px 1px rgba(255,255,255,.95),inset 0 -1px 2px rgba(140,73,26,.12),
    0 6px 16px -6px rgba(140,73,26,.42),0 0 0 .5px rgba(140,73,26,.1)}
[data-theme="dark"] #tabInd{background:linear-gradient(180deg,rgba(255,255,255,.2),rgba(255,255,255,.08));
  box-shadow:inset 0 1px 1px rgba(255,255,255,.28),0 6px 16px -6px rgba(0,0,0,.6)}
#tabInd.lift{box-shadow:inset 0 1px 1px rgba(255,255,255,.95),0 10px 24px -6px rgba(140,73,26,.5),0 0 0 .5px rgba(140,73,26,.14)}
.nav-btn{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  position:relative;z-index:1;color:var(--n-700);overflow:visible;border-radius:999px;transition:color .3s ease}
.nav-btn .ni{height:24px;display:grid;place-items:center;transition:transform .5s var(--spring)}
.nav-btn .ni svg{width:21px;height:21px}
.nav-btn .nl{font-size:10px;font-weight:600;letter-spacing:-.01em;white-space:nowrap}
.nav-btn[data-on="true"]{color:var(--a-700)}
.nav-btn[data-on="true"] .ni{transform:scale(1.08)}
.nav-btn[data-on="true"] .nl{font-weight:700}
.nav-btn:active .ni{transform:scale(.86)}
.nav-btn .rpl{display:none}
/* the screen fades softly where it slides under the bar */
main::after{content:'';position:absolute;left:0;right:0;bottom:0;height:calc(var(--bar-h) + var(--sab) + 6px);z-index:3;
  pointer-events:none;background:linear-gradient(to bottom,color-mix(in srgb,var(--page) 0%,transparent),color-mix(in srgb,var(--page) 62%,transparent))}
body:has(#topBar[data-scr="profile"]) main::after{display:none}

/* ── Buttons ── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;
  min-height:48px;padding:0 22px;border-radius:999px;border:1px solid transparent;
  font-family:var(--font-heading);font-weight:400;font-size:15px;line-height:1.2;white-space:nowrap;
  color:var(--a-700);transition:transform .18s var(--ease),background .15s,opacity .15s}
.btn:active{transform:scale(.96)}
.btn i{font-size:.88em;margin:0!important}
.btn.grow{flex:1;min-width:0;padding:0 14px}
.btn.block{width:100%}
.btn.btn-sm{min-height:36px;padding:0 15px;font-size:13px}
.btn.btn-lg{min-height:54px;font-size:16px}
.btn-filled{background:var(--c-accent);color:var(--c-bg)}
.btn-filled:active{background:var(--a-700)}
.btn-tonal{background:var(--a-100);color:var(--a-800)}
.btn-neutral{border-color:var(--c-divider);color:var(--ink)}
.btn-neutral:active{background:color-mix(in srgb,var(--c-text) 14%,transparent)}
.btn-ghost{background:transparent;color:var(--n-700);border:1px dashed var(--c-divider);font-family:var(--font-body);font-weight:600;font-size:13px}
.btn-danger{background:var(--udhaar-fill);color:var(--on-udhaar-fill)}
.btn-success{background:var(--jama-fill);color:var(--on-jama-fill)}
.btn-quiet-danger{background:var(--udhaarbg);color:var(--c-alert-700)}
.btn:disabled{opacity:.5;pointer-events:none}

/* ── Chips, tags, segmented ── */
.chip{flex-shrink:0;display:inline-flex;align-items:center;gap:8px;min-height:36px;padding:0 15px;
  border-radius:999px;border:1px solid var(--c-divider);background:transparent;
  font-size:13px;font-weight:600;color:var(--n-800);white-space:nowrap;transition:background .2s,color .2s,border-color .2s,transform .15s}
.chip:active{transform:scale(.95)}
.chip.on{background:var(--c-accent);border-color:var(--c-accent);color:var(--c-bg)}
.chip.chip-fill{background:var(--c-bg);padding:0;justify-content:center;font-variant-numeric:tabular-nums}
.chip.chip-2l{min-height:52px;background:var(--surface);border-color:transparent;text-align:left;color:var(--ink);
  line-height:1.2;padding:0 18px 0 8px;gap:10px}
.chip.chip-2l>i{width:36px;height:36px;border-radius:999px;background:var(--c-bg);display:grid;place-items:center}
.tag,.badge{display:inline-flex;align-items:center;font-size:11px;letter-spacing:.02em;line-height:1.5;
  padding:2px 10px;border-radius:999px;font-weight:600;white-space:nowrap}
.tag-accent{background:var(--a-100);color:var(--a-800)}
.tag-accent-2{background:var(--b-100);color:var(--b-800)}
.tag-alert{background:var(--c-alert-100);color:var(--c-alert-700)}
.seg{display:flex;border:1px solid var(--c-divider);border-radius:999px;overflow:hidden}
.seg button{flex:1;min-width:0;padding:9px 4px;font-size:12.5px;font-weight:600;color:var(--n-800);white-space:nowrap;
  transition:background .25s var(--ease),color .2s}
.seg button+button{border-left:1px solid var(--c-divider)}
.seg button.on{background:var(--c-accent);color:var(--c-bg)}
.seg button.on.b{background:var(--c-accent-2)}

/* ── Tiles ── */
.tile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;
  padding:14px 6px;border-radius:var(--radius-lg);background:var(--surface);
  font-size:12.5px;font-weight:700;color:var(--ink);transition:transform .18s var(--ease)}
.tile:active{transform:scale(.95)}
.tile>i{width:38px;height:38px;border-radius:999px;background:var(--c-bg);display:grid;place-items:center}

/* ── Avatars ── */
.avatar{border-radius:50%;display:grid;place-items:center;flex-shrink:0;
  font-family:var(--font-heading);font-weight:400;letter-spacing:.02em}
[data-theme="dark"] .avatar{filter:brightness(.86) saturate(.9)}
.av{border-radius:999px;flex:none;display:grid;place-items:center;overflow:hidden;
  background:var(--c-accent);box-shadow:var(--shadow)}
.av img{width:100%;height:100%;object-fit:cover;display:block;background:#fff}
.av .ini{font-family:var(--font-heading);color:var(--c-bg)}
.av.s58{width:58px;height:58px}.av.s58 .ini{font-size:22px}

/* ── Lists ── rows share one card, hairlines between them */
.seglist{display:flex;flex-direction:column;background:var(--surface);border-radius:var(--r-card);
  padding:var(--space-1) var(--space-4)}
.row{background:var(--surface);display:flex;align-items:center;gap:12px;padding:12px 14px;min-height:64px;
  border-radius:var(--radius-lg)}
.seglist>.row{background:none;border-radius:0;padding:11px 0;min-height:62px;border-bottom:1px solid var(--c-hair)}
.seglist>.row:last-child{border-bottom:none}
button.row{color:inherit}
button.row:active,.row.tap:active{opacity:.62}
.tap{position:relative;overflow:hidden;cursor:pointer}
.hrow{display:flex;align-items:center;gap:var(--space-2);padding:var(--space-2) 0;border-bottom:1px solid var(--c-hair)}
.hrow:last-child{border-bottom:none}
.dl{display:flex;justify-content:space-between;gap:var(--space-4);padding:var(--space-2) 0;
  border-bottom:1px solid var(--c-hair);font-size:13px}
.dl:last-child{border-bottom:none}
.dl dt{color:var(--n-700);flex:none}
.dl dd{margin:0;text-align:right;font-weight:600;font-variant-numeric:tabular-nums}

/* ── Form elements ── */
.field{
  width:100%;min-width:0;min-height:46px;background:var(--c-bg);border:1px solid var(--c-divider);
  border-radius:999px;padding:10px 16px;font-size:16px;font-weight:600;
  color:var(--ink);caret-color:var(--c-accent);outline:none;
  transition:border-color .18s,box-shadow .18s
}
.field:focus{border-color:var(--c-accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--c-accent) 20%,transparent)}
.field::placeholder{font-weight:400;color:var(--n-500)}
.field:disabled{opacity:.5}
select.field{appearance:none;-webkit-appearance:none;
  background-image:linear-gradient(45deg,transparent 50%,var(--n-600) 50%),linear-gradient(135deg,var(--n-600) 50%,transparent 50%);
  background-position:calc(100% - 22px) 55%,calc(100% - 17px) 55%;background-size:5px 5px;background-repeat:no-repeat}
.modal-card [style*="grid-template-columns:1fr 1fr"]>*{min-width:0}
.label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--n-700);
  margin-bottom:6px;display:block}
input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
input[type=number]{-moz-appearance:textfield;appearance:textfield}
input[type="date"],input[type="month"]{color-scheme:light}
[data-theme="dark"] input[type="date"],[data-theme="dark"] input[type="month"],[data-theme="dark"] .field{color-scheme:dark}
.pick{border:none;border-radius:999px;padding:9px 14px;font-size:13px;font-weight:700;color:var(--a-800);
  background:var(--a-100);outline:none;min-height:40px}
.searchbar{position:relative}
.searchbar>i{position:absolute;left:19px;top:50%;transform:translateY(-50%);color:var(--n-600);font-size:14px;pointer-events:none}
.searchbar .field{height:52px;padding-left:48px;background:var(--surface);border-color:transparent;font-weight:500}
.searchbar .field:focus{border-color:var(--c-accent)}
.rng{width:100%;height:28px;-webkit-appearance:none;appearance:none;background:transparent;display:block}

/* ── Horizontal strips ── */
.hscroll{-webkit-overflow-scrolling:touch;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}

/* ── Scrim, bottom sheet, dialog ── */
.backdrop{position:fixed;inset:0;z-index:60;background:var(--scrim);
  display:flex;align-items:flex-end;justify-content:center;animation:fadeIn .28s ease both}
.backdrop-center{align-items:center}
#confirmRoot{z-index:100000}
.modal-card{background:var(--surface);width:100%;max-width:480px;
  border-radius:calc(var(--radius-lg) * 1.4) calc(var(--radius-lg) * 1.4) 0 0;max-height:92dvh;
  display:flex;flex-direction:column;overflow:hidden;box-shadow:var(--shadow-lg)}
.modal-center{border-radius:calc(var(--radius-lg) * 1.25);max-height:88dvh;margin:0 12px;box-shadow:var(--shadow-lg)}
[hidden]{display:none!important}

/* ── Receipt preview ── */
#receiptModal{position:fixed;inset:0;z-index:80;background:var(--page);
  display:flex;flex-direction:column;align-items:center;animation:slideX .34s var(--ease) both}
#receiptModal.hidden{display:none!important}
#receiptInner{width:100%;max-width:480px;height:100%;display:flex;flex-direction:column;overflow:hidden}
#receiptScroll{flex:1;overflow-y:auto;padding:8px 16px 16px;-webkit-overflow-scrolling:touch}
#receiptScroll::-webkit-scrollbar{display:none}
#receiptActionBar{flex-shrink:0;padding:12px 16px;padding-bottom:calc(12px + var(--sab));
  background:var(--surface);border-radius:var(--radius-lg) var(--radius-lg) 0 0;box-shadow:var(--shadow);
  display:flex;gap:8px}
#receiptActionBar .btn{padding:0 8px;min-width:0;flex:1 1 0}
#receiptActionBar #btnDlShare{flex:1.5 1 0}

/* ── FAB ── */
.fab-btn{
  position:absolute;right:var(--space-4);bottom:calc(var(--bar-h) + var(--sab) + var(--space-4));z-index:40;
  display:flex;align-items:center;gap:9px;height:58px;padding:0 22px 0 19px;border-radius:999px;
  font-family:var(--font-heading);font-size:15px;background:var(--c-accent);color:var(--c-bg);
  box-shadow:var(--shadow-lg);transition:transform .18s
}
.fab-btn:active{transform:scale(.92);background:var(--a-700)}
.fab-btn i{font-size:16px}

/* ── Cards ── */
.card{background:var(--surface);border-radius:var(--r-card)}
.divider{height:1px;background:var(--c-hair);margin:0 16px}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;
  padding:var(--space-6) calc(var(--space-4) + var(--space-2)) var(--space-2)}
.sec-head h3{font-family:var(--font-body);font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;
  color:var(--n-600);font-weight:700}
.sec-head span{font-size:11px!important;color:var(--n-600)!important;font-weight:600}
.pad{padding:0 var(--space-4)}
.mt{margin-top:var(--space-3)}

/* ── Hero ── */
.hero{padding:var(--space-4);background:linear-gradient(140deg,
  color-mix(in srgb,var(--c-accent) 22%,var(--c-surface)) 0%,var(--c-surface) 62%)}
.hero .hrw{display:flex;align-items:center;gap:var(--space-3)}
.hero .who{min-width:0;flex:1}
.hero .g{font-size:10px;letter-spacing:.11em;text-transform:uppercase;font-weight:700;color:var(--a-700)}
.hero .nm2{font-family:var(--font-heading);font-size:clamp(17px,5vw,21px);line-height:1.1;margin-top:3px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hero .meta{font-size:11.5px;color:var(--n-700);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hero .gear{width:36px;height:36px;border-radius:999px;flex:none;display:grid;place-items:center;
  background:color-mix(in srgb,var(--c-text) 8%,transparent);color:var(--n-700);transition:transform .5s var(--ease)}
.hero .gear:active{transform:rotate(90deg)}
.hero .gear.flat:active{transform:scale(.88)}
.hero.r{background:linear-gradient(140deg,color-mix(in srgb,var(--c-alert) 17%,var(--c-surface)) 0%,var(--c-surface) 62%)}
.hero.r .g{color:var(--c-alert-700)}
.hero.b{background:linear-gradient(140deg,color-mix(in srgb,var(--c-accent-2) 26%,var(--c-surface)) 0%,var(--c-surface) 62%)}
.hero.b .g{color:var(--b-700)}
.hero .big{font-family:var(--font-heading);font-size:clamp(34px,11.4vw,46px);line-height:1.02;margin-top:var(--space-4);
  font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden}
.hero .big-l{font-size:11.5px;color:var(--n-700);margin-top:5px}
.strip{display:flex;gap:var(--space-2);margin-top:var(--space-4);padding-top:var(--space-3);border-top:1px solid var(--c-divider)}
.strip>div{flex:1;min-width:0}
.strip .k,.kk{font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--n-600);font-weight:700;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.strip .v{font-size:15.5px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.strip .v.alert{color:var(--c-alert)}
.strip .v.pos{color:var(--b-700)}

/* ── Insights ── */
.ins{display:flex;gap:var(--space-3);align-items:flex-start;width:100%;text-align:left;
  padding:var(--space-3) var(--space-4);border-radius:var(--radius-lg);background:var(--surface);
  margin-top:var(--space-2);transition:transform .18s var(--ease)}
button.ins:active{transform:scale(.98)}
.ins .ic{width:32px;height:32px;border-radius:999px;flex:none;display:grid;place-items:center;font-size:13px;background:var(--c-bg)}
.ins .tt{font-size:13px;font-weight:700;line-height:1.3;display:block}
.ins .bb{font-size:11.5px;color:var(--n-700);margin-top:3px;line-height:1.5;display:block}
.ins .go{margin-left:auto;align-self:center;color:var(--n-500);font-size:11px;flex:none}
.ins.alert{background:var(--c-alert-100)}
.ins.alert .ic{box-shadow:inset 0 0 0 1.5px var(--c-alert);color:var(--c-alert)}
.ins.alert .tt{color:var(--c-alert-700)}
.ins.warn{background:var(--a-100)}
.ins.warn .ic{box-shadow:inset 0 0 0 1.5px var(--c-accent);color:var(--a-700)}
.ins.good{background:var(--b-100)}
.ins.good .ic{box-shadow:inset 0 0 0 1.5px var(--c-accent-2);color:var(--b-700)}

/* ── Meter card + gauge ── */
.meter{padding:var(--space-4)}
.meter.a{--ac:var(--c-accent);--ac-d:var(--a-700)}
.meter.b{--ac:var(--c-accent-2);--ac-d:var(--b-700)}
.meter.r{--ac:var(--c-alert);--ac-d:var(--c-alert)}
.meter .top{display:flex;align-items:center;gap:var(--space-2);margin-bottom:var(--space-3)}
.meter .nm{font-family:var(--font-heading);font-size:19px;line-height:1}
.meter .sn{font-size:10.5px;color:var(--n-600);margin-left:auto;font-variant-numeric:tabular-nums;white-space:nowrap}
.mrow{display:flex;align-items:center;gap:var(--space-4)}
.gauge{width:98px;height:98px;flex:none;position:relative}
.gauge svg{width:100%;height:100%;transform:rotate(135deg);display:block}
.gauge .trk{fill:none;stroke:var(--n-300);stroke-width:9;stroke-linecap:round}
.gauge .prg{fill:none;stroke-width:9;stroke-linecap:round;stroke:var(--ac);
  transition:stroke-dasharray 1.1s var(--ease)}
.gc{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.gc .v{font-family:var(--font-heading);font-size:27px;line-height:1;color:var(--ac-d)}
.gc .v[data-fmt="pct"]{font-size:19px;letter-spacing:-.01em}
.gc .l{font-size:8.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--n-600);margin-top:3px;font-weight:700}
.mside{flex:1;min-width:0}
.head{font-family:var(--font-heading);font-size:clamp(19px,6.4vw,28px);line-height:.98;color:var(--ac-d);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.head-l{font-size:11px;color:var(--n-700);margin-top:4px}
.msplit{display:flex;gap:var(--space-2);margin-top:var(--space-4);padding-top:var(--space-3);border-top:1px solid var(--c-divider)}
.msplit>div{flex:1;min-width:0}
.msplit .k{font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--n-600);font-weight:700;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.msplit .v{font-size:15.5px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.msplit .v.alert{color:var(--c-alert)}

/* ── Two-up estimate card ── */
.est{display:flex;overflow:hidden}
.est>div{flex:1;min-width:0;padding:var(--space-4)}
.est>div+div{border-left:1px solid var(--c-divider)}
.est .k{font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--n-600);font-weight:700}
.est .v{font-family:var(--font-heading);font-size:clamp(15px,5vw,19px);margin-top:6px;line-height:1.1;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.est .r{font-size:11px;color:var(--n-600);font-variant-numeric:tabular-nums;margin-top:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ── Stats grid ── */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-2)}
.stat{background:var(--surface);border-radius:var(--radius-lg);padding:var(--space-3) var(--space-4);min-width:0;text-align:left}
.stat .k{font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--n-600);font-weight:700}
.stat .v{font-family:var(--font-heading);font-size:20px;margin-top:5px;line-height:1.05;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat .r{font-size:10.5px;color:var(--n-600);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ── Bar charts ── */
.chart{padding:var(--space-4)}
.chart-top{display:flex;align-items:flex-start;justify-content:space-between;gap:var(--space-3)}
.chart-top .v{font-family:var(--font-heading);font-size:24px;line-height:1;font-variant-numeric:tabular-nums}
.chart-top .l{font-size:11px;color:var(--n-700);margin-top:4px;min-height:16px}
.bars{display:flex;align-items:flex-end;gap:4px;padding-top:var(--space-3);position:relative}
.bcol{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0;cursor:pointer}
.bwrap{width:100%;height:92px;display:flex;align-items:flex-end;justify-content:center;gap:2px;border-radius:10px;
  transition:background .2s}
.bcol.sel .bwrap{background:color-mix(in srgb,var(--c-text) 7%,transparent)}
.bar{width:100%;max-width:14px;border-radius:999px 999px var(--radius-sm) var(--radius-sm);min-height:3px;height:0;
  transition:height .8s var(--ease)}
.bar.a{background:var(--c-accent)}
.bar.b{background:var(--c-accent-2)}
.blab{font-size:8.5px;color:var(--n-600);white-space:nowrap;font-weight:600;height:11px}
.bcol.sel .blab{color:var(--ink)}
.bars.dense{gap:2px}
.bars.dense .bwrap{gap:1px;border-radius:5px}
.plegend{display:flex;gap:var(--space-3);flex-wrap:wrap;font-size:10.5px;color:var(--n-700);margin-top:var(--space-3)}
.plegend b{display:inline-block;width:8px;height:8px;border-radius:999px;margin-right:5px}
.split{display:flex;height:13px;border-radius:999px;overflow:hidden;background:var(--n-300)}
.split i{display:block;height:100%;width:0;transition:width .9s var(--ease)}
.hbar{height:9px;border-radius:999px;background:var(--n-300);overflow:hidden}
.hbar i{display:block;height:100%;width:0;border-radius:999px;transition:width .9s var(--ease)}
.spark{display:block;width:100%;height:46px;overflow:visible}
.spark path.ln{fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;
  stroke-dasharray:var(--len,600);stroke-dashoffset:var(--len,600);transition:stroke-dashoffset 1.2s var(--ease)}
.spark.go path.ln{stroke-dashoffset:0}
.spark path.ar{opacity:0;transition:opacity .9s ease .3s}
.spark.go path.ar{opacity:.16}

/* ── Doughnut chart ── */
.pie-wrap{position:relative;width:150px;height:150px;flex-shrink:0}
.pie-wrap canvas{width:100%;height:100%;display:block}
.pie-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;text-align:center}
.pie-legend{display:flex;flex-direction:column;gap:11px;flex:1;min-width:0}
.pie-leg-row{display:flex;align-items:center;gap:9px}
.pie-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}

/* ── Status dot ── */
.dot-live{width:7px;height:7px;border-radius:50%;background:var(--c-accent-2);animation:pulse 2s infinite}

/* ── Theme toggle icon ── */
.theme-ic-light{display:none}
.theme-ic-dark{display:block}
[data-theme="dark"] .theme-ic-light{display:block}
[data-theme="dark"] .theme-ic-dark{display:none}

/* ── Offline banner ── */
#offlineBanner{flex-shrink:0;position:relative;z-index:5;background:var(--inverse);color:var(--inverse-ink);
  font-size:12px;font-weight:600;text-align:center;padding:calc(6px + var(--sat)) 12px 6px;display:none}
#offlineBanner[style*="block"]+#topBar{padding-top:0}

/* ── Toast ── */
#toastBox{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--bar-h) + var(--sab) + var(--space-6));
  z-index:90;display:flex;flex-direction:column;align-items:center;gap:8px;width:calc(100% - 24px);max-width:456px;pointer-events:none}
.snack{background:var(--inverse);color:var(--inverse-ink);min-height:46px;padding:6px 8px 6px 18px;border-radius:999px;
  font-size:13px;font-weight:600;display:flex;align-items:center;gap:10px;max-width:100%;
  box-shadow:var(--shadow-lg);pointer-events:auto;animation:snackIn .36s var(--ease) both}
.snack>span{flex:1;padding:6px 10px 6px 0}
.snack button{color:var(--inverse-primary);font-weight:800;font-size:11px;letter-spacing:.08em;text-transform:uppercase;
  padding:0 14px;min-height:34px;border-radius:999px;flex-shrink:0}

/* ── PIN lock ── */
#lockScreen{position:fixed;inset:0;z-index:99998;background:var(--page);
  display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px;overflow:hidden}
#lockScreen::before{content:'';position:absolute;top:-90px;right:-70px;width:260px;height:260px;border-radius:50%;
  background:color-mix(in srgb,var(--c-accent) 13%,transparent);pointer-events:none}
#lockScreen::after{content:'';position:absolute;bottom:-60px;left:-95px;width:210px;height:210px;border-radius:50%;
  background:color-mix(in srgb,var(--c-accent-2) 14%,transparent);pointer-events:none}
#lockScreen>*{position:relative;z-index:1}
#lockPad{display:grid;grid-template-columns:repeat(3,76px);gap:14px 22px;margin-top:22px}
.pin-key{width:76px;height:76px;border-radius:50%;background:var(--surface);color:var(--ink);
  font-family:var(--font-heading);font-size:28px;display:grid;place-items:center;
  transition:transform .18s var(--spring),background .15s,color .15s}
.pin-key:active{transform:scale(.9);background:var(--c-accent);color:var(--c-bg)}
.pin-key.pk-plain{background:transparent;color:var(--n-700);font-size:20px}

/* ── Startup: v19 opening animation (replaces the splash video) ──

#splashScreen{position:fixed;inset:0;z-index:99999;display:grid;place-items:center;overflow:hidden;
  background:radial-gradient(130% 80% at 50% 40%,#2c1c11 0%,#150e09 50%,#080504 100%);

  transition:opacity .6s cubic-bezier(.4,0,.2,1),visibility 0s linear .6s}
#splashScreen.out{opacity:0;visibility:hidden;pointer-events:none}
.sp-glow{position:absolute;width:90vmax;height:90vmax;border-radius:50%;opacity:0;pointer-events:none}
.sp-g1{top:-48vmax;left:-38vmax;background:radial-gradient(circle,rgba(214,127,72,.34),rgba(214,127,72,0) 62%)}
.sp-g2{bottom:-52vmax;right:-44vmax;background:radial-gradient(circle,rgba(212,170,104,.2),rgba(212,170,104,0) 60%)}
.sp-core{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;
  padding:0 24px;transition:transform .6s cubic-bezier(.4,0,.2,1),opacity .45s ease,filter .6s ease}
#splashScreen.out .sp-core{transform:scale(1.06);opacity:0;filter:blur(6px)}
.sp-mark{position:relative;width:132px;height:132px;display:grid;place-items:center}
.sp-mark::before{content:'';position:absolute;inset:-34px;border-radius:50%;opacity:0;
  background:radial-gradient(circle,rgba(233,177,108,.42) 0%,rgba(233,177,108,0) 66%)}
.sp-ring{position:absolute;left:-15px;top:-15px;width:162px;height:162px;overflow:visible}
.sp-ring circle{fill:none;stroke:url(#spGold);stroke-width:1.7;stroke-linecap:round;
  stroke-dasharray:100 100;stroke-dashoffset:100}
.sp-ring .r2{stroke-width:.7;opacity:.45;stroke-dasharray:2 3.2;stroke-dashoffset:0}
.sp-logo{position:relative;width:132px;height:132px;border-radius:50%;object-fit:cover;opacity:0;
  transform:scale(.7);filter:blur(14px);
  box-shadow:0 0 0 1px rgba(247,220,166,.28),0 22px 60px -12px rgba(214,127,72,.7)}
.sp-name{position:relative;margin-top:34px;font-size:clamp(22px,7.1vw,31px);font-weight:700;
  letter-spacing:-.024em;line-height:1.12;opacity:0;white-space:nowrap}
.sp-name .w{display:inline-block;white-space:nowrap}
.sp-name .c{display:inline-block;opacity:0;transform:translateY(.6em) scale(.96);filter:blur(9px)}
.sp-shine{position:absolute;inset:0;color:transparent;pointer-events:none;opacity:0;
  background:linear-gradient(105deg,rgba(255,255,255,0) 36%,rgba(255,246,226,.95) 48%,rgba(255,214,150,.9) 52%,rgba(255,255,255,0) 64%);
  background-size:260% 100%;background-position:120% 0;-webkit-background-clip:text;background-clip:text}
.sp-rule{width:132px;height:1px;margin-top:20px;transform:scaleX(0);
  background:linear-gradient(90deg,rgba(217,168,104,0),#d9a868 30%,#f3d39c 50%,#d9a868 70%,rgba(217,168,104,0))}
.sp-sub{margin-top:15px;font-size:11.5px;font-weight:600;letter-spacing:.42em;padding-left:.42em;
  text-transform:uppercase;color:#d2aa72;opacity:0}
.sp-foot{position:absolute;left:0;right:0;bottom:calc(30px + env(safe-area-inset-bottom,0px));text-align:center;
  font-size:10px;font-weight:600;letter-spacing:.34em;padding-left:.34em;text-transform:uppercase;
  color:rgba(247,236,218,.38);opacity:0}

#splashScreen.go .sp-glow{animation:spFade 1.4s ease .05s forwards,spDrift 9s ease-in-out infinite alternate}
#splashScreen.go .sp-g2{animation-delay:.25s,0s}
#splashScreen.go .sp-ring .r1{animation:spDraw 1.15s cubic-bezier(.65,0,.35,1) .05s forwards}
#splashScreen.go .sp-ring{animation:spSpin 14s linear infinite}
#splashScreen.go .sp-logo{animation:spFocus 1s cubic-bezier(.16,1,.3,1) .12s forwards}
#splashScreen.go .sp-mark::before{animation:spHalo 2.2s ease-in-out .6s infinite}
#splashScreen.go .sp-name{opacity:1}
#splashScreen.go .sp-name .c{animation:spChar .75s cubic-bezier(.16,1,.3,1) var(--d,.45s) forwards}
#splashScreen.go .sp-shine{animation:spShine 1.25s cubic-bezier(.45,0,.2,1) 1.12s forwards}
#splashScreen.go .sp-rule{animation:spRule .85s cubic-bezier(.16,1,.3,1) .98s forwards}
#splashScreen.go .sp-sub{animation:spSub 1s cubic-bezier(.16,1,.3,1) 1.08s forwards}
#splashScreen.go .sp-foot{animation:spFade .8s ease 1.25s forwards}

@keyframes spFade{to{opacity:1}}
@keyframes spDrift{to{transform:translate(4vmax,3vmax)}}
@keyframes spDraw{to{stroke-dashoffset:0}}
@keyframes spSpin{to{transform:rotate(360deg)}}
@keyframes spFocus{to{opacity:1;transform:none;filter:none}}
@keyframes spHalo{0%,100%{opacity:.35;transform:scale(.94)}50%{opacity:1;transform:scale(1.04)}}
@keyframes spChar{to{opacity:1;transform:none;filter:none}}
@keyframes spShine{0%{opacity:1;background-position:120% 0}100%{opacity:1;background-position:-20% 0}}
@keyframes spRule{to{transform:none}}
@keyframes spSub{from{opacity:0;letter-spacing:.8em}to{opacity:1;letter-spacing:.42em}}
/* The app settles into place as the curtain lifts. */
@keyframes appIn{from{opacity:.4;transform:scale(.965)}to{opacity:1;transform:none}}
#app.app-in{animation:appIn .7s cubic-bezier(.16,1,.3,1) both}
@media (prefers-reduced-motion:reduce){
  #splashScreen.go .sp-ring{animation:none}

}

<script>
/* Runs right here, before the rest of the page has even loaded, so the
   animation starts at once while the khata gets ready behind it. */
(function splashInit(){
  const scr=document.getElementById('splashScreen'); if(!scr) return;
  const meta=document.getElementById('themeColorMeta');
  if(meta) meta.content='#120c08';
  const reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  const nm=document.getElementById('spName');
  if(nm){
    const txt=nm.textContent.trim(); let i=0;
    nm.textContent='';
    txt.split(' ').forEach((w,wi)=>{
      if(wi) nm.appendChild(document.createTextNode(' '));
      const ws=document.createElement('span'); ws.className='w';
      for(const ch of w){
        const c=document.createElement('span'); c.className='c'; c.textContent=ch;
        c.style.setProperty('--d',(0.42+i*0.032).toFixed(3)+'s'); ws.appendChild(c); i++;
      }
      nm.appendChild(ws);
    });
    const sh=document.createElement('span'); sh.className='sp-shine'; sh.textContent=txt; nm.appendChild(sh);
  }
  let started=false, done=false;
  function finish(){
    if(done) return; done=true;
    scr.classList.add('out');
    if(meta) meta.content=document.documentElement.getAttribute('data-theme')==='dark'?'#191614':'#f5ead8';
    const app=document.getElementById('app');
    try{
      if(app){ app.classList.add('app-in'); setTimeout(()=>app.classList.remove('app-in'),800); }
      if(typeof cur!=='undefined'&&cur!=='profile'){ render(cur); playEnter(S(cur)); }
    }catch(e){ console.warn('[SPLASH]',e); }
    setTimeout(()=>scr.remove(),700);
  }
  window.__splashDone=()=>done;
  function start(){
    if(started) return; started=true;
    scr.classList.add('go');
    setTimeout(finish,reduce?650:1900);
  }
  const logo=scr.querySelector('.sp-logo');
  if(logo&&!logo.complete){
    logo.addEventListener('load',start,{once:true});
    logo.addEventListener('error',start,{once:true});
    setTimeout(start,320);                 // never wait long for the picture
  } else start();
  scr.addEventListener('pointerdown',()=>{ if(started) finish(); });
  setTimeout(finish,4500);                 // safety: never trap the shop on the splash
})();
</script>

const loadArr = (k)=>{ try{ const v=JSON.parse(localStorage.getItem(k)); return Array.isArray(v)?v:[]; }catch{ return []; }};
/* v17: when the phone's storage for this app is full, setItem throws and the
   entry used to be lost without a word. The daily snapshots are the only thing
   that can safely make room, so they are trimmed oldest-first and the write is
   retried; if it still fails the shop is told at once to save a backup file. */
let _storeWarnAt=0;
const saveKey = (k,v)=>{
  let txt; try{ txt=JSON.stringify(v); }catch(e){ console.warn('[STORAGE]',e); return false; }
  for(let i=0;i<9;i++){
    try{ localStorage.setItem(k,txt); return true; }
    catch(e){
      let snaps=null; try{ snaps=JSON.parse(localStorage.getItem(KEYS.snap)); }catch{}
      if(k!==KEYS.snap&&Array.isArray(snaps)&&snaps.length){
        snaps.shift();
        try{ snaps.length?localStorage.setItem(KEYS.snap,JSON.stringify(snaps)):localStorage.removeItem(KEYS.snap); }catch{ try{ localStorage.removeItem(KEYS.snap); }catch{} }
        continue;
      }
      console.warn('[STORAGE]',e);
      if(Date.now()-_storeWarnAt>15000){ _storeWarnAt=Date.now();
        setTimeout(()=>{ try{ toast('Phone ki storage bhar gayi — ye entry save nahi hui! Foran backup file save karein.','err',{label:'Backup',fn:doBackup}); }catch{} },50); }
      return false;
    }
  }
  return false;
};

/* -- Repairing text an older build mangled --
   If the page was ever served without its UTF-8 charset reaching the browser,
   the Urdu names decoded as Latin-1 -- and because the catalogue is saved to
   storage, that mangled text stuck around even after the page itself started
   decoding correctly ("kh" + "oya" came back as "\u00DA\u00A9\u00DA\u00BE..."). This turns such a
   string back into the Urdu it started as and leaves everything else alone,
   so a khata that already has the bad text heals itself on the next launch.
   The item names in this file are written as \u escapes now, so a fresh
   install can never pick the problem up again. */
const CP1252_BACK = {0x20AC:0x80,0x201A:0x82,0x0192:0x83,0x201E:0x84,0x2026:0x85,
  0x2020:0x86,0x2021:0x87,0x02C6:0x88,0x2030:0x89,0x0160:0x8A,0x2039:0x8B,0x0152:0x8C,
  0x017D:0x8E,0x2018:0x91,0x2019:0x92,0x201C:0x93,0x201D:0x94,0x2022:0x95,0x2013:0x96,
  0x2014:0x97,0x02DC:0x98,0x2122:0x99,0x0161:0x9A,0x203A:0x9B,0x0153:0x9C,0x017E:0x9E,0x0178:0x9F};
function fixMojibake(str){
  if(typeof str!=='string'||!str) return str;
  /* Mangled text always carries one of the accented capitals a UTF-8 lead byte
     turns into; without one there is nothing to repair. */
  if(!/[\u00C0-\u00FF]/.test(str)) return str;
  const bytes=[];
  for(const ch of str){
    const cp=ch.codePointAt(0);
    const b=cp<256?cp:CP1252_BACK[cp];
    if(b===undefined) return str;   // not a Latin-1 round trip -- leave it be
    bytes.push(b);
  }
  try{
    const out=new TextDecoder('utf-8',{fatal:true}).decode(new Uint8Array(bytes));
    return out||str;
  }catch{ return str; }             // real accented text, not mangled
}

/* Built-ins are re-seeded (never overwritten) so a future app version can add
   an item without the shop losing the rates it already set. */
function loadProducts(){
  const saved=loadArr(KEYS.p);
  const out=saved.filter(p=>p&&p.id).map(p=>({...p}));
  DEFAULT_PRODUCTS.forEach(d=>{ if(!out.some(p=>p.id===d.id)) out.push({...d}); });
  out.forEach(p=>{
    const n0=p.name, u0=p.urdu;
    p.name   = fixMojibake(p.name);
    p.urdu   = fixMojibake(p.urdu);
    if(p.name!==n0||p.urdu!==u0) _healedText=true;
    p.unit   = p.unit||'kg';
    p.rate   = money(num(p.rate));
    p.active = p.active!==false;
    p.icon   = p.icon||'fa-box';
    p.color  = p.color||'#8A3E23';
  });
  return out;
}

   names back once instead of repairing them again on every launch. */

const persist = ()=>{ ledgerChanged(); saveKey(KEYS.c, customers); saveKey(KEYS.t, transactions); saveKey(KEYS.p, products);
  /* The WhatsApp bot (if linked in Settings) gets the change a few seconds later. */
  try{ syncSoon(); }catch(e){ console.warn('[SYNC]',e); } };

/* ── One-time repair of ledgers written by older versions ──
   The old "Reverse" flagged the original entry as reversed (which dropped it
   from the balance) AND pushed an offsetting adjustment on top, so every
   reversal moved the balance by twice the entry amount. Collapse each such
   pair back into a single voided entry and re-quantise stored money, then the
   balances match the paper khata again. */
function migrateData(){
  let changed=false;
  const offsets=transactions.filter(t=>t.reverses);
  if(offsets.length){
    const targets=new Set(offsets.map(t=>t.reverses));
    transactions=transactions.filter(t=>!t.reverses);
    transactions.forEach(t=>{ if(targets.has(t.id)) t.voided=true; });
    changed=true;
  }
  transactions.forEach(t=>{
    if(t.reversed){ t.voided=true; delete t.reversed; changed=true; }
    if(t.amount!=null&&money(t.amount)!==t.amount){ t.amount=money(t.amount); changed=true; }
    if(t.delta !=null&&money(t.delta) !==t.delta ){ t.delta =money(t.delta);  changed=true; }
    if(t.voided&&!t.voidedAt){ t.voidedAt=t.createdAt||new Date().toISOString(); changed=true; }
    /* Before the catalogue existed every sale was milk and carried type:'milk'.
       Re-file those as ordinary sales of the milk item so one code path now
       serves milk, dahi, ghee and everything added later. */
    if(t.type==='milk'){ t.type='sale'; t.pid=t.pid||'milk'; t.unit=t.unit||'L'; changed=true; }
    if(t.type==='sale'&&!t.pid){ t.pid='milk'; changed=true; }
  });
  if(changed) persist();
  return changed;
}

   keeps float drift (0.1+0.2=0.30000000000000004) out of balances, so a fully
   settled account lands on a true 0 and reads "Clear" instead of "Rs 0 Udhaar". */

   statement always add up to the total the customer is shown. */

  const v=money(n), a=Math.abs(v);
  return (v<0?'−Rs ':'Rs ')+(Number.isInteger(a)
    ? a.toLocaleString('en-PK')
    : a.toLocaleString('en-PK',{minimumFractionDigits:2,maximumFractionDigits:2}));
};

/* ── Ledger math ──
   A single rule decides what counts: an entry is live unless it is voided.
   Voided entries stay in storage (so a mistake can be undone) but never touch
   a balance, a total, a statement or a report. */
const alive      = ()=>customers.filter(c=>!c.deleted);
const isLive     = t=>!t.voided;
const custBy     = id=>customers.find(c=>c.id===id);
/* v18: every screen used to scan the whole ledger once per customer (300
   customers x 50,000 entries = 15 million steps for one list). The ledger is
   now grouped by customer once after each change; persist() marks it stale.
   Entries are added up in the same order as before, so every balance is the
   very same number to the paisa. */
let _ledgerVer=0, _ix=null;
const ledgerChanged=()=>{ _ledgerVer++; _ix=null; };
const ledgerIx=()=>{
  if(_ix&&_ix.ref===transactions&&_ix.len===transactions.length&&_ix.ver===_ledgerVer) return _ix;
  const by=new Map(), bal=new Map();
  for(const t of transactions){ if(!isLive(t)) continue;
    let a=by.get(t.cid); if(!a){ a=[]; by.set(t.cid,a); } a.push(t);
    bal.set(t.cid,(bal.get(t.cid)||0)+num(t.delta)); }
  _ix={ref:transactions,len:transactions.length,ver:_ledgerVer,by,bal};
  return _ix;
};
const txOf       = id=>(ledgerIx().by.get(id)||[]).slice();   // a copy: callers sort it in place
const allTxOf    = id=>transactions.filter(t=>t.cid===id);
const balanceOf  = id=>money(ledgerIx().bal.get(id)||0);
/* Shop-wide totals only count customers who still exist, otherwise the
   dashboard's "today's milk" disagreed with the balances shown beside it. */
const sumWhere   = p=>{
  const ids=new Set(alive().map(c=>c.id));
  return money(transactions.filter(t=>isLive(t)&&ids.has(t.cid)&&p(t))
    .reduce((s,t)=>s+num(t.amount),0));
};
/* Stable chronological key — guards entries saved without a date. */
const txKey      = t=>(t.date||'0000-00-00')+'|'+(t.createdAt||'');
const byOldest   = (a,b)=>txKey(a).localeCompare(txKey(b));
const byNewest   = (a,b)=>txKey(b).localeCompare(txKey(a));

/* ── Delivery helpers ── */
/* Milk already recorded for a customer on a given day. Two deliveries a day is
   normal, so this returns every match rather than just the first. */
const saleOn     = (cid,date,pid)=>txOf(cid).filter(t=>isSale(t)&&t.date===date&&(!pid||pidOf(t)===pid));
const qtyOn      = (cid,date,pid)=>money(saleOn(cid,date,pid).reduce((s,t)=>s+num(t.qty),0));
/* An open-ended leaveFrom (no leaveTo) means "away until further notice". */
const onLeave    = (c,date)=>!!c.leaveFrom&&date>=c.leaveFrom&&(!c.leaveTo||date<=c.leaveTo);
const lastPayOf  = id=>{
  const p=txOf(id).filter(t=>t.type==='pay').sort(byNewest)[0];
  return p?p.date:null;
};
const daysSince  = d=>{
  const x=parseD(d); if(!x) return null;
  return Math.max(0,Math.round((parseD(today())-x)/864e5));
};

/* ── WhatsApp ── */
/* Pakistani numbers are written 0300-1234567 locally but wa.me needs the full
   international form with no punctuation. */
function waNumber(phone){
  let d=String(phone||'').replace(/\D/g,'');
  if(!d) return '';
  if(d.startsWith('0092')) d=d.slice(2);
  if(d.startsWith('92'))   return d;
  if(d.startsWith('0'))    return '92'+d.slice(1);
  if(d.length===10)        return '92'+d;
  return d;
}
/* Opens WhatsApp with the message pre-typed — the user still presses send. */
function waSend(phone,text){
  const n=waNumber(phone);
  if(!n){ toast('This customer has no mobile number','err'); return; }
  window.open(`https://wa.me/${n}?text=${encodeURIComponent(text)}`,'_blank','noopener');
}
/* Groups a set of rows into one line per item — the "kis cheez ka kitna" view
   that both the WhatsApp bill and the printed receipt are built from. */
function itemBreakdown(rows){
  const map=new Map();
  rows.filter(isSale).forEach(t=>{
    const p=prodOf(t), k=p.id;
    const e=map.get(k)||{pid:k,name:p.name,urdu:p.urdu||'',unit:unitOf(t),color:p.color,tone:tone(p.color),icon:p.icon,qty:0,amount:0,n:0,rates:new Set()};
    e.qty=money(e.qty+num(t.qty)); e.amount=money(e.amount+num(t.amount)); e.n++;
    if(num(t.rate)>0) e.rates.add(money(num(t.rate)));
    map.set(k,e);
  });
  return [...map.values()]
    .map(e=>({...e, rate:e.rates.size===1?[...e.rates][0]:null, mixed:e.rates.size>1}))
    .sort((a,b)=>b.amount-a.amount);
}

function waBillText(c){
  const b=balanceOf(c.id);
  const m=mkKey(), mine=txOf(c.id).filter(t=>mkKey(t.date)===m);
  const items=itemBreakdown(mine);
  const mp=money(mine.filter(t=>t.type==='pay').reduce((s,t)=>s+num(t.amount),0));
  const total=money(items.reduce((s,i)=>s+i.amount,0));
  return [
    `*${SHOP.name}*`,
    `${monthLbl(m)} — ${c.name}`,
    ``,
    ...(items.length?items.map(i=>`${i.name}: ${Qty(i.qty,i.unit)}${i.rate?` × ${PKR(i.rate)}`:''} = ${PKR(i.amount)}`):['Is mahine koi item nahi.']),
    ...(items.length>1?[`*Total maal: ${PKR(total)}*`]:[]),
    `Wasool: ${PKR(mp)}`,
    b>0?`*Baqaya udhaar: ${PKR(b)}*`:b<0?`*Advance jama: ${PKR(-b)}*`:`*Hisaab clear — shukriya!*`,
    ``,
    `☎ ${SHOP.phone}`
  ].join('\n');
}

/* ── v19: the glass highlight under the tabs ──
   It slides to the new tab, stretching mid-way and settling with a small
   wobble, like the iPhone's liquid-glass tab bar. Holding the bar and
   sliding a finger across it drags the glass along; letting go opens the
   tab under the finger. */
let _tabAt=-1, _tabS0=0;
function moveTabInd(ti,o={}){
  const ind=document.getElementById('tabInd'), bar=document.getElementById('tabBar');
  if(!ind) return;
  const from=_tabAt; _tabAt=ti;
  const to=`translateX(${ti*100}%)`;
  ind.style.transform=to;
  if(from<0||from===ti||!ind.animate||!bar||bar.style.display==='none') return;
  const dist=Math.abs(ti-from), dir=ti>from?1:-1, s0=o.s0||_tabS0||1;
  _tabS0=0;
  const st=Math.min(1+0.2*dist,1.7);
  ind.getAnimations().forEach(a=>a.cancel());
  ind.animate([
    {transform:`translateX(${from*100}%) scale(${s0},${s0})`},
    {transform:`translateX(${(from+(ti-from)*0.5)*100}%) scale(${st},.84)`,offset:.4},
    {transform:`translateX(${(ti+dir*0.05)*100}%) scale(.95,1.07)`,offset:.76},
    {transform:to}
  ],{duration:Math.min(520+dist*45,700),easing:'cubic-bezier(.3,.7,.2,1)'});
}
(function tabDrag(){
  const bar=document.getElementById('tabBar'), ind=document.getElementById('tabInd');
  if(!bar||!ind) return;
  let pid=null, x0=0, dragging=false, left=0, w=1, pos=0, block=false;
  const btns=()=>[...bar.querySelectorAll('.nav-btn')];
  bar.addEventListener('pointerdown',e=>{
    pid=e.pointerId; x0=e.clientX; dragging=false;
    const r=bar.getBoundingClientRect(); left=r.left+5; w=(r.width-10)/5;
  });
  bar.addEventListener('pointermove',e=>{
    if(e.pointerId!==pid) return;
    if(!dragging){
      if(Math.abs(e.clientX-x0)<10) return;
      dragging=true;
      try{ bar.setPointerCapture(pid); }catch{}
      ind.getAnimations().forEach(a=>a.cancel());
      ind.classList.add('lift');
    }
    pos=Math.max(0,Math.min(4,(e.clientX-left)/w-0.5));
    ind.style.transform=`translateX(${pos*100}%) scale(1.12,1.1)`;
    const k=Math.round(pos);
    btns().forEach((b,i)=>b.style.color=i===k?'var(--a-700)':'');
  });
  const end=e=>{
    if(e.pointerId!==pid) return;
    pid=null;
    if(!dragging) return;
    dragging=false; block=true; setTimeout(()=>block=false,60);
    ind.classList.remove('lift');
    btns().forEach(b=>b.style.color='');
    const k=Math.round(pos);
    _tabAt=pos; _tabS0=1.12;                      // settle from where the finger left it
    if(TAB_ORDER[k]===cur) moveTabInd(k);
    else nav(TAB_ORDER[k]);
  };
  bar.addEventListener('pointerup',end);
  bar.addEventListener('pointercancel',end);
  /* a slide is not also a tap on whichever tab it ended over */
  bar.addEventListener('click',e=>{ if(block){ e.stopPropagation(); e.preventDefault(); } },true);
})();

/* ── Shared chart helpers ──
   The same building blocks RAMS Electric uses: a 270° gauge, twin bars,
   and numbers that count up when a screen opens. */
const G_R=44, G_ARC=2*Math.PI*G_R*0.75;
function gaugeSVG(frac){
  const f=Math.max(0,Math.min(1,num(frac)));
  return `<svg viewBox="0 0 120 120" aria-hidden="true">
    <circle class="trk" cx="60" cy="60" r="${G_R}" stroke-dasharray="${G_ARC.toFixed(1)} 999"/>
    <circle class="prg" cx="60" cy="60" r="${G_R}" stroke-dasharray="0 999" data-arc="${(G_ARC*f).toFixed(1)}"/></svg>`;
}
const calmMotion=()=>{ try{ return matchMedia('(prefers-reduced-motion:reduce)').matches; }catch{ return false; } };
function countUp(el){
  const to=num(el.dataset.count), kind=el.dataset.fmt||'pkr';
  const f=v=>kind==='pkr'?PKR(v):kind==='pct'?Math.round(v)+'%':kind==='int'?String(Math.round(v)):Qnum(v);
  if(calmMotion()||!to){ el.textContent=f(to); return; }
  const t0=performance.now(), dur=900;
  const step=now=>{
    const p=Math.min(1,(now-t0)/dur), e=1-Math.pow(1-p,4);
    el.textContent=f(p<1?(kind==='qty'?Math.round(to*e*10)/10:Math.round(to*e)):to);
    if(p<1&&el.isConnected) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}
/* Starts every animated piece inside a freshly rendered block. */
/* Money is never cut off with "…". A figure too wide for its box is set
   a little smaller until the whole number shows. */
function fitNums(root){
  root.querySelectorAll('.head,.hero .big,.strip .v,.msplit .v,.stat .v').forEach(el=>{
    el.style.fontSize='';
    if(!el.clientWidth) return;
    let fs=parseFloat(getComputedStyle(el).fontSize)||16, n=0;
    while(el.scrollWidth>el.clientWidth+0.5 && fs>10 && n++<30){ fs-=1; el.style.fontSize=fs+'px'; }
  });
}
function kick(root){
  if(!root) return;
  try{ fitNums(root); }catch(e){ console.warn('[FIT]',e); }
  root.querySelectorAll('img[data-logo]').forEach(i=>{ if(!i.src) i.src=LOGO; });
  root.querySelectorAll('[data-count]').forEach(countUp);
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    root.querySelectorAll('[data-arc]').forEach(c=>{ c.style.strokeDasharray=c.dataset.arc+' 999'; });

    root.querySelectorAll('[data-w]').forEach(b=>{ b.style.width=b.dataset.w+'%'; });

}

/* Sales and collections per day / per month — shop-wide, or one customer. */
function ledgerBuckets(keyOf,cid){
  const ids=new Set(alive().map(c=>c.id));
  const map={};
  transactions.forEach(t=>{
    if(!isLive(t)||!t.date) return;
    if(cid?t.cid!==cid:!ids.has(t.cid)) return;
    const k=keyOf(t.date), e=map[k]||(map[k]={s:0,p:0});
    if(isSale(t)) e.s+=num(t.amount); else if(t.type==='pay') e.p+=num(t.amount);
  });
  return map;
}
function seriesDays(n,cid){
  const map=ledgerBuckets(d=>d,cid), base=parseD(today()), out=[];
  for(let i=n-1;i>=0;i--){
    const d=new Date(base); d.setDate(d.getDate()-i);
    const k=ymd(d), e=map[k]||{s:0,p:0};
    out.push({key:k, s:money(e.s), p:money(e.p), full:fmtMini(k),
      lab:n<=7?d.toLocaleDateString('en-GB',{weekday:'short'}):(i%5===0?String(d.getDate()):'')});
  }
  return out;
}
function seriesMonths(n,cid,endYm){
  const map=ledgerBuckets(mkKey,cid), out=[];
  const [y,m]=(endYm||mkKey()).split('-').map(Number);
  for(let i=n-1;i>=0;i--){
    const d=new Date(y,m-1-i,1), k=mkKey(ymd(d)), e=map[k]||{s:0,p:0};
    out.push({key:k, s:money(e.s), p:money(e.p), full:monthLbl(k), lab:d.toLocaleDateString('en-GB',{month:'short'})});
  }
  return out;
}
/* Twin bars: terracotta is what was billed, sage is what came in. */
function barsHTML(data,o={}){
  const mx=Math.max(1,...data.map(d=>Math.max(d.s,d.p)));
  return `<div class="bars${data.length>14?' dense':''}"${o.id?` id="${o.id}"`:''}>
    ${data.map((d,i)=>`<div class="bcol${o.sel===d.key?' sel':''}" data-i="${i}" ${o.tap?`onclick="${o.tap}(${i})"`:''}>
      <div class="bwrap">
        <div class="bar a" data-h="${(d.s/mx*100).toFixed(1)}"${d.s?'':' style="opacity:.3"'}></div>
        <div class="bar b" data-h="${(d.p/mx*100).toFixed(1)}"${d.p?'':' style="opacity:.3"'}></div>
      </div><div class="blab">${d.lab}</div></div>`).join('')}
  </div>`;
}

function renderCyc(){
  const el=document.getElementById('cycChip'); if(!el) return;
  const now=parseD(today()), y=now.getFullYear(), m=now.getMonth();
  const dim=new Date(y,m+1,0).getDate(), day=now.getDate(), left=dim-day;

/* ── Custom animated doughnut (no external chart lib) ── */
/* The canvas cannot read var(--x), so theme colours are resolved here. */
const cssVar=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim()||'#888';

function switchPie(m){
  _pieMode=m;
  [['pTabBal','bal'],['pTabMon','month'],['pTabItm','items']].forEach(([id,k])=>{
    const b=document.getElementById(id); if(b) b.classList.toggle('on',m===k);
  });

  if(sub) sub.textContent = m==='bal'?'Outstanding balances'
    : m==='items'?'Item-wise sales, '+monthLbl(mkKey())
    : monthLbl(mkKey());

function pieData(mode){
  if(mode==='items'){
    const m=mkKey();
    const ids=new Set(alive().map(c=>c.id));
    const items=itemBreakdown(transactions.filter(t=>isLive(t)&&ids.has(t.cid)&&mkKey(t.date)===m));
    const total=money(items.reduce((s,i)=>s+i.amount,0));
    /* Beyond four slices the legend is taller than the chart, so the tail is
       rolled into one row rather than pushing the card off screen. */
    const top=items.slice(0,4), rest=items.slice(4);
    const segs=top.map(i=>({label:`${esc(i.name)} ${Qty(i.qty,i.unit)}`, val:i.amount, color:i.tone}));
    if(rest.length) segs.push({label:`+${rest.length} more items`, val:money(rest.reduce((s,i)=>s+i.amount,0)), color:cssVar('--n-400')});
    return { segs, centerVal:PKR(total), centerLbl:'Month sales' };
  }
  if(mode==='month'){
    const m=mkKey();
    const milk=sumWhere(x=>isSale(x)&&mkKey(x.date)===m);
    const paid=sumWhere(x=>x.type==='pay'&&mkKey(x.date)===m);
    return { segs:[
        {label:'Sales billed', val:milk, color:cssVar('--c-accent')},
        {label:'Received',     val:paid, color:cssVar('--c-accent-2')} ],
      centerVal:PKR(milk), centerLbl:'Sales billed' };
  }
  let due=0,adv=0;
  alive().forEach(c=>{ const b=balanceOf(c.id); b>0?due+=b:adv+=-b; });
  return { segs:[
      {label:'Udhaar (due)',    val:due, color:cssVar('--c-alert')},
      {label:'Advance (jama)',  val:adv, color:cssVar('--c-accent-2')} ],
    centerVal:PKR(due), centerLbl:'Total udhaar' };
}

function drawPie(mode){
  const cv=document.getElementById('dashPie'); if(!cv) return;
  if(_pieRAF){ cancelAnimationFrame(_pieRAF); _pieRAF=null; }
  const data=pieData(mode);
  const total=data.segs.reduce((s,x)=>s+x.val,0);

  // Legend
  const leg=document.getElementById('pieLegend');
  if(leg) leg.innerHTML=data.segs.map((s,i)=>{
    const pct=total>0?Math.round(s.val/total*100):0;
    return `<div class="pie-leg-row">
      <span class="pie-dot" style="background:${s.color}"></span>
      <span style="flex:1;min-width:0">
        <span style="display:block;color:var(--ink);font-size:13px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${s.label}</span>
        <span class="tnum" style="display:block;color:var(--sub);font-size:12.5px;margin-top:1px;white-space:nowrap">${PKR(s.val)}, ${pct}%</span>
      </span>
    </div>`;
  }).join('');

  // Center label
  const ctr=document.getElementById('pieCenter');
  if(ctr) ctr.innerHTML = total>0
    ? `<span class="display" style="color:var(--ink);font-size:17px;line-height:1.05;max-width:104px;overflow:hidden;text-overflow:ellipsis">${data.centerVal}</span>
       <span style="color:var(--n-600);font-size:8.5px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;margin-top:5px">${data.centerLbl}</span>`
    : `<span style="color:var(--sub);font-size:12.5px;font-weight:500">No data yet</span>`;

  // HiDPI canvas
  const dpr=Math.max(1,window.devicePixelRatio||1), size=150;
  cv.width=size*dpr; cv.height=size*dpr;
  const ctx=cv.getContext('2d'); ctx.setTransform(dpr,0,0,dpr,0,0);
  const cx=size/2, cy=size/2, thick=15, r=size/2-4-thick/2;
  const trackClr=cssVar('--n-300');
  const track=()=>{ ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.lineWidth=thick; ctx.lineCap='butt'; ctx.strokeStyle=trackClr; ctx.stroke(); };

  if(total<=0){ ctx.clearRect(0,0,size,size); track(); return; }

  const nz=data.segs.filter(s=>s.val>0).length;
  const start=-Math.PI/2, dur=700, t0=performance.now();
  const ease=t=>1-Math.pow(1-t,3);
  function frame(now){
    const p=Math.min(1,(now-t0)/dur), e=ease(p);
    ctx.clearRect(0,0,size,size); track();
    let a=start;
    data.segs.forEach(s=>{
      if(s.val<=0) return;
      const sweep=(s.val/total)*Math.PI*2*e;
      const g=nz>1?Math.min(0.085,sweep/2.4):0;
      ctx.beginPath();
      ctx.arc(cx,cy,r,a+g,a+sweep-g);
      ctx.lineWidth=thick; ctx.lineCap=nz>1?'round':'butt'; ctx.strokeStyle=s.color; ctx.stroke();
      a+=sweep;
    });
    if(p<1) _pieRAF=requestAnimationFrame(frame);
  }
  _pieRAF=requestAnimationFrame(frame);
}

/* ────────────────────────────────────────
   4b. DAILY ROUND — one screen for the whole delivery
   Entering the day's milk customer-by-customer meant opening a profile,
   a sheet, and navigating back for every single house. Here the round is
   one list: quantities are pre-filled from each customer's daily figure and
   the whole day is committed in a single write.
──────────────────────────────────────── */
let _roundDate=today(), _roundQ='', _roundPid='milk';
/* v17: an app left open overnight kept yesterday's date on the round and
   billed the morning delivery to the wrong day. Unless a date was picked by
   hand, the round always follows today. */
let _roundPicked=false;
const roundDateNow=()=>{ if(!_roundPicked||_roundDate>today()) _roundDate=today(); return _roundDate; };

/* Which item the round is currently being run for. Falls back to the first
   active item so an emptied catalogue can never blank the screen. */
function roundProd(){
  return prodBy(_roundPid)||liveProds()[0]||products[0]||{id:'milk',name:'Milk',unit:'L',rate:0,color:'#C67139',icon:'fa-mug-hot'};
}
function setRoundPid(pid){ _roundPid=pid; renderRound(); }

function renderRound(){
  clearFab();
  const el=S('round');
  if(!alive().length){
    el.innerHTML=`<div style="padding:24px">${emptyState('fa-truck-fast','No customers yet','Add customers first — the daily round then fills itself in.')}</div>`;
    return;
  }
  if(!liveProds().length){
    el.innerHTML=`<div style="padding:24px">${emptyState('fa-tags','No items switched on','Turn an item on from the Items tab, then run the round.',{label:'Open items',icon:'fa-tags',fn:"nav('items')"})}</div>`;
    return;
  }
  const P=roundProd(); _roundPid=P.id; roundDateNow();
  el.innerHTML=`
  <div style="padding:2px 16px 0">
    <div style="display:flex;align-items:center;justify-content:space-between;gap:12px">

      <input id="roundDate" class="pick" type="date" value="${_roundDate}" max="${today()}" onchange="_roundDate=this.value||today();_roundPicked=_roundDate!==today();renderRound()">
    </div>

    <!-- Which item is being delivered on this pass -->
    <div class="hscroll" style="display:flex;gap:8px;overflow-x:auto;margin:14px -16px 0;padding:0 16px 2px">
      ${liveProds().map(p=>{
        const on=p.id===P.id;

        return `<button class="chip" data-rchip="${p.id}" onclick="setRoundPid('${p.id}')"
          style="border-color:${on?pc:'var(--border2)'};background:${on?pc:'transparent'};color:${on?'#fbf3e4':'var(--ink2)'}">
          <i class="fa-solid ${p.icon}" style="font-size:13px;color:${on?'#fbf3e4':pc}"></i>${esc(p.name)}

      Shop rate <b style="color:var(--ink)">${PKR(P.rate)}/${P.unit}</b>. A customer's own rate is used where one is set.
    </p>

    <div class="searchbar" style="margin:12px 0">
      <i class="fa-solid fa-magnifying-glass"></i>
      <input class="field" placeholder="Search customer" value="${esc(_roundQ)}" oninput="_roundQ=this.value;paintRound()">
    </div>
  </div>

  <div id="roundList" class="seglist" style="margin:0 16px"></div>

  <!-- Sticky summary + commit -->
  <div style="position:sticky;bottom:calc(var(--bar-h) + var(--sab) + 8px);z-index:2;margin:16px 16px 0;padding:14px 16px;background:var(--a-100);border-radius:var(--r-card);box-shadow:var(--shadow-lg)">
    <div id="roundTotals" style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;padding:0 4px"></div>

    </button>

/* Rows the round is currently offering, in delivery-list order. */
function roundRows(){
  const q=_roundQ.trim().toLowerCase();
  const pid=roundProd().id;
  return alive()
    .filter(c=>!q||c.name.toLowerCase().includes(q)||(c.phone||'').includes(q))
    .sort((a,b)=>a.name.localeCompare(b.name))
    .map(c=>({c, done:qtyOn(c.id,_roundDate,pid), leave:onLeave(c,_roundDate)}));
}

function paintRound(){
  const box=document.getElementById('roundList'); if(!box) return;
  const P=roundProd();
  const rows=roundRows();
  if(!rows.length){
    box.innerHTML=`<div class="row" style="justify-content:center;color:var(--sub);font-size:14px">No matching customer</div>`;
    roundRecalc(); return;
  }
  box.innerHTML=rows.map(({c,done,leave},i)=>{
    /* Anyone already served today starts blank, so running the round twice
       cannot quietly bill the same delivery again. Only milk carries a standing
       daily quantity — ghee and khoya are asked for, not delivered on repeat. */
    const std=P.id==='milk'?(c.defaultQty||''):'';
    const pre=(leave||done>0)?'':std;
    const rate=rateFor(c,P.id);
    const badge=leave
      ? `<span class="badge" style="background:var(--goldbg);color:var(--gold)">Chhutti</span>`
      : done>0
        ? `<span class="badge" style="background:var(--jamabg);color:var(--jama)">✓ ${Qty(done,P.unit)} done</span>`
        : '';
    return `<div class="row" style="${leave?'opacity:.55':''}">
      <button class="avatar" onclick="openProfile('${c.id}')" style="width:40px;height:40px;font-size:14px;${avClr(c.name)}">${esc(inits(c.name))}</button>
      <span style="flex:1;min-width:0">
        <span style="display:block;font-weight:600;font-size:14px;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(c.name)}</span>
        <span style="display:block;font-size:12px;color:var(--sub);margin-top:2px">${PKR(rate)}/${P.unit} ${badge}</span>
      </span>
      <span style="text-align:right;flex-shrink:0;min-width:82px">
        <span class="tnum" id="ra_${c.id}" style="display:block;font-size:12.5px;color:var(--sub);font-weight:600;margin-bottom:3px">—</span>
        <span style="display:flex;align-items:center;gap:4px">
          <input id="rq_${c.id}" data-rq="${c.id}" type="number" inputmode="decimal" step="${P.unit==='pcs'||P.unit==='dozen'?'1':'0.25'}" min="0"
            class="field mono" value="${pre}" placeholder="0" ${leave?'disabled':''}
            style="width:66px;text-align:center;font-size:16px;font-weight:700;padding:8px 4px"
            oninput="roundRecalc()">
          <span style="font-size:12px;font-weight:700;color:var(--sub)">${P.unit}</span>
        </span>
      </span>
    </div>`;
  }).join('');
  roundRecalc();
}

/* Reads every quantity box and keeps the per-row amount and the footer in
   step, so the figure on the Save button is the figure that gets written. */
function roundCollect(){
  const pid=roundProd().id;
  const out=[];
  document.querySelectorAll('[data-rq]').forEach(inp=>{
    const c=custBy(inp.dataset.rq); if(!c||inp.disabled) return;
    const qty=money(num(inp.value));
    const rate=rateFor(c,pid);
    if(qty>0) out.push({c,qty,rate,amount:money(qty*rate)});
  });
  return out;
}

function roundRecalc(){
  const picked=roundCollect();
  const byId={}; picked.forEach(p=>byId[p.c.id]=p);
  document.querySelectorAll('[data-rq]').forEach(inp=>{
    const cell=document.getElementById('ra_'+inp.dataset.rq);
    if(cell) cell.textContent=byId[inp.dataset.rq]?PKR(byId[inp.dataset.rq].amount):'—';
  });
  const lt=money(picked.reduce((s,p)=>s+p.qty,0));
  const amt=money(picked.reduce((s,p)=>s+p.amount,0));
  const tot=document.getElementById('roundTotals');
  if(tot) tot.innerHTML=`
    <span style="font-size:12.5px;color:var(--sub);font-weight:500;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">
      <b style="color:var(--ink);font-size:14px">${picked.length}</b> customer${picked.length===1?'':'s'} · <b style="color:var(--ink)">${Qty(lt,roundProd().unit)}</b>
    </span>
    <span class="tnum display" style="font-size:${String(PKR(amt)).length>13?17:22}px;color:var(--a-700);white-space:nowrap;flex:none;margin-left:10px">${PKR(amt)}</span>`;
  const btn=document.getElementById('roundSave');
  if(btn){
    const off=picked.length===0;
    btn.style.opacity=off?'.45':'1';
    btn.style.pointerEvents=off?'none':'auto';
  }
}

function confirmRound(){
  const before=_roundDate; roundDateNow();
  if(before!==_roundDate){ renderRound(); toast('Tareekh badal gayi thi — round ab aaj ('+fmtShort(_roundDate)+') ka hai. Dobara check kar ke save karein.','warn'); return; }
  const P=roundProd();
  const picked=roundCollect();
  if(!picked.length){ toast('Enter at least one quantity','err'); return; }
  if(_roundDate>today()){ toast('Future date not allowed','err'); return; }
  /* v17: a rate of 0 wrote Rs 0 sales that looked like real deliveries. */
  const free=picked.filter(p=>!(p.rate>0));
  if(free.length){ toast(`${free[0].c.name} ka ${P.name} rate 0 hai — Items mein rate set karein`,'err'); return; }
  const lt=money(picked.reduce((s,p)=>s+p.qty,0));
  const amt=money(picked.reduce((s,p)=>s+p.amount,0));
  const repeats=picked.filter(p=>qtyOn(p.c.id,_roundDate,P.id)>0);

  showConfirm(`
    <div style="text-align:center">
      <div style="width:56px;height:56px;border-radius:50%;background:var(--c-bg);display:grid;place-items:center;margin:0 auto 14px">
        <i class="fa-solid ${P.icon}" style="font-size:21px;color:${tone(P.color)}"></i>
      </div>
      <h3 class="display" style="font-size:21px;font-weight:600;color:var(--ink)">Save the ${esc(P.name)} round?</h3>
      <p style="color:var(--sub);font-size:13px;margin-top:7px">${fmtFull(_roundDate)}</p>
      <div style="background:var(--surface2);border-radius:16px;padding:13px 15px;margin-top:14px">
        <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:7px"><span style="color:var(--sub)">Customers</span><b style="color:var(--ink)">${picked.length}</b></div>
        <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:7px"><span style="color:var(--sub)">Total ${esc(P.name.toLowerCase())}</span><b style="color:var(--ink)">${Qty(lt,P.unit)}</b></div>
        <div style="height:1px;background:var(--border);margin-bottom:7px"></div>
        <div style="display:flex;justify-content:space-between;font-size:14px"><span style="color:var(--sub);font-weight:500">Total billed</span><b style="color:var(--udhaar);font-size:16px">${PKR(amt)}</b></div>
      </div>
      ${repeats.length?`<div style="background:var(--goldbg);border-radius:16px;padding:12px 14px;margin-top:12px;font-size:12.5px;color:var(--gold);text-align:left">
        <i class="fa-solid fa-triangle-exclamation" style="margin-right:6px"></i><b>${repeats.length}</b> of these already have ${esc(P.name.toLowerCase())} on this date:
        ${esc(repeats.slice(0,4).map(p=>p.c.name).join(', '))}${repeats.length>4?` +${repeats.length-4} more`:''}
      </div>`:''}
      <div style="display:flex;gap:10px;margin-top:18px">
        <button class="btn btn-neutral grow" onclick="closeConfirm()">Cancel</button>
        <button class="btn btn-filled grow" onclick="commitRound()">Save ${picked.length}</button>
      </div>
    </div>`);
}

let _roundSaving=false;

function commitRound(){
  if(_roundSaving) return;
  const P=roundProd();
  const picked=roundCollect();
  if(!picked.length){ closeConfirm(); return; }
  _roundSaving=true;
  try{
    /* One batch id per round so the whole delivery can be undone together
       rather than entry by entry. */
    const batch='b-'+Date.now().toString(36);
    const at=new Date().toISOString();
    picked.forEach(p=>transactions.push({
      id:uid(), cid:p.c.id, date:_roundDate, createdAt:at, batch,
      type:'sale', pid:P.id, qty:p.qty, unit:P.unit, rate:p.rate, amount:p.amount, delta:p.amount, note:P.name+' round'
    }));
    persist(); closeConfirm();
    const amt=money(picked.reduce((s,p)=>s+p.amount,0));
    toast(`${picked.length} entries saved · ${PKR(amt)}`,'ok',{label:'Undo',fn:()=>undoRound(batch)});
    renderRound();
  } finally {
    setTimeout(()=>{ _roundSaving=false; },500);
  }
}

function undoRound(batch){
  if(!batch) return;   // v18: never match every entry that simply has no batch
  const hit=transactions.filter(t=>t.batch===batch&&isLive(t));
  if(!hit.length){ toast('Nothing to undo','err'); return; }
  const at=new Date().toISOString();
  hit.forEach(t=>{ t.voided=true; t.voidedAt=at; });
  persist(); toast(`Round undone — ${hit.length} entries removed`,'ok');
  render(cur);
}
