<style>
/* ══════════════════════════════════════════
   DESIGN TOKENS — Light / Dark
══════════════════════════════════════════ */
:root {
  --bg:        #ECE3D0;
  --surface:   #FBF7EE;
  --surface2:  #F3EBD9;
  --border:    #E4D8BF;
  --border2:   #D3C2A0;
  --ink:       #2E1B10;
  --ink2:      #5B4632;
  --sub:       #957F63;
  --gold:      #BE8A2E;
  --gold2:     #E4B24A;
  --goldbg:    #FBF1D6;
  --udhaar:    #B23A2A;
  --udhaarbg:  #FBEAE4;
  --jama:      #1E8B4C;
  --jamabg:    #E7F5EC;
  --rust:      #8A3E23;
  --rust2:     #A54A28;
  --navy:      #3A2416;
  --navymid:   #4A2E1B;
  --brand-grad:linear-gradient(135deg,#2E1B0E 0%,#4A2C18 58%,#5E3A22 100%);
  --gold-grad: linear-gradient(135deg,#C8973A,#E8B84B);
  --shadow-sm: 0 1px 3px rgba(46,27,16,.08),0 1px 2px rgba(46,27,16,.05);
  --shadow:    0 4px 16px rgba(46,27,16,.10),0 1px 4px rgba(46,27,16,.06);
  --shadow-lg: 0 12px 40px rgba(46,27,16,.16),0 4px 12px rgba(46,27,16,.09);
  --r:         18px;
  --r-sm:      12px;
}
[data-theme="dark"] {
  --bg:       #17100A;
  --surface:  #211810;
  --surface2: #2C2118;
  --border:   #3A2C1F;
  --border2:  #4B3A29;
  --ink:      #F5EBDA;
  --ink2:     #D2C0A4;
  --sub:      #9A876C;
  --goldbg:   #241B0B;
  --udhaarbg: #241210;
  --jamabg:   #0E1C13;
  --shadow-sm:0 1px 3px rgba(0,0,0,.35),0 1px 2px rgba(0,0,0,.25);
  --shadow:   0 4px 16px rgba(0,0,0,.4),0 1px 4px rgba(0,0,0,.3);
  --shadow-lg:0 12px 40px rgba(0,0,0,.55),0 4px 12px rgba(0,0,0,.35);
}

*{-webkit-tap-highlight-color:transparent;box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overscroll-behavior:none;}
body{background:var(--bg);font-family:'Inter',system-ui,sans-serif;color:var(--ink);transition:background .3s,color .3s}

/* ── App shell ── */
#app{
  max-width:480px;margin:0 auto;height:100dvh;
  background:var(--surface);display:flex;flex-direction:column;
  position:relative;overflow:hidden;
  box-shadow:0 0 80px rgba(46,27,16,.18);
}
.scroll{overflow-y:auto;-webkit-overflow-scrolling:touch;scrollbar-width:thin;scrollbar-color:var(--border) transparent}
.scroll::-webkit-scrollbar{width:3px}
.scroll::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}

/* ── Typography ── */
.display{font-family:'Playfair Display',Georgia,serif}
.mono{font-family:'JetBrains Mono',monospace}
.tnum{font-variant-numeric:tabular-nums}

/* ── Animations ── */
@keyframes slideUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideRight{from{opacity:0;transform:translateX(-20px)}to{opacity:1;transform:translateX(0)}}
@keyframes sheetUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes popIn{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:scale(1)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}

.a-up{animation:slideUp .4s cubic-bezier(.16,.84,.44,1) both}
.a-right{animation:slideRight .35s cubic-bezier(.16,.84,.44,1) both}
.a-sheet{animation:sheetUp .36s cubic-bezier(.16,.84,.44,1) both}
.a-fade{animation:fadeIn .3s ease both}
.a-pop{animation:popIn .28s cubic-bezier(.16,.84,.44,1) both}

button,.tap{transition:all .2s cubic-bezier(.2,.7,.3,1);cursor:pointer;border:none;background:none}
button:active,.tap:active{transform:scale(.96)}

/* ── Form elements ── */
.field{
  width:100%;background:var(--surface2);border:1.5px solid var(--border);
  border-radius:var(--r-sm);padding:13px 15px;font-size:15px;font-family:'Inter',sans-serif;
  color:var(--ink);outline:none;transition:all .2s
}
.field:focus{border-color:var(--gold);background:var(--surface);box-shadow:0 0 0 4px rgba(200,151,58,.14)}
.field::placeholder{color:var(--sub)}
.label{font-size:11.5px;font-weight:700;color:var(--sub);letter-spacing:.06em;text-transform:uppercase;margin-bottom:8px;display:block}

/* ── Nav ── */
.nav-btn{display:flex;flex-direction:column;align-items:center;gap:3px;flex:1;padding:9px 0;color:var(--sub);border-radius:0}
.nav-btn[data-on="true"]{color:var(--gold)}
.nav-btn[data-on="true"] .ni{transform:translateY(-2px)}
.ni{font-size:18px;transition:transform .25s}

/* ── Chip / Badge ── */
.badge{font-size:10.5px;font-weight:800;padding:3px 9px;border-radius:999px;letter-spacing:.03em}

/* ── Modal backdrop ── */
.backdrop{
  position:fixed;inset:0;z-index:60;
  background:rgba(30,18,8,.55);backdrop-filter:blur(4px);
  display:flex;align-items:flex-end;justify-content:center;
}
.backdrop-center{align-items:center}
.modal-card{
  background:var(--surface);width:100%;max-width:480px;
  border-radius:28px 28px 0 0;max-height:92dvh;display:flex;flex-direction:column;overflow:hidden
}
.modal-center{border-radius:24px;max-height:88dvh;margin:0 12px}
[hidden]{display:none!important}

/* ── Receipt modal ── */
#receiptModal{
  position:fixed;inset:0;z-index:80;
  background:rgba(24,14,6,.85);backdrop-filter:blur(8px);
  display:flex;flex-direction:column;align-items:center;
}
#receiptModal.hidden{display:none!important}
#receiptInner{width:100%;max-width:480px;height:100%;display:flex;flex-direction:column;overflow:hidden}
#receiptScroll{flex:1;overflow-y:auto;padding:16px;-webkit-overflow-scrolling:touch}
#receiptScroll::-webkit-scrollbar{display:none}
#receiptActionBar{
  flex-shrink:0;padding:14px 16px;
  padding-bottom:calc(14px + env(safe-area-inset-bottom));
  background:var(--navymid);border-top:1px solid rgba(255,255,255,.08);
  display:grid;grid-template-columns:1fr 1fr;gap:10px
}

/* ── FAB ── */
.fab-btn{
  position:fixed;bottom:calc(80px + env(safe-area-inset-bottom));
  right:calc(50% - 224px);z-index:40;
  display:flex;align-items:center;gap:8px;
  padding:14px 20px;border-radius:999px;font-weight:800;font-size:14px;
  background:var(--gold-grad);color:#1a0e00;
  box-shadow:0 8px 24px -6px rgba(200,151,58,.65);
  letter-spacing:.01em
}

/* ── Cards ── */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow-sm)}
.card-nav{border-radius:14px;background:var(--surface2);border:1px solid var(--border);padding:12px 14px}

/* ── Divider ── */
.divider{height:1px;background:var(--border);margin:0 16px}

/* ── Section header ── */
.sec-head{display:flex;align-items:center;justify-content:space-between;padding:16px 16px 10px}

/* ── Status dot ── */
.dot-live{width:7px;height:7px;border-radius:50%;background:#22c55e;animation:pulse 2s infinite}

/* ── Theme toggle icon ── */
.theme-ic-light{display:none}
.theme-ic-dark{display:block}
[data-theme="dark"] .theme-ic-light{display:block}
[data-theme="dark"] .theme-ic-dark{display:none}

/* ── Offline banner ── */
#offlineBanner{
  position:fixed;top:0;left:50%;transform:translateX(-50%);
  width:100%;max-width:480px;z-index:100;
  background:var(--rust);color:#fff;font-size:11.5px;font-weight:700;
  text-align:center;padding:7px 12px;display:none;letter-spacing:.04em
}

/* ── Brand logo ── */
.brand-logo{width:40px;height:40px;border-radius:12px;object-fit:contain;flex-shrink:0;
  background:rgba(255,255,255,.92);padding:3px;box-shadow:0 4px 12px rgba(46,27,16,.28)}

/* ── Pie / doughnut chart ── */
.pie-wrap{position:relative;width:158px;height:158px;flex-shrink:0}
.pie-wrap canvas{width:100%;height:100%;display:block}
.pie-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;text-align:center}
.pie-legend{display:flex;flex-direction:column;gap:9px;flex:1;min-width:0}
.pie-leg-row{display:flex;align-items:center;gap:9px;animation:slideRight .4s cubic-bezier(.16,.84,.44,1) both}
.pie-dot{width:11px;height:11px;border-radius:4px;flex-shrink:0}
@keyframes segPop{from{opacity:0;transform:scale(.5)}to{opacity:1;transform:scale(1)}}
</style>
</head>
<body>

<div id="offlineBanner"><i class="fa-solid fa-wifi-slash" style="margin-right:6px"></i>OFFLINE MODE — All data is safe locally</div>

<div id="app">

  <!-- ══ TOPBAR ══ -->
  <header style="background:var(--brand-grad);flex-shrink:0;padding:env(safe-area-inset-top) 0 0">
    <div style="padding:14px 18px 14px;display:flex;align-items:center;justify-content:space-between;gap:12px">
      <div style="display:flex;align-items:center;gap:11px;min-width:0">
        <button id="backBtn" onclick="goBack()" hidden
          style="width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.1);color:#fff;display:grid;place-items:center;flex-shrink:0">
          <i class="fa-solid fa-arrow-left" style="font-size:14px"></i>
        </button>
        <img id="brandLogo" class="brand-logo" alt="Rana Ahmad Milk Shop"/>
        <div style="min-width:0">
          <h1 id="topTitle" class="display" style="color:#fff;font-size:16px;font-weight:700;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">Rana Ahmad Milk Shop</h1>
          <p id="topSub" style="color:var(--gold2);font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;margin-top:2px">Est. 1970 · Digital Khata</p>
        </div>
      </div>
      <div id="topActions" style="display:flex;align-items:center;gap:8px;flex-shrink:0">
        <button onclick="toggleTheme()" title="Toggle theme"
          style="width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.1);color:#fff;display:grid;place-items:center">
          <i class="fa-solid fa-moon theme-ic-dark" style="font-size:14px"></i>
          <i class="fa-solid fa-sun theme-ic-light" style="font-size:14px"></i>
        </button>
        <button onclick="doBackup()" title="Backup"
          style="width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.1);color:#fff;display:grid;place-items:center">
          <i class="fa-solid fa-cloud-arrow-down" style="font-size:14px"></i>
        </button>
        <label title="Restore" style="width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.1);color:#fff;display:grid;place-items:center;cursor:pointer">
          <i class="fa-solid fa-cloud-arrow-up" style="font-size:14px"></i>
          <input type="file" accept="application/json" style="display:none" onchange="doRestore(event)">
        </label>
      </div>
    </div>

    <!-- Tab bar -->
    <div id="tabBar" style="display:flex;border-top:1px solid rgba(255,255,255,.08);padding:0 4px">
      <button class="nav-btn" data-nav="home"      onclick="nav('home')">
        <span class="ni"><i class="fa-solid fa-chart-pie"></i></span>
        <span style="font-size:10px;font-weight:700">Dashboard</span>
      </button>
      <button class="nav-btn" data-nav="customers" onclick="nav('customers')">
        <span class="ni"><i class="fa-solid fa-users"></i></span>
        <span style="font-size:10px;font-weight:700">Customers</span>
      </button>
      <button class="nav-btn" data-nav="reports"   onclick="nav('reports')">
        <span class="ni"><i class="fa-solid fa-receipt"></i></span>
        <span style="font-size:10px;font-weight:700">Reports</span>
      </button>
    </div>
  </header>

  <!-- ══ SCREENS ══ -->
  <main style="flex:1;min-height:0;position:relative">
    <div data-screen="home"      style="position:absolute;inset:0" class="scroll" hidden></div>
    <div data-screen="customers" style="position:absolute;inset:0" class="scroll" hidden></div>
    <div data-screen="reports"   style="position:absolute;inset:0" class="scroll" hidden></div>
    <div data-screen="profile"   style="position:absolute;inset:0" class="scroll" hidden></div>
  </main>

  <!-- ══ BOTTOM SHEET ══ -->
  <div id="sheetRoot" class="backdrop" hidden>
    <div id="sheetCard" class="modal-card a-sheet"></div>
  </div>

  <!-- ══ CONFIRM MODAL ══ -->
  <div id="confirmRoot" class="backdrop backdrop-center" hidden>
    <div id="confirmCard" class="modal-center a-pop" style="background:var(--surface);border-radius:24px;max-width:380px;width:calc(100% - 32px);padding:28px 24px"></div>
  </div>

</div><!-- /app -->

<!-- ══ RECEIPT PREVIEW MODAL ══ -->
<div id="receiptModal" class="hidden">
  <div id="receiptInner">
    <div style="background:var(--navymid);padding:14px 16px;padding-top:calc(14px + env(safe-area-inset-top));display:flex;align-items:center;gap:12px;flex-shrink:0">
      <button onclick="closeReceiptModal()"
        style="width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.1);color:#fff;display:grid;place-items:center;flex-shrink:0">
        <i class="fa-solid fa-xmark"></i>
      </button>
      <div style="flex:1;min-width:0">
        <div class="display" style="color:#fff;font-size:15px;font-weight:700">Receipt Preview</div>
        <div style="color:var(--gold2);font-size:9.5px;letter-spacing:.15em;text-transform:uppercase;margin-top:2px">Review before downloading</div>
      </div>
      <div style="display:flex;align-items:center;gap:5px">
        <div class="dot-live"></div>
        <span style="color:rgba(255,255,255,.5);font-size:11px">Live</span>
      </div>
    </div>
    <div id="receiptScroll">
      <div id="receiptPreviewWrap" style="border-radius:16px;overflow:hidden;box-shadow:0 8px 40px rgba(0,0,0,.35)"></div>
    </div>
    <div id="receiptActionBar">
      <button id="btnDlPng" onclick="receiptDownload('png')"
        style="padding:14px;border-radius:14px;font-weight:800;font-size:14px;color:#fff;background:linear-gradient(135deg,#059669,#047857);display:flex;align-items:center;justify-content:center;gap:8px;letter-spacing:.01em">
        <i class="fa-brands fa-whatsapp"></i> Save PNG
      </button>
      <button id="btnDlPdf" onclick="receiptDownload('pdf')"
        style="padding:14px;border-radius:14px;font-weight:800;font-size:14px;color:#1a0e00;background:var(--gold-grad);display:flex;align-items:center;justify-content:center;gap:8px;letter-spacing:.01em">
        <i class="fa-solid fa-file-pdf"></i> Save PDF
      </button>
    </div>
  </div>
</div>

<!-- Toast container -->
<div id="toastBox" style="position:fixed;left:50%;transform:translateX(-50%);bottom:90px;z-index:90;display:flex;flex-direction:column;gap:8px;width:88%;max-width:420px;pointer-events:none"></div>

<!-- Export stage (off-screen render) -->
<div id="exportStage" style="position:fixed;left:-9999px;top:0;width:620px"></div>

const loadArr = (k)=>{ try{ const v=JSON.parse(localStorage.getItem(k)); return Array.isArray(v)?v:[]; }catch{ return []; }};
const saveKey = (k,v)=>{ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){ console.warn('[STORAGE]',e); }};

let customers    = loadArr(KEYS.c);
let transactions = loadArr(KEYS.t);
const persist    = ()=>{ saveKey(KEYS.c, customers); saveKey(KEYS.t, transactions); };

/* ── Utils ── */
const uid    = ()=>'id-'+Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const txnId  = ()=>'TXN-'+new Date().getFullYear()+'-'+Math.random().toString(36).slice(2,6).toUpperCase();
const today  = ()=>new Date().toLocaleDateString('en-CA');
const mkKey  = d=>(d||today()).slice(0,7);
const num    = n=>Number(n)||0;
const PKR    = n=>'Rs '+Math.round(num(n)).toLocaleString('en-PK');
const Litr   = n=>(num(n)%1===0?num(n):num(n).toFixed(2))+' L';
const esc    = s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const inits  = n=>(n||'?').trim().split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase();

/* ── Date formatting with Day-of-Week ── */
const D_FULL  = {weekday:'long', day:'2-digit', month:'long', year:'numeric'};
const D_SHORT = {weekday:'short',day:'2-digit', month:'short',year:'numeric'};
const D_MINI  = {weekday:'short',day:'2-digit', month:'short'};
const parseD  = d=>{ const x=new Date(d+'T00:00:00'); return isNaN(x)?null:x; };
const fmtFull = d=>{ const x=parseD(d); return x?x.toLocaleDateString('en-GB',D_FULL):d; };
const fmtShort= d=>{ const x=parseD(d); return x?x.toLocaleDateString('en-GB',D_SHORT):d; };
const fmtMini = d=>{ const x=parseD(d); return x?x.toLocaleDateString('en-GB',D_MINI):d; };
const fmtTime = ()=>new Date().toLocaleTimeString('en-PK',{hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:true});
const monthLbl= ym=>{ const[y,m]=ym.split('-'); return new Date(+y,+m-1,1).toLocaleDateString('en-GB',{month:'long',year:'numeric'}); };

/* ── Ledger math ── */
const alive      = ()=>customers.filter(c=>!c.deleted);
const txOf       = id=>transactions.filter(t=>t.cid===id&&!t.reversed);
const balanceOf  = id=>txOf(id).reduce((s,t)=>s+num(t.delta),0);
const custBy     = id=>customers.find(c=>c.id===id);
const sumWhere   = p=>transactions.filter(t=>!t.reversed&&p(t)).reduce((s,t)=>s+num(t.amount),0);

/* ── Balance display helper ── */
function balTag(b){
  if(b>0) return {txt:PKR(b),  lbl:'Udhaar',  cls:'udhaar', bg:'var(--udhaarbg)', fg:'var(--udhaar)'};
  if(b<0) return {txt:PKR(-b), lbl:'Advance',  cls:'jama',   bg:'var(--jamabg)',   fg:'var(--jama)'};
  return       {txt:'Rs 0',   lbl:'Clear',    cls:'sub',    bg:'var(--surface2)', fg:'var(--sub)'};
}

(function initTheme(){
  const t=localStorage.getItem(KEYS.theme)||'light';
  document.documentElement.setAttribute('data-theme',t);
  document.getElementById('themeColorMeta').content = t==='dark'?'#17100A':'#2E1B0E';
})();

function toggleTheme(){
  const next=document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark';
  document.documentElement.setAttribute('data-theme',next);
  localStorage.setItem(KEYS.theme,next);
  document.getElementById('themeColorMeta').content=next==='dark'?'#17100A':'#2E1B0E';
}

──────────────────────────────────────── */
let cur='home', profId=null, navStack=[];
let _closeTimer=null;

function nav(scr,opts={}){
  if(scr!=='profile') navStack=[];
  cur=scr;
  document.querySelectorAll('[data-screen]').forEach(s=>s.hidden=(s.dataset.screen!==scr));
  document.querySelectorAll('.nav-btn').forEach(b=>b.dataset.on=(b.dataset.nav===scr));
  document.getElementById('tabBar').style.display=scr==='profile'?'none':'flex';
  const back=document.getElementById('backBtn');
  const acts=document.getElementById('topActions');
  back.hidden=scr!=='profile';
  acts.style.display=scr==='profile'?'none':'flex';
  document.getElementById('topTitle').textContent=scr==='profile'?(custBy(profId)?.name||'Customer'):SHOP.name;
  document.getElementById('topSub').textContent=scr==='profile'?'Account Ledger':'Est. 1970  ';
  render(scr);
}
function openProfile(id){ profId=id; navStack.push(cur==='profile'?'customers':cur); nav('profile'); }
function goBack(){ nav(navStack.pop()||'customers'); }
function render(s){ ({home:renderHome,customers:renderCusts,reports:renderReports,profile:renderProfile}[s]||noop)(); }
const noop=()=>{};

let _pieMode='bal', _pieRAF=null;

function renderHome(){
  const el=S('home');
  if(!customers.length){ el.innerHTML=emptyWelcome(); return; }

  let due=0,adv=0;
  alive().forEach(c=>{ const b=balanceOf(c.id); b>0?due+=b:adv+=-b; });
  const t=today(), m=mkKey();
  const todayMilk=sumWhere(x=>x.type==='milk'&&x.date===t);
  const todayPaid=sumWhere(x=>x.type==='pay'&&x.date===t);
  const monthMilk=sumWhere(x=>x.type==='milk'&&mkKey(x.date)===m);
  const monthPaid=sumWhere(x=>x.type==='pay'&&mkKey(x.date)===m);

  const recents=transactions.filter(x=>!x.reversed)
    .sort((a,b)=>(b.createdAt||'').localeCompare(a.createdAt||'')).slice(0,8);

  el.innerHTML=`
  <div style="padding:0 0 100px">

    <!-- Hero balance card -->
    <div class="a-up" style="margin:14px;border-radius:22px;padding:20px;background:var(--brand-grad);position:relative;overflow:hidden">

function switchPie(m){
  _pieMode=m;
  const on='border:none;border-radius:8px;padding:5px 12px;font-size:11px;font-weight:700;background:var(--gold-grad);color:#1a0e00;cursor:pointer';
  const off='border:none;border-radius:8px;padding:5px 12px;font-size:11px;font-weight:700;background:rgba(255,255,255,.1);color:rgba(255,255,255,.6);cursor:pointer';
  const b=document.getElementById('pTabBal'), o=document.getElementById('pTabMon');
  if(b&&o){ b.style.cssText=m==='bal'?on:off; o.style.cssText=m==='month'?on:off; }
  const sub=document.getElementById('pieSub');
  if(sub) sub.textContent = m==='bal'?'Outstanding balances':'This month · '+monthLbl(mkKey());
  drawPie(m);
}

function pieData(mode){
  if(mode==='month'){
    const m=mkKey();
    const milk=sumWhere(x=>x.type==='milk'&&mkKey(x.date)===m);
    const paid=sumWhere(x=>x.type==='pay'&&mkKey(x.date)===m);
    return { segs:[
        {label:'Milk Billed', val:milk, color:'#E4B24A'},
        {label:'Collected',   val:paid, color:'#5FD79B'} ],
      centerVal:PKR(milk), centerLbl:'Milk billed' };
  }
  let due=0,adv=0;
  alive().forEach(c=>{ const b=balanceOf(c.id); b>0?due+=b:adv+=-b; });
  return { segs:[
      {label:'Udhaar · Due',    val:due, color:'#E07B67'},
      {label:'Advance · Jama',  val:adv, color:'#5FD79B'} ],
    centerVal:PKR(due), centerLbl:'Total udhaar' };
}

function drawPie(mode){
  const cv=document.getElementById('dashPie'); if(!cv) return;
  if(_pieRAF){ cancelAnimationFrame(_pieRAF); _pieRAF=null; }
  const data=pieData(mode);
  const total=data.segs.reduce((s,x)=>s+x.val,0);

  // Legend
  const leg=document.getElementById('pieLegend');
  if(leg) leg.innerHTML=data.segs.map((s,i)=>{
    const pct=total>0?Math.round(s.val/total*100):0;
    return `<div class="pie-leg-row" style="animation-delay:${140+i*90}ms">
      <span class="pie-dot" style="background:${s.color}"></span>
      <span style="flex:1;min-width:0">
        <span style="display:block;color:rgba(255,255,255,.92);font-size:12.5px;font-weight:700">${s.label}</span>
        <span style="display:block;color:rgba(255,255,255,.5);font-size:10.5px">${pct}% of total</span>
      </span>
      <span class="tnum" style="color:#fff;font-size:12.5px;font-weight:800;white-space:nowrap">${PKR(s.val)}</span>
    </div>`;
  }).join('');

  // Center label
  const ctr=document.getElementById('pieCenter');
  if(ctr) ctr.innerHTML = total>0
    ? `<span class="display tnum" style="color:#fff;font-size:16px;font-weight:800;line-height:1.05;max-width:110px;overflow:hidden;text-overflow:ellipsis">${data.centerVal}</span>
       <span style="color:rgba(255,255,255,.5);font-size:8px;letter-spacing:.1em;text-transform:uppercase;margin-top:3px">${data.centerLbl}</span>`
    : `<span style="color:rgba(255,255,255,.5);font-size:11px;font-weight:600">No data yet</span>`;

  // HiDPI canvas
  const dpr=Math.max(1,window.devicePixelRatio||1), size=158;
  cv.width=size*dpr; cv.height=size*dpr;
  const ctx=cv.getContext('2d'); ctx.setTransform(dpr,0,0,dpr,0,0);
  const cx=size/2, cy=size/2, thick=20, r=size/2-6-thick/2;
  const track=()=>{ ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.lineWidth=thick; ctx.lineCap='butt'; ctx.strokeStyle='rgba(255,255,255,.08)'; ctx.stroke(); };

  if(total<=0){ ctx.clearRect(0,0,size,size); track(); return; }

  const nz=data.segs.filter(s=>s.val>0).length;
  const start=-Math.PI/2, dur=850, t0=performance.now();
  const ease=t=>1-Math.pow(1-t,3);
  function frame(now){
    const p=Math.min(1,(now-t0)/dur), e=ease(p);
    ctx.clearRect(0,0,size,size); track();
    let a=start;
    data.segs.forEach(s=>{
      if(s.val<=0) return;
      const sweep=(s.val/total)*Math.PI*2*e;
      const g=nz>1?Math.min(0.05,sweep/2):0;
      ctx.beginPath();
      ctx.arc(cx,cy,r,a+g,a+sweep-g);
      ctx.lineWidth=thick; ctx.lineCap=nz>1?'round':'butt'; ctx.strokeStyle=s.color; ctx.stroke();
      a+=sweep;
    });
    if(p<1) _pieRAF=requestAnimationFrame(frame);
  }
  _pieRAF=requestAnimationFrame(frame);
}

function saveCust(id){
  const name=(document.getElementById('f_name').value||'').trim();
  const phone=(document.getElementById('f_phone').value||'').trim();
  const rate=num(document.getElementById('f_rate').value);
  const addr=(document.getElementById('f_addr').value||'').trim();
  if(!name){ toast('Customer name is required','err'); return; }
  if(rate<=0){ toast('Enter a valid rate per litre','err'); return; }
  if(id){
    Object.assign(custBy(id),{name,phone,rate,address:addr});
  } else {
    const cid=uid();
    customers.push({id:cid,name,phone,address:addr,rate,createdAt:new Date().toISOString(),deleted:false});
    const open=num(document.getElementById('f_open')?.value);
    if(open>0) transactions.push({id:uid(),cid,date:today(),createdAt:new Date().toISOString(),type:'opening',amount:open,delta:open,note:'Opening balance'});
  }
  persist(); closeSheet(); toast(id?'Customer updated':'Customer added ✓','ok');
  if(id&&cur==='profile') render('profile'); else nav('customers');
}

/* ── DELETE CUSTOMER ── */
function confirmDelete(id){
  const c=custBy(id); if(!c) return;
  const b=balanceOf(id);
  const warn=b!==0?`<div style="background:var(--udhaarbg);border:1px solid rgba(220,38,38,.2);border-radius:12px;padding:12px 14px;margin-top:14px;font-size:12.5px;color:var(--udhaar)">
    <i class="fa-solid fa-triangle-exclamation" style="margin-right:6px"></i>
    This customer has an outstanding balance of <b>${PKR(Math.abs(b))}</b>. Deleting will archive all their records.
  </div>`:
  `<div style="background:var(--jamabg);border:1px solid rgba(5,150,105,.15);border-radius:12px;padding:10px 14px;margin-top:12px;font-size:12.5px;color:var(--jama)">
    <i class="fa-solid fa-check-circle" style="margin-right:6px"></i>Account is clear — safe to delete.
  </div>`;

  showConfirm(`
    <div style="text-align:center;margin-bottom:6px">
      <div style="width:56px;height:56px;border-radius:16px;background:var(--udhaarbg);display:grid;place-items:center;margin:0 auto 14px">
        <i class="fa-solid fa-trash-can" style="font-size:22px;color:var(--udhaar)"></i>
      </div>
      <h3 class="display" style="font-size:20px;font-weight:700;color:var(--ink)">Delete Customer?</h3>
      <p style="color:var(--sub);font-size:13px;margin-top:7px">You are about to permanently delete <b style="color:var(--ink)">${esc(c.name)}</b> and all their transaction history.</p>

    </div>
    <div style="display:flex;gap:10px;margin-top:20px">
      <button onclick="closeConfirm()" style="flex:1;padding:14px;border-radius:14px;border:1.5px solid var(--border);font-weight:700;font-size:14px;color:var(--ink2);background:var(--surface2);cursor:pointer">Cancel</button>
      <button onclick="deleteCust('${id}')" style="flex:1;padding:14px;border-radius:14px;background:linear-gradient(135deg,#DC2626,#B91C1C);color:#fff;font-weight:800;font-size:14px;border:none;cursor:pointer"><i class="fa-solid fa-trash-can" style="margin-right:7px"></i>Delete</button>
    </div>`);
}

function deleteCust(id){
  const c=custBy(id); if(!c) return;
  c.deleted=true;
  persist(); closeConfirm();
  toast('Customer deleted','err');
  if(cur==='profile') nav('customers'); else render(cur);
}

/* ────────────────────────────────────────
   7. PROFILE / LEDGER SCREEN
──────────────────────────────────────── */
function renderProfile(){
  clearFab();
  const el=S('profile');
  const c=custBy(profId); if(!c){ nav('customers'); return; }
  const b=balanceOf(c.id); const t=balTag(b);
  const rows=transactions.filter(x=>x.cid===c.id&&!x.reversed)
    .sort((a,bx)=>bx.date.localeCompare(a.date)||(bx.createdAt||'').localeCompare(a.createdAt||''));

  <div style="padding-bottom:24px">
    <!-- Balance banner -->
    <div style="padding:14px 14px 0">
      <div style="border-radius:20px;padding:20px;background:${b>0?'linear-gradient(135deg,#991B1B,#DC2626)':b<0?'linear-gradient(135deg,#065F46,#059669)':'var(--brand-grad)'};color:#fff;text-align:center">
        <p style="font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;opacity:.8;font-weight:600">${b>0?'Outstanding Udhaar':b<0?'Advance (Jama)':'Account Clear'}</p>
        <p class="display tnum" style="font-size:34px;font-weight:800;line-height:1.1;margin:8px 0">${t.txt}</p>
        <div style="display:flex;align-items:center;justify-content:center;gap:12px;font-size:12px;opacity:.8;flex-wrap:wrap">
          <span><i class="fa-solid fa-phone" style="font-size:10px;margin-right:4px"></i>${esc(c.phone||'—')}</span>
          <span>·</span><span>${PKR(c.rate)}/L</span>
          ${c.address?`<span>·</span><span>${esc(c.address)}</span>`:''}
        </div>
      </div>
    </div>

    <!-- Action buttons -->
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px 14px 0">
      <button onclick="openEntrySheet('milk','${c.id}')"
        style="padding:14px;border-radius:15px;background:linear-gradient(135deg,#DC2626,#B91C1C);color:#fff;font-weight:800;font-size:14px;display:flex;align-items:center;justify-content:center;gap:8px;border:none;cursor:pointer">
        <i class="fa-solid fa-mug-hot"></i> Milk Delivered
      </button>
      <button onclick="openEntrySheet('pay','${c.id}')"
        style="padding:14px;border-radius:15px;background:linear-gradient(135deg,#059669,#047857);color:#fff;font-weight:800;font-size:14px;display:flex;align-items:center;justify-content:center;gap:8px;border:none;cursor:pointer">
        <i class="fa-solid fa-hand-holding-dollar"></i> Payment
      </button>
    </div>

    <!-- Secondary actions -->
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:8px 14px 0">
      <button onclick="openReceiptModal('${c.id}')"
        style="padding:12px;border-radius:13px;background:var(--surface);border:1px solid var(--border);font-weight:700;font-size:13.5px;color:var(--ink);display:flex;align-items:center;justify-content:center;gap:7px;cursor:pointer">
        <i class="fa-solid fa-receipt" style="color:var(--gold)"></i> Receipt
      </button>
      <button onclick="openCustSheet('${c.id}')"
        style="padding:12px;border-radius:13px;background:var(--surface);border:1px solid var(--border);font-weight:700;font-size:13.5px;color:var(--ink);display:flex;align-items:center;justify-content:center;gap:7px;cursor:pointer">
        <i class="fa-solid fa-pen" style="color:var(--sub)"></i> Edit Info
      </button>

    <!-- Ledger header -->
    <div style="display:flex;align-items:center;justify-content:space-between;padding:18px 16px 10px">
      <h3 style="font-weight:700;font-size:15px;color:var(--ink)">Account Ledger</h3>
      <span style="font-size:11.5px;color:var(--sub)">${rows.length} entries</span>
    </div>

    <!-- Ledger rows -->
    <div style="padding:0 14px;display:flex;flex-direction:column;gap:7px">
      ${rows.length?rows.map((x,i)=>ledgerRow(x,rMap[x.id],i)).join('')

}

function ledgerRow(x,running,i){
  const isPay=x.type==='pay';
  const clr=isPay?'var(--jama)':'var(--udhaar)';
  const bg=isPay?'var(--jamabg)':'var(--udhaarbg)';
  const ic=isPay?'fa-hand-holding-dollar':x.type==='milk'?'fa-mug-hot':'fa-scale-balanced';
  const title=x.type==='milk'?'Milk Delivered':x.type==='pay'?'Payment Received':x.type==='opening'?'Opening Balance':'Adjustment';
  const meta=x.type==='milk'?`${Litr(x.qty)} × ${PKR(x.rate)}`
    :x.type==='pay'?(x.method||'Cash')+(x.note?` · ${esc(x.note)}`:'')
    :(x.note||'');
  const rb=balTag(running);
  return `<div class="a-up" style="animation-delay:${Math.min(i*20,280)}ms;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:12px 14px;display:flex;align-items:center;gap:11px">
    <span style="width:36px;height:36px;border-radius:10px;background:${bg};color:${clr};display:grid;place-items:center;flex-shrink:0">
      <i class="fa-solid ${ic}" style="font-size:13px"></i>
    </span>
    <span style="flex:1;min-width:0">
      <span style="display:block;font-weight:700;font-size:13.5px;color:var(--ink)">${title}</span>
      <span style="display:block;font-size:11px;color:var(--sub);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${meta}</span>
      <span style="display:block;font-size:10.5px;color:var(--sub);margin-top:2px;font-weight:600">${fmtMini(x.date)}</span>
    </span>
    <span style="text-align:right;flex-shrink:0">
      <span class="tnum" style="display:block;font-weight:800;font-size:14px;color:${clr}">${isPay?'−':'+'}${PKR(x.amount)}</span>
      <span class="tnum" style="display:block;font-size:10.5px;color:${rb.fg};margin-top:2px">Bal ${rb.txt}</span>
    </span>
    ${x.type!=='opening'?`<button onclick="reverseTx('${x.id}')" style="width:30px;height:30px;border-radius:8px;background:var(--surface2);color:var(--sub);display:grid;place-items:center;border:1px solid var(--border);cursor:pointer;flex-shrink:0" title="Reverse entry">
      <i class="fa-solid fa-rotate-left" style="font-size:11px"></i>
    </button>`:''}
  </div>`;
}

/* ────────────────────────────────────────
   8. ENTRY SHEETS (Milk / Payment)
──────────────────────────────────────── */
function openEntrySheet(type,cid){
  const c=custBy(cid); const bal=balanceOf(cid);
  const isMilk=type==='milk';
  const accent=isMilk?'linear-gradient(135deg,#DC2626,#B91C1C)':'linear-gradient(135deg,#059669,#047857)';
  const bt=balTag(bal);

  openSheet(`
    <div style="padding:16px 20px 12px;flex-shrink:0;border-bottom:1px solid var(--border)">
      <div style="width:40px;height:5px;border-radius:99px;background:var(--border);margin:0 auto 14px"></div>
      <div style="display:flex;align-items:center;gap:11px">
        <span style="width:42px;height:42px;border-radius:13px;background:${accent};display:grid;place-items:center;flex-shrink:0">
          <i class="fa-solid ${isMilk?'fa-mug-hot':'fa-hand-holding-dollar'}" style="color:#fff;font-size:16px"></i>
        </span>
        <div>
          <h3 class="display" style="font-size:18px;font-weight:700;color:var(--ink)">${isMilk?'Milk Delivered':'Payment Received'}</h3>
          <p style="font-size:12px;color:var(--sub)">${esc(c.name)} · <span style="color:${bt.fg};font-weight:700">${bt.lbl} ${bt.txt}</span></p>
        </div>
      </div>
    </div>

    <div class="scroll" style="flex:1;min-height:0;padding:18px 20px;display:flex;flex-direction:column;gap:14px">
      <div>
        <label class="label">Date</label>
        <input id="e_date" type="date" class="field mono" value="${today()}" max="${today()}">
      </div>

      ${isMilk?`
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
          <div>
            <label class="label">Quantity (Litres) *</label>
            <input id="e_qty" type="number" inputmode="decimal" step="0.25" min="0" class="field mono" style="text-align:center;font-size:20px;font-weight:800" placeholder="0.00" oninput="calcMilk(${c.rate})">
          </div>
          <div>
            <label class="label">Rate (Rs/L)</label>
            <input id="e_rate" type="number" inputmode="decimal" class="field mono" style="text-align:center;font-size:20px;font-weight:800" value="${c.rate}" oninput="calcMilk()">
          </div>
        </div>
        <div style="background:var(--udhaarbg);border-radius:14px;padding:14px 16px;display:flex;align-items:center;justify-content:space-between">
          <span style="font-size:13px;font-weight:600;color:var(--udhaar)">Bill Amount</span>
          <span class="display tnum" id="e_calc" style="font-size:24px;font-weight:800;color:var(--udhaar)">Rs 0</span>
        </div>
      `:`
        <div>
          <label class="label">Amount Received (Rs) *</label>
          <input id="e_amt" type="number" inputmode="decimal" class="field mono" style="text-align:center;font-size:22px;font-weight:800" placeholder="0" oninput="calcPay(${bal})">
        </div>
        <div>
          <label class="label">Payment Method</label>
          <select id="e_method" class="field">
            ${['Cash','JazzCash','EasyPaisa','Bank Transfer','Other'].map(x=>`<option>${x}</option>`).join('')}
          </select>
        </div>
        <div id="e_balPreview" style="background:var(--surface2);border-radius:14px;padding:14px 16px;border:1px solid var(--border)"></div>
      `}

      <div>
        <label class="label">Note (optional)</label>
        <input id="e_note" class="field" placeholder="Add a note…">
      </div>
    </div>

    <div style="padding:14px 20px;padding-bottom:calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--border);display:flex;gap:10px;flex-shrink:0">
      <button onclick="closeSheet()" style="flex:1;padding:14px;border-radius:14px;border:1.5px solid var(--border);font-weight:700;font-size:15px;color:var(--ink2);background:var(--surface2);cursor:pointer">Cancel</button>
      <button onclick="saveEntry('${type}','${cid}')" style="flex:1;padding:14px;border-radius:14px;background:${accent};color:#fff;font-weight:800;font-size:15px;border:none;cursor:pointer">Save Entry</button>
    </div>`);

  if(!isMilk) calcPay(bal);
  setTimeout(()=>document.getElementById(isMilk?'e_qty':'e_amt')?.focus(),130);
}

function calcMilk(def){
  const q=num(document.getElementById('e_qty').value);
  const r=num(document.getElementById('e_rate').value)||num(def);
  const el=document.getElementById('e_calc'); if(el) el.textContent=PKR(q*r);
}

function calcPay(bal){
  const amt=num(document.getElementById('e_amt')?.value);
  const after=bal-amt;
  const box=document.getElementById('e_balPreview'); if(!box) return;
  const fmt=v=>v>0?`<b style="color:var(--udhaar)">${PKR(v)} Udhaar</b>`:v<0?`<b style="color:var(--jama)">${PKR(-v)} Advance</b>`:`<b style="color:var(--jama)">Account Clear ✓</b>`;
  box.innerHTML=`
    <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:8px">
      <span style="color:var(--sub)">Current Balance</span>${fmt(bal)}
    </div>
    <div style="height:1px;background:var(--border);margin-bottom:8px"></div>
    <div style="display:flex;justify-content:space-between;font-size:13px">
      <span style="color:var(--sub)">After Payment</span>${fmt(after)}
    </div>`;
}

function saveEntry(type,cid){
  const date=document.getElementById('e_date').value||today();
  const note=(document.getElementById('e_note').value||'').trim();
  if(type==='milk'){
    const qty=num(document.getElementById('e_qty').value);
    const rate=num(document.getElementById('e_rate').value)||custBy(cid).rate;
    if(qty<=0){ toast('Enter milk quantity','err'); return; }
    const amount=+(qty*rate).toFixed(2);
    transactions.push({id:uid(),cid,date,createdAt:new Date().toISOString(),type:'milk',qty,unit:'L',rate,amount,delta:amount,note});
    toast('Milk entry saved','ok');
  } else {
    const amt=num(document.getElementById('e_amt').value);
    if(amt<=0){ toast('Enter payment amount','err'); return; }
    const method=document.getElementById('e_method').value;
    transactions.push({id:uid(),cid,date,createdAt:new Date().toISOString(),type:'pay',amount:amt,delta:-amt,method,note});
    toast('Payment recorded ✓','ok');
  }
  persist(); closeSheet(); render('profile');
}

function reverseTx(txid){
  const t=transactions.find(x=>x.id===txid); if(!t) return;
  showConfirm(`
    <div style="text-align:center">
      <div style="width:48px;height:48px;border-radius:14px;background:var(--udhaarbg);display:grid;place-items:center;margin:0 auto 14px">
        <i class="fa-solid fa-rotate-left" style="font-size:20px;color:var(--udhaar)"></i>
      </div>
      <h3 class="display" style="font-size:18px;font-weight:700;color:var(--ink)">Reverse this entry?</h3>
      <p style="color:var(--sub);font-size:13px;margin-top:8px">A reversing adjustment will be added. Nothing is deleted — the ledger stays auditable.</p>
      <div style="display:flex;gap:10px;margin-top:18px">
        <button onclick="closeConfirm()" style="flex:1;padding:13px;border-radius:13px;border:1.5px solid var(--border);font-weight:700;color:var(--ink2);background:var(--surface2);font-size:14px;cursor:pointer">Cancel</button>
        <button onclick="_doReverse('${txid}')" style="flex:1;padding:13px;border-radius:13px;background:linear-gradient(135deg,#DC2626,#B91C1C);color:#fff;font-weight:800;font-size:14px;border:none;cursor:pointer">Reverse</button>
      </div>
    </div>`);
}
function _doReverse(txid){
  const t=transactions.find(x=>x.id===txid); if(!t) return;
  transactions.push({id:uid(),cid:t.cid,date:t.date,createdAt:new Date().toISOString(),type:'adj',amount:t.amount,delta:-num(t.delta),reverses:t.id,note:'Reversed entry'});
  t.reversed=true; persist(); closeConfirm(); toast('Entry reversed','ok'); render('profile');
}

/* ────────────────────────────────────────
   9. BANK-STYLE RECEIPT ENGINE
──────────────────────────────────────── */
let _rcid=null, _rscope='month', _rmonth=mkKey(), _rfrom=mkKey()+'-01', _rto=today();

function openReceiptModal(cid){
  _rcid=cid; _rscope='month'; _rmonth=mkKey(); _rfrom=mkKey()+'-01'; _rto=today();
  const scroll=document.getElementById('receiptScroll');
  const old=scroll&&scroll.querySelector('#rCtrl'); if(old) old.remove();
  _buildReceiptModal();
  document.getElementById('receiptModal').classList.remove('hidden');
  document.body.style.overflow='hidden';
}

function closeReceiptModal(){
  document.getElementById('receiptModal').classList.add('hidden');
  document.body.style.overflow='';
}

function _buildReceiptModal(){
  const wrap=document.getElementById('receiptPreviewWrap'); if(!wrap) return;
  wrap.innerHTML=buildReceiptHTML(_rcid);

  const scroll=document.getElementById('receiptScroll');
  scroll.querySelector('#rCtrl')||_injectReceiptCtrl(scroll);
  const A='flex:1;padding:9px 4px;border-radius:10px;font-weight:800;font-size:12.5px;cursor:pointer;border:none;background:var(--gold-grad);color:#1a0e00';
  const I='flex:1;padding:9px 4px;border-radius:10px;font-weight:800;font-size:12.5px;cursor:pointer;border:1.5px solid var(--border);background:var(--surface);color:var(--sub)';
  document.getElementById('rTab_m').style.cssText=_rscope==='month'?A:I;
  document.getElementById('rTab_r').style.cssText=_rscope==='range'?A:I;
  document.getElementById('rTab_a').style.cssText=_rscope==='all'?A:I;
  document.getElementById('rMonthPick').style.display=_rscope==='month'?'block':'none';
  document.getElementById('rRangePick').style.display=_rscope==='range'?'grid':'none';
}

function _injectReceiptCtrl(scroll){
  const inp='width:100%;border:1.5px solid var(--border);border-radius:11px;padding:11px 12px;font-size:13.5px;font-weight:700;color:var(--ink);background:var(--surface);outline:none';
  const lab='font-size:10px;font-weight:700;color:var(--sub);letter-spacing:.05em;text-transform:uppercase;display:block;margin-bottom:5px';
  const div=document.createElement('div');
  div.id='rCtrl';
  div.style.cssText='margin-bottom:14px;display:flex;flex-direction:column;gap:9px';
  div.innerHTML=`
    <div style="display:flex;gap:7px">
      <button id="rTab_m" onclick="_setRScope('month')">Month</button>
      <button id="rTab_r" onclick="_setRScope('range')">Date Range</button>
      <button id="rTab_a" onclick="_setRScope('all')">Full History</button>
    </div>
    <div id="rMonthPick">
      <input type="month" value="${_rmonth}" style="${inp}" onchange="_rmonth=this.value;_refreshReceipt()">
    </div>
    <div id="rRangePick" style="grid-template-columns:1fr 1fr;gap:8px">
      <div>
        <label style="${lab}">From Date</label>
        <input type="date" value="${_rfrom}" max="${today()}" style="${inp}" onchange="_rfrom=this.value;_refreshReceipt()">
      </div>
      <div>
        <label style="${lab}">To Date</label>
        <input type="date" value="${_rto}" max="${today()}" style="${inp}" onchange="_rto=this.value;_refreshReceipt()">
      </div>
    </div>`;
  scroll.insertBefore(div, scroll.firstChild);
  return div;
}

function _setRScope(s){ _rscope=s; _buildReceiptModal(); }
function _refreshReceipt(){
  const wrap=document.getElementById('receiptPreviewWrap'); if(!wrap) return;
  wrap.innerHTML=buildReceiptHTML(_rcid);
}

/* ── SIMPLE STATEMENT / RECEIPT BUILDER ── */
function buildReceiptHTML(cid){
  const c=custBy(cid); if(!c) return '';
  const all=transactions.filter(t=>t.cid===cid&&!t.reversed)
    .sort((a,b)=>a.date.localeCompare(b.date)||(a.createdAt||'').localeCompare(b.createdAt||''));

  let rows, opening, periodLabel, openLabel='';
  if(_rscope==='range'){
    let f=_rfrom||('0000-01-01'), tt=_rto||today(); if(f>tt){ const x=f; f=tt; tt=x; }
    rows=all.filter(t=>t.date>=f&&t.date<=tt);
    opening=all.filter(t=>t.date<f).reduce((s,t)=>s+num(t.delta),0);
    periodLabel=`${fmtShort(f)} — ${fmtShort(tt)}`;
    openLabel=fmtMini(f);
  } else if(_rscope==='all'){
    rows=all; opening=0; periodLabel='Full Account History';
  } else {
    rows=all.filter(t=>mkKey(t.date)===_rmonth);
    opening=all.filter(t=>t.date<(_rmonth+'-01')).reduce((s,t)=>s+num(t.delta),0);
    periodLabel=monthLbl(_rmonth);
    openLabel=fmtMini(_rmonth+'-01');
  }

  // running balance pill (banking Dr/Cr style)
  const balCol=v=>v>0?`<span style="color:#B23A2A;font-weight:800">${PKR(v)} <span style="font-size:8.5px;font-weight:700">Dr</span></span>`
    :v<0?`<span style="color:#1E8B4C;font-weight:800">${PKR(-v)} <span style="font-size:8.5px;font-weight:700">Cr</span></span>`
    :`<span style="color:#8A7357;font-weight:700">Rs 0</span>`;

  let run=opening,milkAmt=0,milkLt=0,paidAmt=0;
  const body=rows.map((t,i)=>{
    run+=num(t.delta);
    if(t.type==='milk'){ milkAmt+=num(t.amount); milkLt+=num(t.qty); }
    if(t.type==='pay') paidAmt+=num(t.amount);
    const detail=t.type==='milk'?`Milk — ${Litr(t.qty)} @ ${PKR(t.rate)}/L`

async function receiptDownload(kind){
  const c=custBy(_rcid);
  const btn=document.getElementById(kind==='png'?'btnDlPng':'btnDlPdf');
  const orig=btn.innerHTML; btn.innerHTML='<i class="fa-solid fa-spinner fa-spin"></i> Preparing…';
  btn.style.opacity='.7'; btn.style.pointerEvents='none';
  toast('Preparing receipt…','info');
  try{
    const stage=document.getElementById('exportStage');
    stage.innerHTML=buildReceiptHTML(_rcid);
    await new Promise(r=>setTimeout(r,120));
    const canvas=await html2canvas(stage.firstElementChild,{scale:2.6,backgroundColor:'#ffffff',useCORS:true,logging:false});
    stage.innerHTML='';
    const tag=_rscope==='month'?_rmonth:'full';
    const fname=`${c.name.replace(/\s+/g,'_')}_${tag}_${Date.now()}`;
    if(kind==='png'){
      const a=document.createElement('a'); a.href=canvas.toDataURL('image/png'); a.download=fname+'.png'; a.click();
      toast('PNG saved — share on WhatsApp ✓','ok');
    } else {
      const {jsPDF}=window.jspdf; const pdf=new jsPDF({orientation:'p',unit:'mm',format:'a4'});
      const pw=190, ph=canvas.height*pw/canvas.width;
      let y=10, rem=ph;
      while(rem>0){
        const sh=Math.min(277,rem);
        if(ph<=277){ pdf.addImage(canvas.toDataURL('image/png'),'PNG',10,y,pw,ph); break; }
        const slice=document.createElement('canvas');
        slice.width=canvas.width; const sliceH=(sh/ph)*canvas.height;
        slice.height=sliceH;
        slice.getContext('2d').drawImage(canvas,0,canvas.height-rem/ph*canvas.height,canvas.width,sliceH,0,0,canvas.width,sliceH);
        pdf.addImage(slice.toDataURL(),'PNG',10,10,pw,sh);
        rem-=sh; if(rem>0) pdf.addPage();
      }
      pdf.save(fname+'.pdf');
      toast('PDF saved ✓','ok');
    }
  }catch(e){ console.error(e); toast('Export failed — please try again','err'); }
  btn.innerHTML=orig; btn.style.opacity=''; btn.style.pointerEvents='';
}

/* Ask the browser to keep this app's storage durable (won't auto-evict). */
async function requestPersist(){
  try{
    if(navigator.storage&&navigator.storage.persist){
      const has=await navigator.storage.persisted();
      if(!has) await navigator.storage.persist();
    }
  }catch{}
}
function markBackup(){ try{ localStorage.setItem(KEYS.backup,new Date().toISOString()); }catch{} }

function doBackup(){
  try{
    const payload={app:'RanaAhmadMilkShop',v:3,at:new Date().toISOString(),
      counts:{customers:customers.length,transactions:transactions.length},
      customers,transactions};
    const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
    a.download=`RanaAhmadMilkShop_Backup_${today()}.json`; a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),4000);
    markBackup();
    toast('Backup saved ✓ Keep the file safe','ok');
  }catch(e){ console.error(e); toast('Backup failed — try again','err'); }
}

/* Gentle reminder to back up if data exists and none was taken recently. */
function backupNudge(){
  if(!customers.length&&!transactions.length) return;
  const last=localStorage.getItem(KEYS.backup);
  const stale=!last||(Date.now()-new Date(last).getTime())>7*864e5;
  if(stale) setTimeout(()=>toast('Tip: tap the ☁ icon to back up your data','warn'),1600);
}
function doRestore(ev){
  const f=ev.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const d=JSON.parse(r.result);
      if(!Array.isArray(d.customers)||!Array.isArray(d.transactions)) throw 0;
      showConfirm(`
        <div style="text-align:center">
          <div style="width:48px;height:48px;border-radius:14px;background:var(--udhaarbg);display:grid;place-items:center;margin:0 auto 14px">
            <i class="fa-solid fa-cloud-arrow-up" style="font-size:20px;color:var(--udhaar)"></i>
          </div>
          <h3 class="display" style="font-size:18px;font-weight:700;color:var(--ink)">Restore Backup?</h3>
          <p style="color:var(--sub);font-size:13px;margin-top:8px">This will <b>replace all current data</b> on this device with the backup file. This cannot be undone.</p>
          <div style="display:flex;gap:10px;margin-top:18px">
            <button onclick="closeConfirm()" style="flex:1;padding:13px;border-radius:13px;border:1.5px solid var(--border);font-weight:700;color:var(--ink2);background:var(--surface2);cursor:pointer;font-size:14px">Cancel</button>
            <button id="doRestoreBtn" style="flex:1;padding:13px;border-radius:13px;background:linear-gradient(135deg,#B23A2A,#8A2A1E);color:#fff;font-weight:800;font-size:14px;border:none;cursor:pointer">Restore</button>
          </div>
        </div>`);
      document.getElementById('doRestoreBtn').onclick=()=>{
        customers=d.customers; transactions=d.transactions; persist(); markBackup();
        closeConfirm(); toast('Data restored ✓','ok'); nav('home');
      };
    }catch{ toast('Invalid backup file','err'); }
  };
  r.readAsText(f); ev.target.value='';
}

/* ────────────────────────────────────────
   12. UI PRIMITIVES
──────────────────────────────────────── */
/* ── Bottom Sheet (race-condition-safe) ── */
function openSheet(html){
  if(_closeTimer){ clearTimeout(_closeTimer); _closeTimer=null; }
  const root=document.getElementById('sheetRoot');
  const card=document.getElementById('sheetCard');
  card.style.animation='';
  card.innerHTML=html;
  root.hidden=false;
  card.className='modal-card a-sheet';
}
function closeSheet(){
  const card=document.getElementById('sheetCard');
  card.style.animation='sheetUp .28s reverse forwards';
  _closeTimer=setTimeout(()=>{
    document.getElementById('sheetRoot').hidden=true;
    card.style.animation='';
    _closeTimer=null;
  },270);
}
document.getElementById('sheetRoot').addEventListener('click',e=>{
  if(e.target.id==='sheetRoot') closeSheet();
});

/* ── Confirm Modal ── */
function showConfirm(html){
  const root=document.getElementById('confirmRoot');
  document.getElementById('confirmCard').innerHTML=html;
  root.hidden=false;
}
function closeConfirm(){
  document.getElementById('confirmRoot').hidden=true;
}
document.getElementById('confirmRoot').addEventListener('click',e=>{
  if(e.target.id==='confirmRoot') closeConfirm();
});

/* ── FAB ── */
function addFab(){
  clearFab();
  const b=document.createElement('button');
  b.className='fab-btn a-pop tap';
  b.setAttribute('data-fab','');
  b.innerHTML='<i class="fa-solid fa-plus"></i> Customer';
  b.onclick=openCustSheet;
  document.getElementById('app').appendChild(b);
}
function clearFab(){ document.querySelectorAll('[data-fab]').forEach(f=>f.remove()); }

/* ── Toast ── */
function toast(msg,kind='info'){
  const bg={ok:'var(--jama)',err:'var(--udhaar)',info:'var(--navy)',warn:'var(--gold)'}[kind]||'var(--navy)';
  const ic={ok:'fa-check-circle',err:'fa-circle-xmark',info:'fa-circle-info',warn:'fa-triangle-exclamation'}[kind]||'fa-circle-info';
  const t=document.createElement('div');
  t.style.cssText=`background:${bg};color:#fff;padding:12px 16px;border-radius:14px;font-size:13.5px;font-weight:700;display:flex;align-items:center;gap:10px;box-shadow:var(--shadow-lg);pointer-events:auto`;
  t.className='a-pop';
  t.innerHTML=`<i class="fa-solid ${ic}" style="font-size:15px;flex-shrink:0"></i><span>${msg}</span>`;
  const box=document.getElementById('toastBox');
  box.appendChild(t);
  setTimeout(()=>{ t.style.transition='opacity .3s,transform .3s'; t.style.opacity='0'; t.style.transform='translateY(8px)'; setTimeout(()=>t.remove(),320); },2200);
}

/* ── Helpers ── */
const S  = scr => document.querySelector(`[data-screen="${scr}"]`);
function emptyState(ic,title,sub){
  return `<div class="a-up" style="text-align:center;padding:40px 20px">
    <div style="width:60px;height:60px;border-radius:16px;background:var(--surface);border:1px solid var(--border);display:grid;place-items:center;margin:0 auto 14px">
      <i class="fa-solid ${ic}" style="font-size:22px;color:var(--sub)"></i>
    </div>
    <h3 style="font-size:18px;font-weight:700;color:var(--ink)">${title}</h3>

    <button onclick="openCustSheet()" style="margin-top:18px;background:var(--gold-grad);color:#1a0e00;font-weight:700;font-size:14px;padding:11px 20px;border-radius:13px;border:none;cursor:pointer">
      <i class="fa-solid fa-user-plus" style="margin-right:6px"></i>Add Customer
    </button>
  </div>`;
}

/* ────────────────────────────────────────
   13. ONLINE / OFFLINE
──────────────────────────────────────── */
function checkOnline(){
  document.getElementById('offlineBanner').style.display=navigator.onLine?'none':'block';
}
window.addEventListener('online',checkOnline);
window.addEventListener('offline',checkOnline);
checkOnline();

/* ────────────────────────────────────────
   14. SERVICE WORKER (offline / installable)
──────────────────────────────────────── */
if('serviceWorker' in navigator){
  let _reloaded=false;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{
    if(_reloaded) return; _reloaded=true; location.reload();
  });
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('sw.js').then(reg=>{
      reg.addEventListener('updatefound',()=>{
        const nw=reg.installing; if(!nw) return;
        nw.addEventListener('statechange',()=>{
          if(nw.state==='installed'&&navigator.serviceWorker.controller){
            nw.postMessage('SKIP_WAITING'); // activate the fresh version
          }
        });
      });
    }).catch(console.warn);
  });
}

/* ── BOOT ── */
(function boot(){
  const lg=document.getElementById('brandLogo'); if(lg) lg.src=LOGO;
  requestPersist();
  nav('home');
  backupNudge();
})();
</script>
